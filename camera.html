<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#07080a;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
    color:#eceded;font-size:14px;-webkit-font-smoothing:antialiased;
    touch-action:manipulation;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
  }
  .app{
    position:fixed;inset:0;display:flex;flex-direction:column;
    height:100vh;height:100dvh;overflow:hidden;
    background:radial-gradient(120% 80% at 50% 0%,#14171b 0%,#08090b 60%,#050607 100%);
    padding-top:env(safe-area-inset-top);
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  }

  /* ---------- top bar ---------- */
  .topbar{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:8px;padding:8px 12px 6px;min-height:46px;
  }
  .ratios{display:flex;gap:5px;background:rgba(255,255,255,.055);padding:3px;border-radius:11px}
  .rchip{
    appearance:none;border:0;background:transparent;color:#9a9ea4;font:inherit;font-size:12.5px;
    font-weight:600;padding:5px 9px;border-radius:8px;letter-spacing:.2px;
  }
  .rchip.on{background:#e9ddc6;color:#15171a}
  .tools{display:flex;gap:6px;align-items:center}
  .tbtn{
    appearance:none;border:0;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
    background:rgba(255,255,255,.06);color:#cfd2d6;padding:0;
  }
  .tbtn svg{width:19px;height:19px;display:block}
  .tbtn.on{background:rgba(233,221,198,.92);color:#15171a}
  .tbtn:active{transform:scale(.94)}
  .tbtn.off{opacity:.42}

  /* ---------- stage ---------- */
  .stagewrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 7px}
  .stage{
    position:relative;border-radius:16px;overflow:hidden;background:#000;
    box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);
    touch-action:none;
  }
  .stage canvas{display:block;width:100%;height:100%}
  .stage .badge{
    position:absolute;top:9px;left:9px;font-size:11px;font-weight:700;letter-spacing:.6px;
    padding:4px 8px;border-radius:7px;background:rgba(0,0,0,.55);color:#e9ddc6;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .12s;
  }
  .stage .badge.show{opacity:1}
  .stage .hint{
    position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
    font-size:11px;color:rgba(255,255,255,.82);background:rgba(0,0,0,.42);
    padding:5px 10px;border-radius:20px;white-space:nowrap;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:opacity .5s;pointer-events:none;
  }
  .stage .hint.hide{opacity:0}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
  .flash.go{animation:fl .32s ease-out}
  @keyframes fl{0%{opacity:.95}100%{opacity:0}}

  /* permission / message overlay */
  .perm{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;text-align:center;padding:22px;background:linear-gradient(180deg,#15180d00,#0c0e1100),#0d0f12;
  }
  .perm.show{display:flex}
  .perm .ico{font-size:30px;opacity:.85}
  .perm h3{margin:0;font-size:15px;font-weight:700;color:#ecebe7}
  .perm p{margin:0;font-size:12.5px;line-height:1.55;color:#93989f;max-width:270px}
  .perm button{
    appearance:none;border:0;margin-top:4px;padding:11px 18px;border-radius:12px;font:inherit;
    font-weight:700;font-size:13.5px;background:#e9ddc6;color:#15171a;
  }
  .perm button.ghost{background:rgba(255,255,255,.1);color:#dcdfe3}
  .perm .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

  /* ---------- dock ---------- */
  .dock{
    flex:0 0 auto;padding:8px 0 calc(6px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(8,9,11,0) 0%,rgba(8,9,11,.75) 22%,#08090b 60%);
  }
  .presetrow{display:flex;align-items:center;gap:6px;padding:0 10px}
  .presets{
    flex:1 1 auto;min-width:0;display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;
    padding:4px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    -webkit-mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 26px),transparent 100%);
    mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 26px),transparent 100%);
  }
  .presets::-webkit-scrollbar{display:none}
  .pchip{
    appearance:none;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.045);
    color:#b3b7bd;font:inherit;font-size:12.5px;font-weight:600;white-space:nowrap;
    padding:7px 13px;border-radius:20px;flex:0 0 auto;transition:background .15s,color .15s;
  }
  .pchip.on{background:#e9ddc6;border-color:#e9ddc6;color:#15171a}
  .pchip.cmp{background:transparent;border-style:dashed;color:#8f959c}
  .pchip.cmp:active,.pchip.cmp.on{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.3)}
  .tunebtn{
    appearance:none;border:0;flex:0 0 auto;height:32px;padding:0 11px;border-radius:16px;font:inherit;
    font-size:12px;font-weight:600;background:rgba(255,255,255,.06);color:#a8adb3;
    display:flex;align-items:center;gap:4px;
  }

    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error("shader", gl.getShaderInfoLog(sh));
      return null;
    }
    return sh;
  }
  var vs = compile(gl.VERTEX_SHADER, VS_SRC);
  var fs = compile(gl.FRAGMENT_SHADER, FS_SRC);
  if (!vs || !fs) return;
  var prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error("link", gl.getProgramInfoLog(prog));
    return;
  }
  gl.useProgram(prog);
  this.prog = prog;

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  this.tex = tex;

  var u = {};
  ["uTex","uCover","uPx","uMirror","uStrength","uExposure","uContrast","uSat","uFade","uRoll",
   "uWarmth","uTint","uShadowTint","uShadowAmt","uHighTint","uHighAmt","uFloor","uGreen","uBlue",
   "uVig","uClarity","uGrain","uGrainScale","uSeed","uMono","uGreenHue","uRed"].forEach(function(n){ u[n] = gl.getUniformLocation(prog, n); });
  this.u = u;
  gl.uniform1i(u.uTex, 0);
  gl.clearColor(0,0,0,1);
  this.ok = true;
}

GLRenderer.prototype.setSize = function(w, h){
  if (this.canvas.width !== w) this.canvas.width = w;
  if (this.canvas.height !== h) this.canvas.height = h;
};

GLRenderer.prototype.render = function(src, P, o){
  if (!this.ok) return;
  var gl = this.gl;
  gl.viewport(0, 0, this.canvas.width, this.canvas.height);
  gl.useProgram(this.prog);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, this.tex);
  try {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  } catch(e){ return; }

  var u = this.u;
  gl.uniform2f(u.uCover, o.cover[0], o.cover[1]);
  gl.uniform2f(u.uPx, this.canvas.width, this.canvas.height);
  gl.uniform1f(u.uMirror, o.mirror ? 1 : 0);
  gl.uniform1f(u.uStrength, o.strength);
  gl.uniform1f(u.uExposure, P.exposure);
  gl.uniform1f(u.uContrast, P.contrast);
  gl.uniform1f(u.uSat, P.sat);
  gl.uniform1f(u.uFade, P.fade);
  gl.uniform1f(u.uRoll, P.roll);
  gl.uniform1f(u.uWarmth, P.warmth);
  gl.uniform1f(u.uTint, P.tint);
  gl.uniform3f(u.uShadowTint, P.shadow[0], P.shadow[1], P.shadow[2]);
  gl.uniform1f(u.uShadowAmt, P.shadowAmt);
  gl.uniform3f(u.uHighTint, P.high[0], P.high[1], P.high[2]);
  gl.uniform1f(u.uHighAmt, P.highAmt);
  gl.uniform3f(u.uFloor, FLOOR_COLOR[0], FLOOR_COLOR[1], FLOOR_COLOR[2]);
  gl.uniform1f(u.uGreen, P.green);
  gl.uniform1f(u.uBlue, P.blue);
  gl.uniform1f(u.uVig, P.vig);
  gl.uniform1f(u.uClarity, P.clarity || 0);
  gl.uniform1f(u.uGrain, P.grain);
  gl.uniform1f(u.uGrainScale, o.grainScale);
  gl.uniform1f(u.uSeed, o.seed);
  gl.uniform1f(u.uMono, P.mono);
  gl.uniform1f(u.uGreenHue, P.greenHue || 0);
  gl.uniform1f(u.uRed, P.red || 0);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
};

/* ---------------- Canvas2D 폴백 ---------------- */
function C2DRenderer(canvas){
  this.canvas = canvas;
  this.ctx = canvas.getContext("2d");
  this.ok = !!this.ctx;
  this.noise = document.createElement("canvas");
  this.noise.width = 128; this.noise.height = 128;
  var nc = this.noise.getContext("2d");
  var im = nc.createImageData(128,128);
  for (var i=0;i<im.data.length;i+=4){
    var v = 128 + (Math.random()-0.5)*140;
    im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255;
  }
  nc.putImageData(im,0,0);
}
C2DRenderer.prototype.setSize = function(w,h){
  if (this.canvas.width!==w) this.canvas.width=w;
  if (this.canvas.height!==h) this.canvas.height=h;
};
C2DRenderer.prototype.render = function(src, P, o){
  if (!this.ok) return;
  var ctx = this.ctx, W = this.canvas.width, H = this.canvas.height;
  var sw = src.videoWidth || src.width || W;
  var sh = src.videoHeight || src.height || H;
  ctx.save();
  ctx.clearRect(0,0,W,H);
  var bright = Math.pow(2, P.exposure) * (1 - P.fade*0.25);
  var filt = "brightness(" + bright.toFixed(3) + ") contrast(" + (1+P.contrast*0.32).toFixed(3) +
             ") saturate(" + (P.sat*(1-P.green*0.25)).toFixed(3) + ")";
  if (P.mono>0.5) filt += " grayscale(1)";
  if (P.warmth>0) filt += " sepia(" + Math.min(0.5,P.warmth*1.6).toFixed(3) + ")";
  if (ctx.filter !== undefined) ctx.filter = filt;
  if (o.mirror){ ctx.translate(W,0); ctx.scale(-1,1); }
  var scale = Math.max(W/sw, H/sh);
  var dw = sw*scale, dh = sh*scale;
  ctx.drawImage(src, (W-dw)/2, (H-dh)/2, dw, dh);
  ctx.restore();
  ctx.filter = "none";
  if (P.fade>0.001){
    ctx.globalCompositeOperation = "lighten";
    ctx.fillStyle = "rgba(" + Math.round(P.fade*FLOOR_COLOR[0]*255) + "," +
      Math.round(P.fade*FLOOR_COLOR[1]*255) + "," + Math.round(P.fade*FLOOR_COLOR[2]*255) + ",1)";
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = "source-over";
  }
  if (P.mono<0.5){
    ctx.globalCompositeOperation = "soft-light";
    ctx.fillStyle = "rgba(70,140,160," + (0.28*(1-P.shadowAmt*0.3)).toFixed(3) + ")";
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = "overlay";
    ctx.fillStyle = "rgba(255,214,170," + (0.16*P.highAmt).toFixed(3) + ")";
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = "source-over";
  }
  if (P.grain>0.0001){
    ctx.globalAlpha = Math.min(0.35, P.grain*2.2);
    var pat = ctx.createPattern(this.noise, "repeat");
    ctx.fillStyle = pat;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }
  if (P.vig>0.001 && typeof ctx.createRadialGradient === "function"){
    var g = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.30,W/2,H/2,Math.max(W,H)*0.72);
    g.addColorStop(0,"rgba(0,0,0,0)");
    g.addColorStop(1,"rgba(0,0,0," + (P.vig*1.4).toFixed(3) + ")");
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }
  if (o.strength < 0.999){
    ctx.globalAlpha = 1 - o.strength;
    if (o.mirror){ ctx.save(); ctx.translate(W,0); ctx.scale(-1,1); }
    ctx.drawImage(src, (W-dw)/2, (H-dh)/2, dw, dh);
    if (o.mirror) ctx.restore();
    ctx.globalAlpha = 1;
  }
};

/* ---------- 유틸 ---------- */
function toast(msg){
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
function currentPreset(){
  for (var i=0;i<PRESETS.length;i++) if (PRESETS[i].id === S.preset) return PRESETS[i].p;
  return PRESETS[0].p;
}
function buildParams(){
  var p = currentPreset();
  var g = S.grainOn ? (S.grain/100) * 0.080 : 0;
  return {
    exposure: p.exposure + (S.bright/50)*0.85,
    contrast: p.contrast,
    sat: p.sat,
    fade: p.fade,
    roll: p.roll,
    warmth: p.warmth + (S.warm/50)*0.10,
    tint: p.tint,
    shadow: p.shadow,
    shadowAmt: p.shadowAmt,
    high: p.high,
    highAmt: p.highAmt,
    green: p.green,
    blue: p.blue,
    vig: p.vig,
    grain: g * p.grainMul,
    mono: p.mono,
    clarity: p.clarity || 0,
    greenHue: p.greenHue || 0,
    red: p.red || 0
  };
}
function sourceSize(src){
  if (!src) return {w:1,h:1};
  if (src.videoWidth) return { w: src.videoWidth, h: src.videoHeight };
  return { w: src.width, h: src.height };
}
function coverOf(sw, sh, ar){
  var sar = sw / sh;
  var cw, ch;
  if (sar > ar) { ch = sh; cw = sh * ar; } else { cw = sw; ch = sw / ar; }
  return { cw: cw, ch: ch, cover: [cw/sw, ch/sh] };
}

/* ---------- 화면 크기 ---------- */
function layout(){
  var padX = 14;
  var availW = stagewrap.clientWidth - padX;
  var availH = stagewrap.clientHeight - 4;
  if (availW <= 0 || availH <= 0) return;
  var ar = S.ar;
  var w = Math.min(availW, availH * ar);
  var h = w / ar;
  stage.style.width = Math.round(w) + "px";
  stage.style.height = Math.round(h) + "px";
  sizeView();
}
function sizeView(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  var w = Math.max(1, Math.round(stage.clientWidth * dpr));
  var h = Math.max(1, Math.round(stage.clientHeight * dpr));
  stage.querySelector("canvas").style.width = "100%";
  stage.querySelector("canvas").style.height = "100%";
  if (view.width !== w || view.height !== h){
    view.width = w; view.height = h;
    if (renderer) renderer.setSize(w, h);
  }
}

/* ---------- 렌더 루프 ---------- */
function draw(){
  if (!source) return;
  var size = sourceSize(source);
  if (!size.w || !size.h) return;
  var cov = coverOf(size.w, size.h, S.ar);
  var P = buildParams();
  var strength = S.comparing ? 0 : (S.strength / 100);
  var gs = Math.max(1.4, Math.min(view.width, view.height) / 620);
  var o = { cover: cov.cover, mirror: S.mirror, strength: strength, seed: seed, grainScale: gs };
  if (renderer) renderer.render(source, P, o);
}

function loop(t){
  if (t - lastSeedT > 84) { seed = Math.random() * 512; lastSeedT = t; }
  draw();
  requestAnimationFrame(loop);
}

/* ---------- 카메라 ---------- */
function stopStream(){
  if (stream){ stream.getTracks().forEach(function(tr){ try{ tr.stop(); }catch(e){} }); stream = null; }
}
function showPerm(title, body, retry){
  $("permTitle").textContent = title;
  $("permBody").textContent = body;
  $("perm").classList.add("show");
  $("permRetry").style.display = retry === false ? "none" : "";
  $("btnShutter").disabled = true;
}
function hidePerm(){
  $("perm").classList.remove("show");
  $("btnShutter").disabled = false;
}

function startCamera(facing){
  return new Promise(function(resolve){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showPerm("카메라를 쓸 수 없어요",
        "HTTPS 주소에서 열어야 카메라가 열립니다. 앨범 사진으로 색감을 입힐 수 있어요.");
      resolve(false); return;
    }
    stopStream();
    var constraints = {
      audio: false,
      video: {
        facingMode: { ideal: facing },
        width: { ideal: 4032 },
        height: { ideal: 3024 }
      }
    };
    navigator.mediaDevices.getUserMedia(constraints).then(function(s){
      stream = s;
      video.srcObject = s;
      var p = video.play();
      if (p && p.catch) p.catch(function(){});
      var done = function(){
        S.mode = "camera";
        source = video;
        S.ready = true;
        hidePerm();
        document.body.classList.remove("albummode");
        $("btnAlbum").innerHTML = ALBUM_BTN_HTML;
        resolve(true);
      };
      if (video.readyState >= 2) done();
      else video.addEventListener("loadeddata", done, { once:true });
    }).catch(function(err){
      var name = err && err.name || "";
      if (name === "NotAllowedError" || name === "SecurityError"){
        showPerm("카메라를 켜 주세요",
          "아래 버튼을 누르면 카메라가 열립니다. 계속 안 되면 아이폰 설정 → Safari → 카메라를 ‘허용’으로 바꿔 주세요. 앨범 사진으로도 색감을 입힐 수 있어요.");
      } else if (name === "NotFoundError" || name === "OverconstrainedError"){
        // 제약조건 완화 후 재시도
        navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode: facing } })
          .then(function(s){
            stream = s; video.srcObject = s;
            video.play().catch(function(){});
            S.mode = "camera"; source = video; S.ready = true; hidePerm(); resolve(true);
          }).catch(function(){
            showPerm("카메라를 찾지 못했어요", "기기 카메라를 확인하거나 앨범 사진을 불러와 주세요.");
            resolve(false);
          });
        return;
      } else {
        showPerm("카메라를 켤 수 없어요", "잠시 후 다시 시도하거나 앨범 사진을 불러와 주세요.");
      }
      resolve(false);
    });
  });
}

function loadPhoto(file){
  var url = URL.createObjectURL(file);
  var img = new Image();
  img.onload = function(){
    var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    var MAX = 4096;
    var scale = Math.min(1, MAX / Math.max(w, h));
    var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
    var c = document.createElement("canvas");
    c.width = cw; c.height = ch;
    var cx = c.getContext("2d");
    cx.imageSmoothingQuality = "high";
    cx.drawImage(img, 0, 0, cw, ch);

      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 8.5h3l1.4-2h7.2l1.4 2H20a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/>' +
      '<circle cx="12" cy="14" r="3.2"/></svg>카메라';
    toast("앨범 사진에 색감을 입혔어요");

  img.onerror = function(){ URL.revokeObjectURL(url); toast("사진을 열 수 없어요"); };

}


/* ---------- 촬영 ---------- */
function getCaptureRenderer(){
  if (!captureRenderer){
    var c = document.createElement("canvas");
    captureRenderer = new GLRenderer(c, true);
    if (captureRenderer.ok) captureIsGL = true;
    else { captureRenderer = new C2DRenderer(c); captureIsGL = false; }
  }
  return captureRenderer;
}

function captureDataURL(){
  var P = buildParams();
  var size = sourceSize(source);
  if (!size.w || !size.h) return null;
  var cov = coverOf(size.w, size.h, S.ar);
  var scale = Math.min(1, 4096 / Math.max(cov.cw, cov.ch));
  var outW = Math.max(1, Math.round(cov.cw * scale));
  var outH = Math.max(1, Math.round(cov.ch * scale));
  var r = getCaptureRenderer();
  r.setSize(outW, outH);
  var gs = Math.max(1.4, Math.min(outW, outH) / 620);
  r.render(source, P, {
    cover: cov.cover, mirror: S.mirror,
    strength: S.comparing ? 0 : (S.strength / 100),
    seed: 137.0, grainScale: gs
  });
  return { url: r.canvas.toDataURL("image/jpeg", 0.94), w: outW, h: outH };
}

function dataURLtoBlob(d){
  var parts = d.split(",");
  var mime = (parts[0].match(/:(.*?);/) || [null,"image/jpeg"])[1];
  var bin = atob(parts[1]);
  var len = bin.length;
  var buf = new Uint8Array(len);
  for (var i=0;i<len;i++) buf[i] = bin.charCodeAt(i);
  return new Blob([buf], { type: mime });
}

function flash(){
  var f = $("flash");
  f.classList.remove("go");
  void f.offsetWidth;
  f.classList.add("go");
}

$("btnShutter").addEventListener("click", function(){
  if (!source || !S.ready) return;
  flash();
  setTimeout(function(){
    var res = null;
    try { res = captureDataURL(); }
    catch(err){ console.error(err); }
    if (!res){ toast("촬영에 실패했어요"); return; }
    var blob = null;
    try { blob = dataURLtoBlob(res.url); } catch(e){}
    lastShot = { url: res.url, blob: blob, w: res.w, h: res.h };
    showSheet(lastShot);
    $("thumb").style.backgroundImage = 'url("' + res.url + '")';
    $("thumb").classList.remove("empty");
  }, 30);
});

/* ---------- 저장 시트 ---------- */
function stamp(){
  var d = new Date();
  function p(n){ return (n<10?"0":"") + n; }
  return "Zf_" + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + "_" +
         p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}
function presetName(){
  for (var i=0;i<PRESETS.length;i++) if (PRESETS[i].id === S.preset) return PRESETS[i].name;
  return "";
}
function showSheet(shot){
  $("shotImg").src = shot.url;
  $("shotMeta").textContent = shot.w + " × " + shot.h;
  $("shotPreset").textContent = presetName();
  $("sheet").classList.add("show");
}
function closeSheet(){ $("sheet").classList.remove("show"); }
$("btnClose").addEventListener("click", closeSheet);
$("sheet").addEventListener("click", function(e){ if (e.target === $("sheet")) closeSheet(); });

$("btnSave").addEventListener("click", function(){
  if (!lastShot) return;
  var name = stamp() + ".jpg";
  var file = null;
  try {
    if (lastShot.blob) file = new File([lastShot.blob], name, { type: "image/jpeg" });
  } catch(e){}
  if (file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share){
    navigator.share({ files: [file] })
      .then(function(){ toast("공유 시트에서 ‘이미지 저장’을 누르세요"); })
      .catch(function(err){
        if (err && err.name === "AbortError") return;
        toast("길게 눌러 ‘사진에 저장’을 선택하세요");
      });
    return;
  }
  // 폴백: 다운로드 → 아이폰은 이미지가 열리므로 길게 눌러 저장
  downloadShot();
  toast("이미지를 길게 눌러 ‘사진에 저장’을 선택하세요");
});

function downloadShot(){
  if (!lastShot) return;
  var name = stamp() + ".jpg";
  var a = document.createElement("a");
  a.href = lastShot.url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ a.remove(); }, 600);
}
$("btnDownload").addEventListener("click", downloadShot);

$("thumb").addEventListener("click", function(){
  if (lastShot) showSheet(lastShot);
  else toast("아직 찍은 사진이 없어요");
});

/* ---------- 재시도 ---------- */
$("permRetry").addEventListener("click", function(){
  $("permRetry").textContent = "여는 중…";
  startCamera(S.facing).then(function(){
    $("permRetry").textContent = "다시 시도";
  });
});

/* ---------- 초기화 ---------- */
function restore(){
  try {
    var p = localStorage.getItem("zf.preset");
    if (p && PRESETS.some(function(x){ return x.id === p; })) S.preset = p;
    var ar = parseFloat(localStorage.getItem("zf.ar"));
    if (!isNaN(ar) && ar > 0.3 && ar < 1.4) S.ar = ar;
    var g = localStorage.getItem("zf.grain");
    if (g === "0") S.grainOn = false;
    var m = localStorage.getItem("zf.mirror");
    if (m === "1") S.mirror = true;
  } catch(e){}
  Array.prototype.forEach.call(document.querySelectorAll(".pchip"), function(el){
    if (el.dataset.id) el.classList.toggle("on", el.dataset.id === S.preset);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".rchip"), function(el){
    el.classList.toggle("on", Math.abs(parseFloat(el.dataset.ar) - S.ar) < 0.001);
  });
  $("btnGrain").classList.toggle("on", S.grainOn);
  updateMirror();
}

function boot(){
  document.body.appendChild(video);
  restore();
  layout();

  renderer = new GLRenderer(view, false);
  isGL = renderer.ok;
  if (!isGL) {
    // WebGL을 못 쓰는 환경: Canvas2D 근사 폴백
    renderer = new C2DRenderer(view);
    console.warn("WebGL unavailable - Canvas2D fallback");
  }
  if (renderer && renderer.ok) renderer.setSize(view.width, view.height);

  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", function(){ setTimeout(layout, 260); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", layout);

  setTimeout(function(){ $("hint").classList.add("hide"); }, 4200);

  requestAnimationFrame(loop);

  startCamera(S.facing).then(function(ok){
    if (!ok && !source) {
      // 카메라 실패 → 앨범 안내만 남김
    }
  });
}

boot();
})();
</script>
