<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#07080a;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
    color:#eceded;font-size:14px;-webkit-font-smoothing:antialiased;
    touch-action:manipulation;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
  }
  .app{
    position:fixed;inset:0;display:flex;flex-direction:column;
    height:100vh;height:100dvh;overflow:hidden;
    background:radial-gradient(120% 80% at 50% 0%,#14171b 0%,#08090b 60%,#050607 100%);
    padding-top:env(safe-area-inset-top);
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  }

  /* ---------- top bar ---------- */
  .topbar{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:6px;padding:8px 10px 6px;min-height:46px;
  }
  .ratios{display:flex;gap:2px;background:rgba(255,255,255,.055);padding:3px;border-radius:11px}
  .rchip{
    appearance:none;border:0;background:transparent;color:#9a9ea4;font:inherit;font-size:12px;
    font-weight:600;padding:5px 7px;border-radius:8px;letter-spacing:.1px;
  }
  .rchip.on{background:#e9ddc6;color:#15171a}
  .tools{display:flex;gap:5px;align-items:center}
  .tbtn{
    appearance:none;border:0;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
    background:rgba(255,255,255,.06);color:#cfd2d6;padding:0;
  }
  .tbtn svg{width:19px;height:19px;display:block}
  .tbtn.on{background:rgba(233,221,198,.92);color:#15171a}
  .tbtn:active{transform:scale(.94)}
  .tbtn.off{opacity:.42}
  .tbtn.rec{background:rgba(226,74,60,.9);color:#fff}

  /* ---------- stage ---------- */
  .stagewrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 7px}
  .stage{
    position:relative;border-radius:14px;overflow:hidden;background:#000;
    box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);
    touch-action:none;
  }
  .stage.rec{box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 0 2px rgba(226,74,60,.75)}
  .stage canvas{display:block;width:100%;height:100%}
  .stage .badge{
    position:absolute;top:9px;left:9px;font-size:11px;font-weight:700;letter-spacing:.6px;
    padding:4px 8px;border-radius:7px;background:rgba(0,0,0,.55);color:#e9ddc6;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .12s;
    pointer-events:none;
  }
  .stage .badge.show{opacity:1}
  .stage .recbadge{
    position:absolute;top:9px;right:9px;display:none;align-items:center;gap:6px;
    font-size:11.5px;font-weight:700;letter-spacing:.4px;
    padding:4px 9px;border-radius:20px;background:rgba(0,0,0,.55);color:#ffd9d4;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-variant-numeric:tabular-nums;pointer-events:none;
  }
  .stage .recbadge.show{display:flex}
  .stage .recbadge i{width:7px;height:7px;border-radius:50%;background:#e8564b;display:block;
    animation:blink 1.1s infinite ease-in-out}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .stage .hint{
    position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
    font-size:11px;color:rgba(255,255,255,.82);background:rgba(0,0,0,.42);
    padding:5px 10px;border-radius:20px;white-space:nowrap;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:opacity .5s;pointer-events:none;
  }
  .stage .hint.hide{opacity:0}

  /* progress over stage */
  .prog{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    background:rgba(6,7,9,.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:5;
  }
  .prog.show{display:flex}
  .prog .pct{font-size:26px;font-weight:800;color:#e9ddc6;font-variant-numeric:tabular-nums}
  .prog .lbl{font-size:12px;color:#b9bec4}
  .prog .bar{width:66%;height:4px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
  .prog .bar i{display:block;height:100%;width:0;background:#e9ddc6;transition:width .18s linear}
  .prog button{
    appearance:none;border:0;margin-top:6px;padding:9px 16px;border-radius:11px;font:inherit;
    font-size:12.5px;font-weight:700;background:rgba(255,255,255,.12);color:#e6e8ea;
  }

  /* permission / message overlay */
  .perm{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;text-align:center;padding:22px;background:#0d0f12;
  }
  .perm.show{display:flex}
  .perm .ico{font-size:30px;opacity:.85}
  .perm h3{margin:0;font-size:15px;font-weight:700;color:#ecebe7}
  .perm p{margin:0;font-size:12.5px;line-height:1.55;color:#93989f;max-width:270px}
  .perm button{
    appearance:none;border:0;margin-top:4px;padding:11px 18px;border-radius:12px;font:inherit;
    font-weight:700;font-size:13.5px;background:#e9ddc6;color:#15171a;
  }
  .perm button.ghost{background:rgba(255,255,255,.1);color:#dcdfe3}
  .perm .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

  /* ---------- dock ---------- */
  .dock{
    flex:0 0 auto;padding:6px 0 calc(4px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(8,9,11,0) 0%,rgba(8,9,11,.75) 22%,#08090b 60%);
  }
  .presetrow{display:flex;align-items:center;gap:6px;padding:0 10px}
  .presets{
    flex:1 1 auto;min-width:0;display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;
    padding:3px 2px 5px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    -webkit-mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 24px),transparent 100%);
    mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 24px),transparent 100%);
  }
  .presets::-webkit-scrollbar{display:none}
  .pchip{
    appearance:none;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.045);
    color:#b3b7bd;font:inherit;font-size:12.5px;font-weight:600;white-space:nowrap;
    padding:7px 12px;border-radius:20px;flex:0 0 auto;transition:background .15s,color .15s;
  }
  .pchip.on{background:#e9ddc6;border-color:#e9ddc6;color:#15171a}
  .pchip.cmp{background:transparent;border-style:dashed;color:#8f959c}
  .pchip.cmp:active,.pchip.cmp.on{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.3)}
  .tunebtn{
    appearance:none;border:0;flex:0 0 auto;height:32px;padding:0 10px;border-radius:16px;font:inherit;
    font-size:12px;font-weight:600;background:rgba(255,255,255,.06);color:#a8adb3;
    display:flex;align-items:center;gap:4px;
  }
  .tunebtn.on{background:rgba(233,221,198,.14);color:#e9ddc6}

  .tune{
    display:none;grid-template-columns:1fr 1fr;gap:6px 14px;padding:4px 16px 6px;
  }
  .tune.show{display:grid}
  .sl{display:flex;flex-direction:column;gap:2px;min-width:0}
  .sl label{display:flex;justify-content:space-between;font-size:10.5px;color:#8c9198;letter-spacing:.2px}
  .sl label b{font-weight:600;color:#c9cdd2;font-variant-numeric:tabular-nums}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:2px;border-radius:2px;background:rgba(255,255,255,.18);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#e9ddc6;
    margin-top:-6.5px;box-shadow:0 1px 4px rgba(0,0,0,.5);
  }

  .actionrow{
    display:flex;align-items:center;justify-content:space-between;
    padding:4px 18px 2px;gap:8px;
  }
  .sidebtn{
    appearance:none;border:0;background:rgba(255,255,255,.07);color:#cfd2d6;
    width:60px;height:50px;border-radius:14px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;font:inherit;font-size:9.5px;font-weight:600;
    line-height:1.15;letter-spacing:-.2px;
  }
  .sidebtn svg{width:20px;height:20px}
  .sidebtn:active{transform:scale(.95)}
  .sidebtn.hidden{display:none}
  .shutter{
    appearance:none;border:0;padding:0;background:transparent;width:74px;height:74px;
    border-radius:50%;display:grid;place-items:center;position:relative;flex:0 0 auto;
  }
  .shutter::before{
    content:"";position:absolute;inset:0;border-radius:50%;
    border:3px solid rgba(255,255,255,.85);transition:border-color .2s;
  }
  .shutter span{
    width:58px;height:58px;border-radius:50%;background:#f0efec;display:block;
    transition:transform .12s ease,border-radius .2s ease,background .2s ease;
  }
  .shutter:active span{transform:scale(.9)}
  .shutter.rec::before{border-color:rgba(226,74,60,.35)}
  .shutter.rec span{background:#e8564b;border-radius:10px;width:30px;height:30px}
  .shutter.play span{
    width:58px;height:58px;border-radius:50%;background:#e9ddc6;
    -webkit-mask-image:none;
  }
  .shutter[disabled]{opacity:.45}
  .shutter .glyph{
    position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#15171a;
  }
  .shutter .glyph svg{width:26px;height:26px;display:none}
  .shutter.play.paused .glyph svg.play{display:block}
  .shutter.play:not(.paused) .glyph svg.pause{display:block}
  .thumb{
    appearance:none;border:1px solid rgba(255,255,255,.16);background:#14161a;
    width:60px;height:50px;border-radius:14px;background-size:cover;background-position:center;
    padding:0;overflow:hidden;position:relative;color:#5b6067;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font:inherit;font-size:9.5px;font-weight:600;
  }
  .thumb svg{width:18px;height:18px}

  .importbar{
    display:none;align-items:center;gap:8px;padding:2px 14px 2px;
  }
  .importbar.show{display:flex}
  .importbar .time{font-size:10.5px;color:#8f959c;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .importbar input[type=range]{flex:1 1 auto;min-width:0}
  .importbar .savebtn{
    appearance:none;border:0;flex:0 0 auto;height:34px;padding:0 12px;border-radius:11px;
    font:inherit;font-size:12px;font-weight:800;background:#e9ddc6;color:#15171a;white-space:nowrap;
  }

  /* ---------- sheet ---------- */
  .sheet{
    position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;
    background:rgba(0,0,0,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .sheet.show{display:flex}
  .sheetcard{
    width:100%;background:#101215;border-radius:22px 22px 0 0;
    padding:10px 16px calc(14px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 40px rgba(0,0,0,.6);animation:up .24s ease-out;
    max-height:94vh;overflow:auto;
  }
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .grab{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:2px auto 12px}
  .shotimgwrap{
    border-radius:14px;overflow:hidden;background:#000;display:grid;place-items:center;
    max-height:48vh;position:relative;
  }
  .shotimgwrap video{max-width:100%;max-height:48vh;display:block;background:#000}
  .sheet .meta{display:flex;justify-content:space-between;font-size:11px;color:#7f858c;margin:8px 2px 0;gap:8px}
  .sheet .acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .bigbtn{
    appearance:none;border:0;width:100%;padding:15px;border-radius:14px;font:inherit;
    font-size:15px;font-weight:700;background:#e9ddc6;color:#15171a;
  }
  .bigbtn:active{transform:scale(.99)}
  .row2{display:flex;gap:8px}
  .row2 .bigbtn.ghost{background:rgba(255,255,255,.09);color:#dfe2e6;font-weight:600;font-size:13.5px;padding:12px}
  .savehint{font-size:11px;color:#7f858c;text-align:center;margin:9px 0 0;line-height:1.5}
  .toast{
    position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);
    background:rgba(28,31,35,.96);color:#eee;font-size:12.5px;padding:9px 15px;border-radius:20px;
    z-index:90;opacity:0;transition:.22s;pointer-events:none;white-space:nowrap;max-width:92vw;
    box-shadow:0 6px 24px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hidden{display:none!important}
  #camvid,#impvid{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="ratios" id="ratios">

var OUT = {
  "v": [1080,1920],
  "w": [1920,1080],
  "p": [1080,1440],
  "s": [1080,1080]
};
var CINEMA_AR = 2.39;

/* ------------------------------------------------------------------ *
 *  셰이더

var VS_SRC = [
"attribute vec2 aPos;",
"varying vec2 vUV;",
"void main(){ vUV = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }"
].join("\n");

var FS_SRC = [
"precision highp float;",
"varying vec2 vUV;",
"uniform sampler2D uTex;",
"uniform vec2  uCover;",
"uniform vec2  uPx;",
"uniform float uMirror;",
"uniform float uStrength;",
"uniform float uBand;",
"uniform float uExposure;",
"uniform float uContrast;",
"uniform float uSat;",
"uniform float uFade;",
"uniform float uRoll;",
"uniform float uWarmth;",
"uniform float uTint;",
"uniform vec3  uShadowTint;",
"uniform float uShadowAmt;",
"uniform vec3  uHighTint;",
"uniform float uHighAmt;",
"uniform vec3  uFloor;",
"uniform float uGreen;",
"uniform float uBlue;",
"uniform float uVig;",
"uniform float uClarity;",
"uniform float uGrain;",
"uniform float uGrainScale;",
"uniform float uSeed;",
"uniform float uMono;",
"uniform float uGreenHue;",
"uniform float uRed;",

"vec3 rgb2hsv(vec3 c){",
"  vec4 K = vec4(0.0, -1.0/3.0, 2.0/3.0, -1.0);",
"  vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));",
"  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));",
"  float d = q.x - min(q.w, q.y);",
"  float e = 1.0e-10;",
"  return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);",
"}",
"vec3 hsv2rgb(vec3 c){",
"  vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);",
"  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);",
"  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);",
"}",
"float luma(vec3 c){ return dot(c, vec3(0.2126,0.7152,0.0722)); }",
"float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }",

"void main(){",
/* 시네마 바 : 위아래를 순수 검정으로 굽는다 */
"  if (uBand > 0.0005 && (vUV.y < uBand || vUV.y > 1.0 - uBand)) {",
"    gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return;",
"  }",
"  vec2 bUV = vUV;",
"  if (uBand > 0.0005) bUV.y = (vUV.y - uBand) / (1.0 - 2.0 * uBand);",
"  vec2 uv = (bUV - 0.5) * uCover + 0.5;",
"  if (uMirror > 0.5) uv.x = 1.0 - uv.x;",
"  uv = clamp(uv, 0.0, 1.0);",
"  vec3 orig = texture2D(uTex, uv).rgb;",
"  vec3 col = orig;",

/* white balance */
"  col.r *= (1.0 + uWarmth * 0.62);",
"  col.b *= (1.0 - uWarmth * 0.62);",
"  col.g *= (1.0 + uTint * 0.30);",
"  col.b *= (1.0 - uTint * 0.55);",

/* exposure */
"  if (uExposure != 0.0) col *= exp2(uExposure);",
"  if (uClarity > 0.001) {",
"    vec2 tx = 1.0 / max(uPx, vec2(1.0));",
"    vec3 bl = (texture2D(uTex, clamp(uv + vec2(tx.x, 0.0), 0.0, 1.0)).rgb",
"             + texture2D(uTex, clamp(uv - vec2(tx.x, 0.0), 0.0, 1.0)).rgb",
"             + texture2D(uTex, clamp(uv + vec2(0.0, tx.y), 0.0, 1.0)).rgb",
"             + texture2D(uTex, clamp(uv - vec2(0.0, tx.y), 0.0, 1.0)).rgb) * 0.25;",
"    col += (col - bl) * uClarity;",
"    col = max(col, 0.0);",
"  }",

/* soft S contrast around 0.5 */
"  vec3 cc = clamp(col, 0.0, 1.0);",
"  vec3 over = max(col - 1.0, 0.0);",
"  vec3 sCurve = cc * cc * (3.0 - 2.0 * cc);",
"  col = mix(cc, sCurve, uContrast) + over;",
"  col = max(col, 0.0);",

/* monochrome */
"  float l0 = luma(col);",
"  if (uMono > 0.0) col = mix(col, vec3(l0), uMono);",

/* split tone */
"  float l = luma(col);",
"  float wSh = 1.0 - smoothstep(0.02, 0.60, l);",
"  float wHi = smoothstep(0.40, 0.98, l);",
"  col += uShadowTint * (uShadowAmt * wSh * wSh);",
"  col += uHighTint * (uHighAmt * wHi);",

/* matte fade : lifted black floor */
"  col = col * (1.0 - uFade * 0.30) + uFade * uFloor;",

/* highlight roll-off */
"  float hot = smoothstep(0.62, 1.10, luma(col) + 0.001);",
"  col -= uRoll * 0.085 * hot * mix(1.0, 0.45, uMono);",

/* hue shaping */
"  if (uMono < 0.5) {",
"    vec3 hsv = rgb2hsv(clamp(col, 0.0, 1.0));",
"    float h = hsv.x;",
"    float gW = smoothstep(0.19, 0.29, h) - smoothstep(0.41, 0.50, h);",
"    float bW = smoothstep(0.50, 0.58, h) - smoothstep(0.71, 0.79, h);",
"    hsv.y *= 1.0 - uGreen * gW - uBlue * bW;",
"    hsv.y = max(hsv.y, 0.0);",
"    float rW = max(1.0 - smoothstep(0.0, 0.075, h), smoothstep(0.94, 1.0, h));",
"    float redS = uRed * rW;",
"    if (redS > 0.00001) hsv.y = min(hsv.y * (1.0 + redS), 1.0);",
"    hsv.x -= 0.018 * gW;",
"    hsv.x += uGreenHue * gW;",
"    hsv.x -= 0.013 * bW;",
"    col = hsv2rgb(hsv);",
"    float lb = luma(col);",
"    col = mix(vec3(lb), col, uSat);",
"  }",

/* vignette */
"  vec2 dv = (bUV - 0.5) * vec2(1.0, 0.94);",
"  float vg = smoothstep(0.34, 0.92, length(dv) * 1.42);",
"  col *= 1.0 - uVig * vg;",

/* grain */
"  if (uGrain > 0.0001) {",
"    vec2 gp = floor(bUV * uPx / max(uGrainScale, 1.2)) + uSeed;",
"    float n = hash(gp) + hash(gp + 37.13) - 1.0;",
"    float gm = uGrain * (1.0 - 0.62 * smoothstep(0.55, 1.0, luma(col)));",
"    col += n * gm;",
"  }",

"  col = clamp(col, 0.0, 1.0);",
"  gl_FragColor = vec4(mix(orig, col, clamp(uStrength, 0.0, 1.0)), 1.0);",
"}"
].join("\n");

function GLRenderer(canvas, preserve){

    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {

      return null;
    }
    return sh;

    console.error("link", gl.getProgramInfoLog(prog));
    return;
  }

  this.prog = prog;

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "aPos");

  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  this.tex = tex;

  var u = {};
  ["uTex","uCover","uPx","uMirror","uStrength","uBand","uExposure","uContrast","uSat","uFade","uRoll",
   "uWarmth","uTint","uShadowTint","uShadowAmt","uHighTint","uHighAmt","uFloor","uGreen","uBlue",
   "uVig","uClarity","uGrain","uGrainScale","uSeed","uMono","uGreenHue","uRed"].forEach(function(n){ u[n] = gl.getUniformLocation(prog, n); });
  this.u = u;
  gl.uniform1i(u.uTex, 0);
  gl.clearColor(0,0,0,1);
  this.ok = true;
}

GLRenderer.prototype.setSize = function(w, h){
  if (this.canvas.width !== w) this.canvas.width = w;
  if (this.canvas.height !== h) this.canvas.height = h;
};

GLRenderer.prototype.render = function(src, P, o){

  gl.uniform1f(u.uStrength, o.strength);
  gl.uniform1f(u.uBand, o.band || 0);
  gl.uniform1f(u.uExposure, P.exposure);
  gl.uniform1f(u.uContrast, P.contrast);
  gl.uniform1f(u.uSat, P.sat);
  gl.uniform1f(u.uFade, P.fade);
  gl.uniform1f(u.uRoll, P.roll);
  gl.uniform1f(u.uWarmth, P.warmth);
  gl.uniform1f(u.uTint, P.tint);
  gl.uniform3f(u.uShadowTint, P.shadow[0], P.shadow[1], P.shadow[2]);
  gl.uniform1f(u.uShadowAmt, P.shadowAmt);
  gl.uniform3f(u.uHighTint, P.high[0], P.high[1], P.high[2]);
  gl.uniform1f(u.uHighAmt, P.highAmt);
  gl.uniform3f(u.uFloor, FLOOR_COLOR[0], FLOOR_COLOR[1], FLOOR_COLOR[2]);
  gl.uniform1f(u.uGreen, P.green);
  gl.uniform1f(u.uBlue, P.blue);
  gl.uniform1f(u.uVig, P.vig);
  gl.uniform1f(u.uClarity, P.clarity || 0);
  gl.uniform1f(u.uGrain, P.grain);
  gl.uniform1f(u.uGrainScale, o.grainScale);
  gl.uniform1f(u.uSeed, o.seed);
  gl.uniform1f(u.uMono, P.mono);
  gl.uniform1f(u.uGreenHue, P.greenHue || 0);
  gl.uniform1f(u.uRed, P.red || 0);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
};

/* ---------------- Canvas2D 폴백 ---------------- */
function C2DRenderer(canvas){
  this.canvas = canvas;
  this.ctx = canvas.getContext("2d");
  this.ok = !!this.ctx;
  this.noise = document.createElement("canvas");
  this.noise.width = 128; this.noise.height = 128;
  var nc = this.noise.getContext("2d");
  var im = nc.createImageData(128,128);
  for (var i=0;i<im.data.length;i+=4){
    var v = 128 + (Math.random()-0.5)*140;
    im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255;
  }
  nc.putImageData(im,0,0);
}
C2DRenderer.prototype.setSize = function(w,h){
  if (this.canvas.width!==w) this.canvas.width=w;
  if (this.canvas.height!==h) this.canvas.height=h;
};
C2DRenderer.prototype.render = function(src, P, o){
  if (!this.ok) return;
  var ctx = this.ctx, W = this.canvas.width, H = this.canvas.height;
  var band = o.band || 0;
  var y0 = Math.round(H * band), y1 = H - y0;
  var bh = Math.max(1, y1 - y0);
  var sw = src.videoWidth || src.width || W;
  var sh = src.videoHeight || src.height || H;
  ctx.save();
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = "#000"; ctx.fillRect(0,0,W,H);
  var bright = Math.pow(2, P.exposure) * (1 - P.fade*0.25);
  var filt = "brightness(" + bright.toFixed(3) + ") contrast(" + (1+P.contrast*0.32).toFixed(3) +
             ") saturate(" + (P.sat*(1-P.green*0.25)).toFixed(3) + ")";
  if (P.mono>0.5) filt += " grayscale(1)";
  if (P.warmth>0) filt += " sepia(" + Math.min(0.5,P.warmth*1.6).toFixed(3) + ")";
  if (ctx.filter !== undefined) ctx.filter = filt;
  var scale = Math.max(W/sw, bh/sh);
  var dw = sw*scale, dh = sh*scale;
  ctx.beginPath(); ctx.rect(0, y0, W, bh); ctx.clip();
  if (o.mirror){ ctx.translate(W,0); ctx.scale(-1,1); }
  ctx.drawImage(src, (W-dw)/2, y0 + (bh-dh)/2, dw, dh);
  ctx.restore();
  ctx.filter = "none";
  if (o.strength < 0.999){
    ctx.globalAlpha = 1 - o.strength;
    ctx.drawImage(src, (W-dw)/2, (H-dh)/2, dw, dh);
    ctx.globalAlpha = 1;
  }
  if (band > 0){
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,W,y0); ctx.fillRect(0,y1,W,H-y1);
  }
};

function toast(msg){

  clearTimeout(toast._t);

function pad2(n){ return (n<10?"0":"") + n; }
function mmss(sec){
  if (!isFinite(sec) || sec < 0) sec = 0;
  var m = Math.floor(sec/60), s = Math.floor(sec%60);
  return pad2(m) + ":" + pad2(s);
}
function currentPreset(){
  for (var i=0;i<PRESETS.length;i++) if (PRESETS[i].id === S.preset) return PRESETS[i].p;
  return PRESETS[0].p;
}
function presetName(){
  for (var i=0;i<PRESETS.length;i++) if (PRESETS[i].id === S.preset) return PRESETS[i].name;
  return "";
}
function buildParams(){
  var p = currentPreset();
  var g = (S.grain/100) * 0.080;
  return {
    exposure: p.exposure + (S.bright/50)*0.85,
    contrast: p.contrast,
    sat: p.sat,
    fade: p.fade,
    roll: p.roll,
    warmth: p.warmth + (S.warm/50)*0.10,
    tint: p.tint,
    shadow: p.shadow,
    shadowAmt: p.shadowAmt,
    high: p.high,
    highAmt: p.highAmt,
    green: p.green,
    blue: p.blue,
    vig: p.vig,
    grain: g * p.grainMul,
    mono: p.mono,
    clarity: p.clarity || 0,
    greenHue: p.greenHue || 0,
    red: p.red || 0
  };
}
function sourceSize(src){
  if (!src) return {w:0,h:0};
  if (src.videoWidth) return { w: src.videoWidth, h: src.videoHeight };
  return { w: src.width || 0, h: src.height || 0 };
}
function coverOf(sw, sh, ar){
  var sar = sw / sh, cover;
  if (sar > ar) cover = [ (sh * ar)/sw, 1 ];
  else cover = [ 1, (sw / ar)/sh ];
  return cover;
}
function bandOf(){
  if (!S.cinema) return 0;
  var b = (1 - S.ar / CINEMA_AR) / 2;
  return b > 0 ? b : 0;
}

/* ---------- 화면 크기 ---------- */
function layout(){
  var padX = 14;
  var availW = stagewrap.clientWidth - padX;
  var availH = stagewrap.clientHeight - 4;
  if (availW <= 0 || availH <= 0) return;
  var ar = S.ar;
  var w = Math.min(availW, availH * ar);
  var h = w / ar;
  stage.style.width = Math.round(w) + "px";
  stage.style.height = Math.round(h) + "px";
}
function setOutput(){
  var out = OUT[S.key] || OUT.v;
  if (view.width !== out[0] || view.height !== out[1]){
    view.width = out[0]; view.height = out[1];
    if (renderer) renderer.setSize(out[0], out[1]);
  }
}

/* ---------- 렌더 루프 ---------- */
function draw(){
  if (!source) return;
  var sz = sourceSize(source);
  if (!sz.w || !sz.h) return;
  var band = bandOf();
  var arBand = band > 0 ? (S.ar / (1 - 2*band)) : S.ar;
  var cover = coverOf(sz.w, sz.h, arBand);
  var P = buildParams();
  var strength = S.comparing ? 0 : (S.strength / 100);
  var gs = Math.max(1.4, Math.min(view.width, view.height) / 620);
  renderer.render(source, P, { cover: cover, mirror: S.mirror, strength: strength,
                               seed: seed, grainScale: gs, band: band });
  if (capManual && capTrack){
    try { capTrack.requestFrame(); } catch(e){}
  }
}
function loop(t){
  requestAnimationFrame(loop);
  if (t - lastDrawT < 30) return;      /* 30fps 로 제한 */
  lastDrawT = t;
  if (t - lastSeedT > 84) { seed = Math.random() * 512; lastSeedT = t; }
  draw();
}

/* ---------- 카메라 ---------- */
function stopStream(){
  if (stream){ stream.getTracks().forEach(function(tr){ try{ tr.stop(); }catch(e){} }); stream = null; }
  micTrack = null;
}
function showPerm(title, body, retry){
  $("permTitle").textContent = title;
  $("permBody").textContent = body;
  $("perm").classList.add("show");
  $("permRetry").style.display = retry === false ? "none" : "";
}
function hidePerm(){ $("perm").classList.remove("show"); }

function startCamera(facing){
  return new Promise(function(resolve){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showPerm("카메라를 쓸 수 없어요",
        "HTTPS 주소에서 열어야 카메라가 켜집니다. ‘영상 불러오기’로 찍어 둔 영상에 색감을 입힐 수 있어요.");
      resolve(false); return;
    }
    stopStream();
    var base = { video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } } };
    var withAudio = { audio: true, video: base.video };

    function ok(s, silent){
      stream = s;
      micTrack = s.getAudioTracks()[0] || null;
      if (micTrack) micTrack.enabled = !S.muted;
      camVideo.srcObject = s;
      var p = camVideo.play(); if (p && p.catch) p.catch(function(){});
      var done = function(){
        S.mode = "camera";
        source = camVideo;
        S.ready = true;
        hidePerm();
        setModeUI();
        updateMicBtn();
        if (silent) toast("마이크 없이 무음으로 켰어요");
        resolve(true);
      };
      if (camVideo.readyState >= 2) done();
      else camVideo.addEventListener("loadeddata", done, { once:true });
    }
    function retryVideoOnly(){
      base.video.facingMode = facing;
      navigator.mediaDevices.getUserMedia({ audio:false, video: base.video })
        .then(function(s){ ok(s, true); })
        .catch(function(){
          showPerm("카메라를 찾지 못했어요", "기기 카메라를 확인하거나 ‘영상 불러오기’로 색감을 입혀 보세요.");
          resolve(false);
        });
    }
    navigator.mediaDevices.getUserMedia(withAudio).then(function(s){ ok(s, false); })
      .catch(function(err){
        var name = (err && err.name) || "";
        if (name === "NotAllowedError" || name === "SecurityError"){
          /* 마이크만 거부됐을 수 있으니 무음으로 재시도 */
          retryVideoOnly();
        } else {
          retryVideoOnly();
        }
      });
  });
}

function loadVideo(file){
  if (impUrl){ try{ URL.revokeObjectURL(impUrl); }catch(e){} }
  impUrl = URL.createObjectURL(file);
  stopStream();
  audioSrcNode = null; audioDest = null;
  if (audioCtx){ try{ audioCtx.close(); }catch(e){} audioCtx = null; }

  var prev = null;
  try { prev = impVideo; } catch(e){}
  var v = document.createElement("video");
  v.id = "impvid";
  v.setAttribute("playsinline", ""); v.setAttribute("webkit-playsinline", "");
  v.setAttribute("preload", "auto");
  v.playsInline = true; v.muted = false; v.volume = 1;
  v.src = impUrl;
  document.body.appendChild(v);
  impVideo = v;
  if (prev && prev.parentNode){
    try { prev.pause(); prev.removeAttribute("src"); prev.parentNode.removeChild(prev); } catch(e){}
  }

  impDuration = 0;
  var started = false;
  function ready(){
    if (started) return;
    started = true;
    impDuration = (isFinite(impVideo.duration) && impVideo.duration > 0) ? impVideo.duration : 0;
    S.mode = "import";
    source = impVideo;
    S.ready = true;
    hidePerm();
    setModeUI();
    $("impSeek").max = "1000";
    $("impSeek").value = "0";
    updateImpTime();
    if (!impDuration) probeDuration(impVideo);
    centerChip(S.preset);
    toast("영상에 색감 미리보기 중 · ‘색감 입혀 저장’을 누르세요");
    $("hint").textContent = "길게 누르면 원본 · 재생 버튼으로 미리보기";
    $("hint").classList.remove("hide");
    setTimeout(function(){ $("hint").classList.add("hide"); }, 4200);
  }
  impVideo.addEventListener("loadeddata", ready, { once:true });
  impVideo.addEventListener("loadedmetadata", function(){
    if (impVideo.readyState >= 2) ready();
  }, { once:true });
  impVideo.addEventListener("timeupdate", updateImpTime);
  impVideo.addEventListener("seeked", updateImpTime);
  impVideo.addEventListener("ended", onImpEnded);
  impVideo.load();
  setTimeout(function(){ if (!started && impVideo.videoWidth) ready(); }, 1200);
}

function onImpEnded(){
  $("btnShutter").classList.add("paused");
  updateImpTime();
  if (S.exporting && exportStarted) finishExport();
}

function updateImpTime(){
  if (S.mode !== "import") return;
  var t = impVideo.currentTime || 0;
  if (impDuration > 0){
    $("impTime").textContent = mmss(t) + " / " + mmss(impDuration);
    $("impSeek").value = String(Math.round((t / impDuration) * 1000));
  } else {
    $("impTime").textContent = mmss(t) + " / --:--";
  }
}

/* WebM처럼 길이 정보가 없는 파일은 끝으로 살짝 이동해 길이를 읽어 낸다 */
function probeDuration(v){
  var done = false;
  function fin(){
    if (done) return;
    done = true;
    if (isFinite(v.duration) && v.duration > 0){
      impDuration = v.duration;
      try { v.currentTime = 0; } catch(e){}
      updateImpTime();
    }
    updateImpTime();
  }
  v.addEventListener("durationchange", function(){
    if (isFinite(v.duration) && v.duration > 0) fin();
  });
  try { v.currentTime = 1e5; } catch(e){}
  setTimeout(fin, 1600);
}
impVideo.addEventListener("timeupdate", updateImpTime);

$("impSeek").addEventListener("input", function(){
  if (S.exporting) return;
  if (!(impDuration > 0)) return;
  impVideo.currentTime = (parseInt($("impSeek").value, 10) / 1000) * impDuration;
});
$("impSeek").addEventListener("change", function(){
  if (!S.exporting) updateImpTime();
});

/* ------------------------------------------------------------------ *
 *  녹화
 * ------------------------------------------------------------------ */
function pickMime(){
  if (!window.MediaRecorder) return null;
  var cands = ["video/mp4;codecs=avc1.42E01E","video/mp4;codecs=avc1","video/mp4",
               "video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
  for (var i=0;i<cands.length;i++){
    try { if (MediaRecorder.isTypeSupported(cands[i])) return cands[i]; } catch(e){}
  }
  return "";
}
function newRecorder(strm, mime){
  if (mime){
    try {
      return new MediaRecorder(strm, { mimeType: mime, videoBitsPerSecond: 14000000, audioBitsPerSecond: 128000 });
    } catch(e){
      try { return new MediaRecorder(strm, { mimeType: mime }); } catch(e2){ return null; }
    }
  }
  try { return new MediaRecorder(strm); } catch(e){ return null; }
}

function makeCanvasStream(withMic){
  var s = null, t = null;
  try {
    if (view.captureStream) s = view.captureStream(30);
    else if (view.mozCaptureStream) s = view.mozCaptureStream(30);
  } catch(e){ s = null; }
  if (!s) return null;
  t = s.getVideoTracks()[0];
  capTrack = t;
  capManual = !!(t && typeof t.requestFrame === "function");
  recCanvasStream = s;
  if (withMic && micTrack && micTrack.readyState === "live"){
    try { s.addTrack(micTrack); } catch(e){}
  }
  return s;
}
function canvasStream(){ return makeCanvasStream(true); }
function releaseCanvasStream(){
  capTrack = null; capManual = false;
  if (!recCanvasStream) return;
  try {
    recCanvasStream.getVideoTracks().forEach(function(t){ try{ t.stop(); }catch(e){} });
  } catch(e){}
  recCanvasStream = null;
}

function startRecord(){
  if (!window.MediaRecorder){ toast("이 브라우저는 녹화를 지원하지 않아요"); return; }
  if (!S.ready || !source){ toast("카메라를 먼저 켜 주세요"); return; }
  var strm = canvasStream();
  if (!strm){ toast("녹화를 시작할 수 없어요"); return; }
  var mime = pickMime();
  if (mime === null){ toast("이 브라우저는 녹화를 지원하지 않아요"); return; }
  rec = newRecorder(strm, mime);
  if (!rec){ toast("녹화를 시작할 수 없어요"); return; }
  chunks = [];
  recMime = mime || "";
  rec.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = onRecStop;
  rec.onerror = function(e){
    console.error("rec error", e);
    toast("녹화 오류가 났어요");
    stopRecord(true);
  };
  try { rec.start(250); }
  catch(e){ toast("녹화를 시작할 수 없어요"); return; }

  S.recording = true;
  recT0 = Date.now();
  $("btnShutter").classList.add("rec");
  $("btnShutter").classList.remove("play","paused");
  if (S.mode === "import") $("btnShutter").classList.remove("play");
  $("recbadge").classList.add("show");
  $("stage").classList.add("rec");
  $("hint").classList.add("hide");
  $("recTime").textContent = "00:00";
  recTimer = setInterval(function(){
    var t = (Date.now() - recT0) / 1000;
    $("recTime").textContent = mmss(t);
    if (t > 600) stopRecord(false);   /* 10분 안전 상한 */
  }, 250);
}

function stopRecord(silent){
  if (!S.recording) return;
  S.recording = false;
  clearInterval(recTimer); recTimer = null;
  $("btnShutter").classList.remove("rec");
  if (S.mode === "import"){ $("btnShutter").classList.add("play","paused"); }
  else { $("btnShutter").classList.remove("play","paused"); }
  $("recbadge").classList.remove("show");
  $("stage").classList.remove("rec");
  var dur = (Date.now() - recT0) / 1000;
  try { if (rec && rec.state !== "inactive") rec.stop(); } catch(e){}
  rec._dur = dur;
  rec._silent = !!silent;
}

function onRecStop(){
  var dur = (rec && rec._dur) || 0;
  var type = (rec && rec.mimeType) || recMime || "video/webm";
  var blob = new Blob(chunks, { type: type });
  chunks = [];
  rec = null;
  releaseCanvasStream();
  if (!blob.size){ toast("녹화된 내용이 없어요"); return; }
  lastRec = { blob: blob, dur: dur, type: type };
  showSheet(lastRec);
  grabThumb();
}

function grabThumb(){
  try {
    draw();
    var url = view.toDataURL("image/jpeg", 0.5);
    $("thumb").style.backgroundImage = 'url("' + url + '")';
    $("thumb").style.color = "transparent";
    var sp = $("thumb").querySelector("span"); if (sp) sp.style.display = "none";
    var sv = $("thumb").querySelector("svg"); if (sv) sv.style.display = "none";
  } catch(e){}
}

/* ---------- 셔터 ---------- */
$("btnShutter").addEventListener("click", function(){
  if (S.exporting) return;
  if (S.mode === "import"){
    if (impVideo.paused){
      var p = impVideo.play(); if (p && p.catch) p.catch(function(){});
      $("btnShutter").classList.remove("paused");
    } else {
      impVideo.pause();
      $("btnShutter").classList.add("paused");
    }
    return;
  }
  if (S.recording) stopRecord(false);
  else startRecord();
});

/* ------------------------------------------------------------------ *
 *  찍어 둔 영상에 색감 입혀 저장
 * ------------------------------------------------------------------ */
function ensureAudioGraph(){
  if (audioDest) return true;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  try {
    audioCtx = audioCtx || new AC();
    if (!audioSrcNode) audioSrcNode = audioCtx.createMediaElementSource(impVideo);
    audioDest = audioCtx.createMediaStreamDestination();
    audioSrcNode.connect(audioDest);
    audioSrcNode.connect(audioCtx.destination);   /* 변환 중에도 소리가 들리게 */
    /* 무음 소스를 하나 섞어 두면, 소리가 없는 영상이어도 녹음 트랙이 멈추지 않는다 */
    try {
      var cs = null;
      if (audioCtx.createConstantSource) cs = audioCtx.createConstantSource();
      if (cs){
        cs.offset.value = 0;
        cs.connect(audioDest);
        cs.start();
      } else {
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        g.gain.value = 0;
        osc.connect(g); g.connect(audioDest); osc.start();
      }
    } catch(e){}
    if (audioCtx.state === "suspended" && audioCtx.resume){
      try { audioCtx.resume(); } catch(e){}
    }
    return true;
  } catch(e){
    console.warn("audio graph", e);
    audioDest = null;
    return false;
  }
}

$("btnExport").addEventListener("click", function(){
  if (S.mode !== "import"){ toast("먼저 ‘영상 불러오기’로 영상을 골라 주세요"); return; }
  if (S.exporting) return;
  if (!window.MediaRecorder){ toast("이 브라우저는 저장을 지원하지 않아요"); return; }
  if (!impVideo.videoWidth){ toast("영상을 읽는 중이에요. 잠시만요"); return; }

  S.exporting = true;
  exportCancel = false;
  exportStarted = false;
  exportRec = null;
  impVideo.pause();
  $("prog").classList.add("show");
  $("progPct").textContent = "0%";
  $("progBar").style.width = "0%";
  $("progLbl").textContent = "처음부터 다시 재생하며 색감을 입혀요";

  ensureAudioGraph();

  /* 2D 복사 캔버스를 거쳐 녹화하면 사파리·크롬 모두 프레임이 안정적으로 들어간다 */
  if (!expCanvas){
    expCanvas = document.createElement("canvas");
    expCtx = expCanvas.getContext("2d");
  }
  expCanvas.width = view.width; expCanvas.height = view.height;

  var strm = null;
  try { strm = expCanvas.captureStream(30); } catch(e){ strm = null; }
  if (!strm) strm = makeCanvasStream(false);
  if (!strm){ S.exporting = false; $("prog").classList.remove("show"); toast("이 브라우저는 저장을 지원하지 않아요"); return; }
  expStream = strm;
  if (audioDest){
    var at = audioDest.stream.getAudioTracks()[0];
    if (at) { try { strm.addTrack(at); } catch(e){} }
  }
  var mime = pickMime() || "";
  var r = newRecorder(strm, mime);
  if (!r){ releaseCanvasStream(); S.exporting = false; $("prog").classList.remove("show"); toast("저장을 시작할 수 없어요"); return; }
  exportRec = r;
  chunks = [];
  exportGotData = false;
  r.ondataavailable = function(e){ if (e.data && e.data.size){ exportGotData = true; chunks.push(e.data); } };
  r.onstop = function(){
    var dur = impDuration;
    var type = r.mimeType || mime || "video/webm";
    var blob = new Blob(chunks, { type: type });
    chunks = [];
    exportRec = null;
    if (expTimer){ clearInterval(expTimer); expTimer = null; }
    if (expStream){ try { expStream.getVideoTracks().forEach(function(t){ t.stop(); }); } catch(e){} expStream = null; }
    releaseCanvasStream();
    S.exporting = false;
    $("prog").classList.remove("show");
    if (exportCancel){ toast("저장을 취소했어요"); return; }
    if (!blob.size || blob.size < 2500){ toast("영상을 담지 못했어요 · 다시 시도해 주세요"); return; }
    lastRec = { blob: blob, dur: dur, type: type };
    showSheet(lastRec);
  };

  /* 처음으로 되감고 재생 → 끝까지 렌더링하며 녹화 */
  function begin(){
    if (exportStarted || !S.exporting) return;
    exportStarted = true;
    try { r.start(250); } catch(e){ S.exporting = false; $("prog").classList.remove("show"); toast("저장을 시작할 수 없어요"); return; }
    impVideo.currentTime = 0;
    var pp = impVideo.play(); if (pp && pp.catch) pp.catch(function(){});
    $("btnShutter").classList.remove("paused");
    /* 재생 중에는 rAF가 멈출 수 있으므로 타이머로 프레임을 그린다 */
    if (expTimer) clearInterval(expTimer);
    expTimer = setInterval(function(){
      draw();
      if (expCtx){
        try { expCtx.drawImage(view, 0, 0, expCanvas.width, expCanvas.height); } catch(e){}
      }
      exportTick();
    }, 40);
    if (expCtx){ try { expCtx.drawImage(view, 0, 0, expCanvas.width, expCanvas.height); } catch(e){} }
    exportTick();
  }
  if (impVideo.readyState >= 2 && Math.abs(impVideo.currentTime) < 0.05){
    begin();
  } else {
    try { impVideo.currentTime = 0; } catch(e){}
    impVideo.addEventListener("seeked", function(){ begin(); }, { once:true });
    setTimeout(function(){ if (S.exporting && !exportStarted) begin(); }, 800);
  }
});

function exportTick(){
  if (!S.exporting) return;
  var t = impVideo.currentTime || 0;
  if (impDuration > 0){
    var pct = Math.min(1, t / impDuration);
    $("progPct").textContent = Math.round(pct * 100) + "%";
    $("progBar").style.width = Math.round(pct * 100) + "%";
  } else {
    /* 길이를 모르는 파일 : 경과 시간으로 표시 */
    $("progPct").textContent = mmss(t);
    $("progBar").style.width = Math.min(96, 20 + t * 4) + "%";
  }
  updateImpTime();
  if (impVideo.ended || (impDuration > 0 && t >= impDuration - 0.04)){
    $("progLbl").textContent = "마무리 중…";
    setTimeout(function(){ finishExport(); }, 280);
  }
}

function finishExport(){
  if (expTimer){ clearInterval(expTimer); expTimer = null; }
  if (!S.exporting || !exportStarted) { S.exporting = false; $("prog").classList.remove("show"); return; }
  try { impVideo.pause(); } catch(e){}
  if (exportRec && exportRec.state !== "inactive"){
    try { exportRec.stop(); return; } catch(e){}
  }
  S.exporting = false;
  $("prog").classList.remove("show");
}

$("btnCancelExport").addEventListener("click", function(){
  if (!S.exporting) return;
  exportCancel = true;
  $("progLbl").textContent = "취소하는 중…";
  try { impVideo.pause(); } catch(e){}
  finishExport();
});

/* ------------------------------------------------------------------ *
 *  저장 시트
 * ------------------------------------------------------------------ */
function stamp(){
  var d = new Date();
  return "Cinema_" + d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate()) + "_" +
         pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
}
function extOf(type){
  if (!type) return "mp4";
  if (type.indexOf("mp4") >= 0) return "mp4";
  if (type.indexOf("webm") >= 0) return "webm";
  return "mp4";
}
function showSheet(item){
  var v = $("shotVid");
  v.setAttribute("preload", "metadata");
  if (v.dataset.url){ try{ URL.revokeObjectURL(v.dataset.url); }catch(e){} }
  var url = URL.createObjectURL(item.blob);
  v.dataset.url = url;
  v.src = url;
  v.muted = false;
  v.controls = true;
  var mb = (item.blob.size / 1048576).toFixed(1);
  var out = OUT[S.key] || OUT.v;
  $("shotMeta").textContent = out[0] + " × " + out[1] + " · " + mmss(item.dur) + " · " + mb + "MB";
  $("shotPreset").textContent = presetName();
  $("sheet").classList.add("show");
  try { v.load(); v.play().catch(function(){}); } catch(e){}
}
function closeSheet(){
  var v = $("shotVid");
  try { v.pause(); } catch(e){}
  $("sheet").classList.remove("show");
}
$("btnClose").addEventListener("click", closeSheet);
$("sheet").addEventListener("click", function(e){ if (e.target === $("sheet")) closeSheet(); });

function recFile(){
  if (!lastRec) return null;
  var ext = extOf(lastRec.type);
  var name = stamp() + "." + ext;
  try { return new File([lastRec.blob], name, { type: lastRec.type || "video/mp4" }); }
  catch(e){ return null; }
}

$("btnSave").addEventListener("click", function(){
  if (!lastRec) return;
  var file = recFile();
  try {
    if (file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share){
      navigator.share({ files: [file] })
        .then(function(){ toast("공유 시트에서 ‘비디오 저장’을 누르세요"); })
        .catch(function(err){
          if (err && err.name === "AbortError") return;
          downloadRec();
        });
      return;
    }
  } catch(e){}
  downloadRec();
  toast("‘파일로 저장’으로 내려받아 주세요");
});

function downloadRec(){
  if (!lastRec) return;
  var ext = extOf(lastRec.type);
  var name = stamp() + "." + ext;
  var url = URL.createObjectURL(lastRec.blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 4000);
}
$("btnDownload").addEventListener("click", downloadRec);

$("thumb").addEventListener("click", function(){
  if (lastRec) showSheet(lastRec);
  else toast("아직 찍은 영상이 없어요");
});

/* ---------- 재시도 ---------- */
$("permRetry").addEventListener("click", function(){
  $("permRetry").textContent = "여는 중…";
  startCamera(S.facing).then(function(){
    $("permRetry").textContent = "다시 시도";
  });
});

/* ---------- 초기화 ---------- */
function restore(){
  try {
    var p = localStorage.getItem("cm.preset");
    if (p && PRESETS.some(function(x){ return x.id === p; })) S.preset = p;
    var k = localStorage.getItem("cm.ratio");
    if (k && OUT[k]) {
      S.key = k;
      var el = document.querySelector('.rchip[data-key="' + k + '"]');
      if (el) S.ar = parseFloat(el.dataset.ar);
    }
    if (localStorage.getItem("cm.cinema") === "1") S.cinema = true;
  } catch(e){}
  Array.prototype.forEach.call(document.querySelectorAll(".pchip"), function(el){
    if (el.dataset.id) el.classList.toggle("on", el.dataset.id === S.preset);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".rchip"), function(el){
    el.classList.toggle("on", el.dataset.key === S.key);
  });
  $("btnCinema").classList.toggle("on", S.cinema);
  updateMicBtn();
}

function boot(){
  document.body.appendChild(camVideo);
  document.body.appendChild(impVideo);
  restore();
  setOutput();
  layout();

  renderer = new GLRenderer(view, true);
  isGL = renderer.ok;
  if (!isGL) { renderer = new C2DRenderer(view); console.warn("WebGL unavailable - Canvas2D fallback"); }
  if (renderer && renderer.ok) renderer.setSize(view.width, view.height);

  setModeUI();
  centerChip(S.preset);

  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", function(){ setTimeout(layout, 260); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", layout);
  if (window.ResizeObserver){
    try { new ResizeObserver(function(){ layout(); }).observe(stagewrap); } catch(e){}
  }
  requestAnimationFrame(function(){ layout(); });
  setTimeout(layout, 60);

  setTimeout(function(){ $("hint").classList.add("hide"); }, 4600);

  requestAnimationFrame(loop);

  startCamera(S.facing);
}

boot();
})();
</script>
