<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf7ee">
<title>🖼️ 가족 액자 · 가족 공유 메시지</title>
<style>
:root{
  --bg:#fbf6ee; --ink:#2f2721; --muted:#8b7f72; --line:#e8dccb; --card:#fffdf8;
  --accent:#e0824a; --accent2:#c9622f; --good:#2f9a63; --warn:#c9591f;
  --note-y:#fff3c4; --note-p:#ffe0e8; --note-b:#dceeff; --note-g:#e2f6dc;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 520px at 12% -12%, #fff2df 0, rgba(255,242,223,0) 62%),
    radial-gradient(900px 480px at 105% 6%, #f3e9ff 0, rgba(243,233,255,0) 58%),
    linear-gradient(180deg,#fdf8f0 0%,#f7efe1 58%,#f2e7d5 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{margin:0}

/* ---------- 상단 슬림 바 ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:7px 12px 7px 14px;
  padding-top:max(7px, env(safe-area-inset-top));
  border-bottom:1px solid var(--line);
  background:rgba(255,253,248,.9);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:30;
}
.tb-clock{display:flex;align-items:baseline;gap:8px;min-width:0}
#clock{font-size:1.42rem;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#dates{font-size:.72rem;font-weight:800;color:var(--muted);white-space:nowrap}
.tb-mid{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.dadpill{
  display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:900;
  padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);
  white-space:nowrap;box-shadow:0 1px 0 #fff inset;
}
.dadpill.duty{background:#ffe8dd;border-color:#ffc9b3;color:#a8401f}
.dadpill.off{background:#e3f7ea;border-color:#a7e2c0;color:#1a744a}
.dadpill.leave{background:#efe8ff;border-color:#cfbdf5;color:#553aa8}
.dadpill.day{background:#fff4d4;border-color:#f2d98a;color:#8a6508}
.dadpill.night{background:#e6edff;border-color:#b8caf5;color:#2b4a94}
.dadpill small{font-weight:800;opacity:.72}
.tb-right{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.76rem;font-weight:800;line-height:1;
  padding:8px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(120,90,60,.08);white-space:nowrap;transition:transform .08s,background .15s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#ffb37a,#ec7f42);border-color:#e0793d;color:#fff;box-shadow:0 3px 10px rgba(224,130,74,.34)}
.btn.code{background:#fff6ed;border-color:#f0d5bb;color:#a5551f}
.btn.code b{font-family:ui-monospace,Menlo,monospace;letter-spacing:.09em;font-size:.8rem}
.btn.code.ok{background:#eaf8f0;border-color:#b6e3c9;color:#1d7a4f}
.btn.refresh{font-size:.95rem;padding:6px 9px}
.btn.refresh.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:#cfc3b3}
.dot.ok{background:var(--good)} .dot.err{background:#e0552f} .dot.wait{background:#e8a33a}

/* ---------- 레이아웃 ---------- */
.grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) 380px;
  gap:12px;padding:10px 12px 12px;
  height:calc(100dvh - 54px);
  min-height:0;
}
body.zoomed .topbar .btn.ghost,
body.zoomed .topbar .btn.code,
body.zoomed .topbar .btn.refresh{display:none}
body.zoomed .grid{grid-template-columns:1fr;gap:0;padding:0;height:calc(100dvh - 54px)}
body.zoomed .msgs{display:none}
body.zoomed .alb-head,body.zoomed .thumbs,body.zoomed .player{display:none}
body.zoomed .album{border:0;box-shadow:none;background:transparent;padding:0}
body.zoomed .frames{padding:6px}

/* ---------- 앨범 ---------- */
.album{
  display:flex;flex-direction:column;gap:9px;min-width:0;min-height:0;
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,253,247,.5));
  border:1px solid var(--line);border-radius:18px;padding:11px 12px 10px;
  box-shadow:0 10px 26px rgba(150,120,85,.09);
}
.alb-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.alb-head h2{font-size:.94rem;font-weight:900;letter-spacing:-.01em;white-space:nowrap}
.alb-head .grow{flex:1}
.cap{
  font-size:.76rem;font-weight:700;padding:8px 10px;border-radius:10px;
  border:1px solid var(--line);background:#fff;min-width:0;width:190px;
}
.cap:focus{outline:2px solid #f4c39c;outline-offset:1px}
.alb-info{font-size:.7rem;font-weight:800;color:var(--muted);white-space:nowrap}

.frames{flex:1;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:10px;min-height:0}
.frames-side{display:grid;grid-template-rows:1fr 1fr;gap:10px;min-height:0}
.frame{
  position:relative;margin:0;min-height:0;min-width:0;
  background:#fff;border-radius:16px;padding:7px;
  box-shadow:0 10px 26px rgba(120,90,60,.18),0 1px 0 rgba(255,255,255,.9) inset,0 0 0 1px rgba(226,212,193,.9);
  display:flex;cursor:pointer;overflow:hidden;
  transition:transform .18s ease, box-shadow .18s ease;
}
.frame:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(120,90,60,.22)}
.frame img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block;background:#f3ebdd}
.frame img[hidden]{display:none}
.frame .cap-line{
  position:absolute;left:7px;right:7px;bottom:7px;
  padding:18px 10px 9px;border-radius:0 0 10px 10px;
  background:linear-gradient(180deg,rgba(20,14,8,0),rgba(20,14,8,.62));
  color:#fff;font-size:.74rem;font-weight:800;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  pointer-events:none;
}
.frame .cap-line em{font-style:normal;font-weight:700;opacity:.85;font-size:.68rem}
.frame .tag{
  position:absolute;top:14px;left:14px;
  font-size:.62rem;font-weight:900;padding:3px 7px;border-radius:999px;
  background:rgba(255,255,255,.9);color:#7a5c3c;letter-spacing:.02em;
}
.frame.main .tag{background:rgba(255,244,229,.95);color:#a5551f}
.frame .ph{
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
  width:100%;height:100%;border-radius:10px;background:#faf3e7;
  color:#b6a48c;font-size:.74rem;font-weight:800;text-align:center;padding:10px;
  border:1px dashed #e6d5bb;
}
.frame.is-empty .cap-line{display:none}
.frame.is-empty .ph{background:linear-gradient(180deg,#fdf8ef,#f8efdf)}

.empty{display:none;flex:1;min-height:240px;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:10px}
.empty svg{width:min(320px,72%);height:auto}
.empty p{margin:0;font-size:.9rem;font-weight:800;color:#7c6a55;line-height:1.5}
.empty p small{display:block;font-size:.76rem;font-weight:700;color:var(--muted);margin-top:4px}
.noPhotos .frames{display:none}
.noPhotos .empty{display:flex}
.noPhotos .player,.noPhotos .thumbs{display:none}

.player{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pbtn{
  width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  background:#fff;border:1px solid var(--line);font-size:.86rem;font-weight:900;
  box-shadow:0 1px 3px rgba(120,90,60,.1);
}
.pbtn:active{transform:scale(.95)}
.pbtn.play{background:linear-gradient(180deg,#ffc48f,#f0913f);color:#fff;border-color:#e08a3f}
.ivl{display:flex;gap:4px;margin-left:2px}
.ivl button{font-size:.7rem;font-weight:900;padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.ivl button.on{background:#fff1e0;border-color:#f0cba6;color:#a5551f}
.player .sp{flex:1}
#pInfo{font-size:.7rem;font-weight:800;color:var(--muted);white-space:nowrap}

.thumbs{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;padding:2px 1px 4px;min-height:78px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.thumb{
  position:relative;flex:0 0 auto;width:96px;height:72px;border-radius:10px;overflow:hidden;
  border:2px solid #fff;box-shadow:0 2px 8px rgba(120,90,60,.18);background:#f3ebdd;
}
.thumb.sel{border-color:#f0913f;box-shadow:0 0 0 2px #ffd9b6,0 2px 8px rgba(120,90,60,.2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{
  position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;
  background:rgba(30,20,12,.62);color:#fff;font-size:.68rem;font-weight:900;line-height:20px;text-align:center;
}
.thumb .who{position:absolute;left:0;right:0;bottom:0;font-size:.56rem;font-weight:800;color:#fff;
  background:linear-gradient(180deg,rgba(20,14,8,0),rgba(20,14,8,.66));padding:8px 4px 2px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 메시지 ---------- */
.msgs{
  display:flex;flex-direction:column;min-height:0;min-width:0;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 10px 26px rgba(150,120,85,.09);overflow:hidden;
}
.msg-head{display:flex;align-items:center;gap:8px;padding:10px 11px 8px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.msg-head h2{font-size:.94rem;font-weight:900;white-space:nowrap}
.filters{display:flex;gap:4px;margin-left:auto}
.filters button{font-size:.68rem;font-weight:900;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fff}
.filters button.on{background:#eaf8f0;border-color:#b6e3c9;color:#1d7a4f}

.composer{padding:9px 11px 10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fffdf8,#fdf6ea);display:flex;flex-direction:column;gap:6px}
.lbl{font-size:.66rem;font-weight:900;color:var(--muted);letter-spacing:.01em}
.row2{display:flex;gap:6px;align-items:center}
.fin,.tin{
  flex:1;min-width:0;font-size:.8rem;font-weight:800;padding:8px 10px;border-radius:10px;
  border:1px solid var(--line);background:#fff;
}
.fin:focus,.tin:focus,.msgIn:focus{outline:2px solid #f4c39c;outline-offset:1px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{
  font-size:.72rem;font-weight:900;padding:5px 9px;border-radius:999px;
  border:1px solid var(--line);background:#fff;color:#6f6252;white-space:nowrap;
}
.chip.on{background:#fff1e0;border-color:#f0cba6;color:#a5551f;box-shadow:0 0 0 1px #ffe3c8 inset}
.chip.egg.on{background:#fff8dc;border-color:#ecd589;color:#8a6508}
.msgIn{
  width:100%;font-size:.86rem;font-weight:700;padding:9px 10px;border-radius:10px;
  border:1px solid var(--line);background:#fff;resize:none;line-height:1.4;min-height:46px;
}
.colors{display:flex;gap:6px;align-items:center}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw[data-c="yellow"]{background:var(--note-y)} .sw[data-c="pink"]{background:var(--note-p)}
.sw[data-c="blue"]{background:var(--note-b)} .sw[data-c="green"]{background:var(--note-g)}
.sw.on{box-shadow:0 0 0 2px #f0913f}
#btnSend{font-size:.82rem;font-weight:900;padding:9px 12px;border-radius:11px;
  background:linear-gradient(180deg,#ffb37a,#ec7f42);color:#fff;box-shadow:0 3px 10px rgba(224,130,74,.34);white-space:nowrap}
#btnSend:active{transform:scale(.98)}

.msglist{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.note{
  position:relative;border-radius:12px;padding:9px 10px 8px;
  box-shadow:0 3px 10px rgba(140,110,75,.14),0 1px 0 rgba(255,255,255,.7) inset;
  border:1px solid rgba(190,165,130,.35);
}
.note.yellow{background:var(--note-y)} .note.pink{background:var(--note-p)}
.note.blue{background:var(--note-b)} .note.green{background:var(--note-g)}
.note.pinned{box-shadow:0 0 0 2px #f0913f,0 4px 12px rgba(140,110,75,.2)}
.note.mine{outline:2px dashed rgba(47,154,99,.5);outline-offset:1px}
.note .hdr{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:.66rem;font-weight:900;color:#6b5a44;margin-bottom:3px}
.note .badge{background:rgba(255,255,255,.82);border-radius:999px;padding:2px 7px;border:1px solid rgba(180,155,120,.4)}
.note .badge.to{background:#fff;color:#a5551f}
.note .txt{font-size:.92rem;font-weight:800;line-height:1.42;word-break:break-word;white-space:pre-wrap}
.note.kid .txt{font-size:1rem}
.note .foot{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:.62rem;font-weight:800;color:#7a6a55}
.note .foot .sp{flex:1}
.act{font-size:.68rem;font-weight:900;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(180,155,120,.4);color:#6b5a44}
.act.on{background:#ffe3d0;border-color:#f0b98e;color:#a8401f}
.msg-empty{text-align:center;font-size:.8rem;font-weight:800;color:var(--muted);padding:16px 8px;line-height:1.6}

/* ---------- 코드 게이트 · 모달 ---------- */
.gate{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:18px;
  background:rgba(48,36,24,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.gate[hidden]{display:none}
.gcard{width:min(430px,100%);background:var(--card);border-radius:20px;padding:20px 18px;box-shadow:0 20px 50px rgba(60,40,20,.3);text-align:center}
.gcard h2{font-size:1.06rem;font-weight:900;margin-bottom:6px}
.gcard p{font-size:.82rem;font-weight:700;color:var(--muted);line-height:1.55;margin:0 0 14px}
.gcard input{width:100%;text-align:center;font-size:1.3rem;font-weight:900;letter-spacing:.22em;text-transform:uppercase;
  padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-family:ui-monospace,Menlo,monospace}
.gcard .btns{display:flex;gap:8px;margin-top:12px}
.gcard .btns .btn{flex:1;justify-content:center;padding:11px}
.gnote{font-size:.7rem;font-weight:800;color:var(--muted);margin-top:12px;line-height:1.6}

.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;background:rgba(40,28,16,.38)}
.modal[hidden]{display:none}
.sheet{width:min(460px,100%);max-height:86dvh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(60,40,20,.25)}
.sheet h3{font-size:1rem;font-weight:900;margin-bottom:4px}
.sheet .sub{font-size:.76rem;font-weight:700;color:var(--muted);line-height:1.5;margin-bottom:12px}
.bigcode{font-family:ui-monospace,Menlo,monospace;font-size:2.1rem;font-weight:900;letter-spacing:.3em;text-align:center;
  padding:12px;border-radius:14px;background:#fff5e9;border:1px dashed #eac9a5;color:#a5551f;margin-bottom:10px}
.linkbox{display:flex;gap:6px;margin-bottom:12px}
.linkbox input{flex:1;min-width:0;font-size:.7rem;font-weight:700;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:#6b5a44}
.sheet .row{display:flex;gap:6px;margin-bottom:8px}
.sheet input.txt{flex:1;min-width:0;font-size:.9rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
  padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-family:ui-monospace,Menlo,monospace;text-align:center}
.sheet .btn{justify-content:center}
.sync-line{font-size:.7rem;font-weight:800;color:var(--muted);margin-top:10px;line-height:1.6}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  z-index:120;background:rgba(47,39,33,.94);color:#fff;font-size:.8rem;font-weight:800;
  padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 반응형 ---------- */
@media (max-width:900px){
  .grid{grid-template-columns:1fr;height:auto;gap:10px;padding:8px 10px 16px}
  .album,.msgs{max-height:none}
  .frames{display:block;min-height:0;flex:0 0 auto}
  .frame.main{aspect-ratio:4/3;max-height:40vh;width:100%}
  .frames-side{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto;gap:8px;margin-top:8px}
  .frame.sub{aspect-ratio:1/1;max-height:22vh;width:100%}
  .msglist{max-height:none;overflow:visible}
  .msgs{overflow:visible}
  body.zoomed .grid{height:auto}
  body.zoomed .frame.main{aspect-ratio:4/3}
}
@media (max-width:640px){
  .topbar{flex-wrap:wrap;gap:5px 7px;padding:6px 10px}
  .tb-clock{flex:1 1 auto}
  .tb-mid{flex:0 0 auto;order:2}
  .tb-right{flex:1 0 100%;order:3;justify-content:flex-end;gap:5px}
  #clock{font-size:1.18rem}
  #dates{font-size:.66rem}
  .dadpill{font-size:.64rem;padding:3px 8px}
  .dadpill small{display:none}
  .btn{font-size:.7rem;padding:6px 9px}
  .btn .btxt{display:none}
  .btn.code .btxt{display:inline}
  .cap{width:100%;order:5}
  .alb-head h2{font-size:.88rem}
  .alb-info{order:6}
  .thumbs{min-height:70px}
  .thumb{width:84px;height:64px}
  .composer{padding:8px 9px;gap:5px}
  .composer .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .composer .chips::-webkit-scrollbar{display:none}
  .fin{font-size:.78rem;padding:7px 9px}
  #fromHint{display:none}
  .msgIn{font-size:.84rem;min-height:42px}
  .note .txt{font-size:.88rem}
  .gcard input{font-size:1.1rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="tb-clock">
      <span id="clock">--:--</span>
      <span id="dates">—</span>
    </div>
    <div class="tb-mid">
      <span id="dadPill" class="dadpill">👮 근무 확인 중</span>
      <span id="statusDot" class="dot wait" title="연결 상태"></span>
    </div>
    <div class="tb-right">
      <button id="btnCode" class="btn code" type="button"><span>👨‍👩‍👧‍👦</span><b id="codeVal">코드 연결</b></button>
      <button id="btnRefresh" class="btn refresh" type="button" title="가족 사진·메시지 새로고침" aria-label="새로고침">🔄</button>
      <button id="btnFrame" class="btn" type="button">🖼️ <span class="btxt">액자 모드</span></button>
      <a class="btn ghost" href="index.html">🏠 <span class="btxt">대시보드</span></a>
    </div>
  </header>

  <main class="grid">
    <section class="album noPhotos" id="albumBox">
      <div class="alb-head">
        <h2>📸 가족 사진 액자</h2>
        <span class="grow"></span>
        <input id="capIn" class="cap" type="text" maxlength="40" placeholder="사진 설명 (선택)" autocomplete="off">
        <label class="btn primary" for="fileIn">+ 사진 올리기
          <input id="fileIn" type="file" accept="image/*" multiple hidden>
        </label>
        <span id="albInfo" class="alb-info">사진 0/15</span>
      </div>

      <div class="frames" id="frames">
        <figure class="frame main" data-f="0">
          <span class="tag">액자 1</span>
          <img alt="" hidden>

<script>
/* =====================================================================
   family-board.html — 가족 공유 포토 액자 + 가족 메시지 보드 (2026-11-26)
   · 기존 index.html · parent.html · 스터디 보드와 같은 가족 코드를 쓴다
       - 이 기기 표식: haeyuli.family.v1 (.code) · haeyuli.family.code.v1 · yuli.famsync.v1
   · 자료는 보드 문서(haeyuli-<코드>)와 섞이지 않게 따로 저장한다
       - 색인/메시지 : https://mantledb.sh/v2/haeyuli-album-<코드>/data
       - 사진 한 장  : https://mantledb.sh/v2/haeyuli-album-<코드>/ph/<사진id>
     (MantleDB 무료 등급은 항목 하나가 64KB까지라 사진은 장당 한 항목으로 나눠 올린다)
   ===================================================================== */
(function(){
"use strict";

var MB       = "https://mantledb.sh/v2/";
var FAM_KEY  = "haeyuli.family.v1";
var FAM_KEY2 = "haeyuli.family.code.v1";
var FAM_KEY3 = "yuli.famsync.v1";
var KWHO     = "haeyuli.album.who.v1";
var KCOLOR   = "haeyuli.album.color.v1";
var KTO      = "haeyuli.album.to.v1";
var KIMG     = "haeyuli.album.img.v1";
var KLIKED   = "haeyuli.album.liked.v1";
var MAXP     = 15;          /* 액자 사진 최대 장수 */
var MAXB64   = 52000;       /* 사진 한 장 base64 상한 (항목 64KB 제한 안쪽) */
var POLL     = 15000;
var CODESET  = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
var WEEK     = ["일","월","화","수","목","금","토"];
var NOTE_COLORS = ["yellow","pink","blue","green"];

var S = {
  code:"", doc:freshDoc(), busy:false, err:"", last:0,
  imgs:{},            /* id -> dataURL (이 기기 캐시 + 방금 올린 것) */
  filter:"all",
  ivl:5000, playing:true,
  fi:[0,1,2],         /* 액자별 사진 위치 */
  timers:[0,0,0]
};

/* ---------------- 작은 도구 ---------------- */
function $(id){ return document.getElementById(id); }
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function lsJSON(k, fb){ try{ var v = JSON.parse(localStorage.getItem(k)||"null"); return v===null?fb:v; }catch(e){ return fb; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function lsStr(k, fb){ try{ var v = localStorage.getItem(k); return v==null?fb:v; }catch(e){ return fb; } }
function lsStrSet(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } }
function dk(d){ d = d||new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function toast(msg){
  var t = $("toast"); if(!t) return;
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 2600);
}
function fmtHM(ts){
  if(!ts) return "";
  var d = new Date(ts), h = d.getHours(), m = d.getMinutes();
  return (h<12?"오전 ":"오후 ") + ((h%12)||12) + ":" + pad2(m);
}
function fmtMD(ts){
  if(!ts) return "";
  var d = new Date(ts), now = new Date();
  if(dk(d)===dk(now)) return "오늘 " + fmtHM(ts);
  if(dk(d)===dk(new Date(Date.now()-86400000))) return "어제 " + fmtHM(ts);
  return (d.getMonth()+1) + "월 " + d.getDate() + "일";
}

/* ---------------- 가족 코드 ---------------- */
function famObj(){
  var f = lsJSON(FAM_KEY, null);
  return (f && typeof f==="object") ? f : {};
}
function normCode(v){
  return String(v==null?"":v).toUpperCase().replace(/[^0-9A-Z]/g,"").slice(0,10);
}
function readCode(){
  var f = famObj();
  if(f.code) return normCode(f.code);
  var raw = lsStr(FAM_KEY2, "");
  if(raw){
    raw = String(raw).trim();
    if(raw.charAt(0)==="{"){
      try{ var o = JSON.parse(raw); if(o && o.code) return normCode(o.code); }catch(e){}
    } else if(raw) return normCode(raw);
  }
  var g = lsJSON(FAM_KEY3, null);
  if(g && g.code) return normCode(g.code);
  return "";
}
function saveCode(code){
  code = normCode(code);
  var f = famObj();
  f.code = code; f.at = Date.now();
  lsSet(FAM_KEY, f);
  lsStrSet(FAM_KEY2, code);
  try{
    var g = lsJSON(FAM_KEY3, null);
    if(g && typeof g==="object"){ g.code = code; lsSet(FAM_KEY3, g); }
  }catch(e){}
  return code;
}
function newCode(){
  var out = "";
  for(var i=0;i<6;i++) out += CODESET.charAt(Math.floor(Math.random()*CODESET.length));
  return out;
}
function shareLink(code){
  return location.origin + location.pathname + "?code=" + encodeURIComponent(code||S.code);
}

/* ---------------- 클라우드 ---------------- */
function nsOf(code){ return "haeyuli-album-" + String(code||"").toLowerCase(); }
function nsUrl(path){
  return MB + encodeURIComponent(nsOf(S.code)) + "/" + path;
}
function apiGet(path){
  return fetch(nsUrl(path) + (path.indexOf("?")<0 ? "?t="+Date.now() : ""), {cache:"no-store", mode:"cors"})
    .then(function(r){
      if(r.status===404) return null;
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    });
}
function apiPut(path, doc){
  var body = JSON.stringify(doc);
  if(body.length > 63000) return Promise.reject(new Error("TOOBIG"));
  return fetch(nsUrl(path), {method:"POST", headers:{"Content-Type":"application/json"}, body:body})
    .then(function(r){
      if(r.status===413) throw new Error("TOOBIG");
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    });
}
function apiDel(path){
  return fetch(nsUrl(path), {method:"DELETE", cache:"no-store"}).catch(function(){ return null; });
}

function freshDoc(){ return {v:2, code:"", at:0, photos:[], del:[], messages:[], msgDel:[]}; }
function normDoc(d){
  var o = freshDoc();
  if(!d || typeof d!=="object") return o;
  o.v = 2;
  o.code = d.code ? String(d.code) : "";
  o.at = Number(d.at)||0;
  if(Array.isArray(d.photos)){
    o.photos = d.photos.filter(function(p){ return p && p.id; }).map(function(p){
      return { id:String(p.id), cap:String(p.cap||""), by:String(p.by||""),
               at:Number(p.at)||0, w:Number(p.w)||0, h:Number(p.h)||0, kb:Number(p.kb)||0 };
    });
  }
  if(Array.isArray(d.messages)){
    o.messages = d.messages.filter(function(m){ return m && m.id && m.text; }).map(function(m){
      return { id:String(m.id), from:String(m.from||"가족"), to:String(m.to||"모두에게"),
               text:String(m.text).slice(0,200), color:(NOTE_COLORS.indexOf(m.color)>=0?m.color:"yellow"),
               at:Number(m.at)||0, pin:!!m.pin, likes:Number(m.likes)||0 };
    });
  }
  o.del = Array.isArray(d.del) ? d.del.map(String) : [];
  o.msgDel = Array.isArray(d.msgDel) ? d.msgDel.map(String) : [];
  return o;
}

/* 같은 가족 코드 문서를 여러 기기가 함께 쓰므로, 저장 직전 최신 문서를 다시 받아 병합한다 */
function commit(mut){
  if(!S.code){ openCodeSheet("먼저 가족 코드를 연결해 주세요"); return Promise.resolve(false); }
  if(S.busy){ toast("잠깐만요 · 동기화 중이에요"); return Promise.resolve(false); }
  S.busy = true; paintStatus();
  return apiGet("data").then(function(doc){
    var d = normDoc(doc);
    mut(d);
    if(d.photos.length > MAXP) d.photos = d.photos.slice(d.photos.length-MAXP);
    if(d.messages.length > 90){
      var pins = d.messages.filter(function(m){ return m.pin; });
      var rest = d.messages.filter(function(m){ return !m.pin; }).slice(-(90-pins.length));
      d.messages = pins.concat(rest);
    }
    d.v = 2; d.code = S.code; d.at = Date.now();
    return apiPut("data", d).then(function(){
      S.doc = d; S.last = Date.now(); S.err = "";
      renderAll();
      return true;
    });
  }).catch(function(e){
    var m = String((e && e.message) || e);
    S.err = m;
    if(m === "TOOBIG") toast("저장할 내용이 너무 커요 · 사진이나 메시지를 조금 지워 주세요");
    else toast("저장하지 못했어요 · 인터넷을 확인해 주세요");
    return false;
  }).then(function(ok){
    S.busy = false; paintStatus();
    return ok;
  });
}

function pull(manual){
  if(!S.code){
    $("gate").hidden = false;
    if(manual) toast("가족 코드를 먼저 연결해 주세요");
    paintStatus();
    return Promise.resolve(false);
  }
  if(S.busy) return Promise.resolve(false);
  S.busy = true;
  if(manual) $("btnRefresh").classList.add("spin");
  paintStatus();
  return apiGet("data").then(function(doc){
    S.doc = normDoc(doc);
    S.last = Date.now(); S.err = "";
    if(!S.doc.code) S.doc.code = S.code;
    applyImageCache();
    hydrateImages();
    renderAll();
    return true;
  }).catch(function(e){
    S.err = String((e && e.message) || e);
    paintStatus();
    if(manual) toast("불러오지 못했어요 · 인터넷을 확인해 주세요");
    return false;
  }).then(function(ok){
    S.busy = false;
    $("btnRefresh").classList.remove("spin");
    paintStatus();
    if(manual && ok) toast("🔄 가족 사진·메시지를 새로 받았어요");
    return ok;
  });
}

/* ---------------- 사진 캐시 ---------------- */
function cacheKey(){ return KIMG + "." + (S.code||"-"); }
function applyImageCache(){
  var c = lsJSON(cacheKey(), {}) || {};
  if(typeof c !== "object") c = {};
  var keep = {}, changed = false;
  S.doc.photos.forEach(function(p){
    if(c[p.id]){ S.imgs[p.id] = c[p.id]; keep[p.id] = c[p.id]; }
    if(!keep[p.id]) changed = true;
  });
  /* 지워진 사진은 캐시에서도 정리 */
  Object.keys(c).forEach(function(k){ if(!keep[k]) changed = true; });
  if(changed){
    var ok = lsSet(cacheKey(), keep);
    if(!ok && S.doc.photos.length){
      /* 저장 공간이 부족하면 오래된 사진 캐시부터 줄인다 */
      var ids = S.doc.photos.map(function(p){ return p.id; }).slice(-6);
      var small = {};
      ids.forEach(function(id){ if(keep[id]) small[id] = keep[id]; });
      lsSet(cacheKey(), small);
    }
  }
}
function putImgCache(id, data){
  S.imgs[id] = data;
  var c = lsJSON(cacheKey(), {}) || {};
  if(typeof c !== "object") c = {};
  c[id] = data;
  if(!lsSet(cacheKey(), c)){
    /* 공간 부족 → 최근 8장만 남기고 다시 */
    var ids = S.doc.photos.map(function(p){ return p.id; }).slice(-8);
    var small = {};
    ids.forEach(function(i){ if(c[i]) small[i] = c[i]; });
    lsSet(cacheKey(), small);
  }
}
function hydrateImages(){
  var todo = S.doc.photos.filter(function(p){ return !S.imgs[p.id]; });
  if(!todo.length) return;
  var i = 0;
  function next(){
    if(i >= todo.length) return;
    var p = todo[i++];
    apiGet("ph/"+encodeURIComponent(p.id)).then(function(d){
      if(d && d.im && String(d.im).length > 100) putImgCache(p.id, d.im);
    }).catch(function(){}).then(function(){
      renderFrames(); renderThumbs();
      setTimeout(next, 60);
    });
  }
  next();
}

/* ---------------- 상태 표시 ---------------- */
function paintStatus(){
  var b = $("btnCode"), v = $("codeVal"), dot = $("statusDot");
  if(b && v){
    if(S.code){
      v.textContent = S.code;
      b.classList.add("ok");
    } else {
      v.textContent = "코드 연결";
      b.classList.remove("ok");
    }
  }
  if(dot){
    dot.className = "dot " + (S.busy ? "wait" : (S.code ? (S.err ? "err" : "ok") : ""));
    dot.title = S.busy ? "동기화 중" : (!S.code ? "코드 연결 안 됨"
              : (S.err ? "연결 오류: " + S.err : "연결됨 · " + fmtHM(S.last)));
  }
  var info = $("albInfo");
  if(info){
    var kb = 0;
    S.doc.photos.forEach(function(p){ kb += Number(p.kb)||0; });
    info.textContent = "사진 " + S.doc.photos.length + "/" + MAXP + (kb ? " · 약 " + (kb>999 ? (kb/1024).toFixed(1) + "MB" : kb + "KB") : "");
    info.title = "사진은 기기·화면에 맞게 자동으로 줄여서 저장해요 (장당 약 40KB)";
  }
}

/* ---------------- 시계 · 아빠 근무 ---------------- */
var SHIFTS = {
  duty:{e:"🚨",n:"당직",c:"duty"}, off:{e:"🏡",n:"비번",c:"off"}, leave:{e:"🎫",n:"휴가",c:"leave"},
  day:{e:"☀️",n:"주간",c:"day"}, night:{e:"🌙",n:"야간",c:"night"}
};
function parseKey(s){ var p = String(s||"").split("-"); return new Date(+p[0], (+p[1])-1, +p[2]); }
function dayDiff(a,b){ return Math.round((parseKey(b).getTime()-parseKey(a).getTime())/86400000); }
function dadToday(){
  var base = "2026-11-17", cycle = ["duty","off","off"], ov = {};
  var o = lsJSON("yuli.dad.v1", null);
  if(o && typeof o === "object"){
    if(typeof o.base === "string" && /^\d{4}-\d{2}-\d{2}$/.test(o.base)) base = o.base;
    if(Array.isArray(o.cycle) && o.cycle.length && o.cycle.every(function(c){ return !!SHIFTS[c]; })) cycle = o.cycle;
    if(o.overrides && typeof o.overrides === "object") ov = o.overrides;
  }
  function forDay(d){
    var k = dk(d);
    if(Object.prototype.hasOwnProperty.call(ov, k)){
      var x = ov[k]; return (x === "none" || !SHIFTS[x]) ? null : x;
    }
    var n = cycle.length, diff = dayDiff(base, k), idx = ((diff % n) + n) % n;
    return cycle[idx];
  }
  return { today:forDay(new Date()), tomorrow:forDay(new Date(Date.now()+86400000)) };
}
function tick(){
  var d = new Date();
  $("clock").textContent = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  $("dates").textContent = (d.getMonth()+1) + "월 " + d.getDate() + "일 (" + WEEK[d.getDay()] + ")";
  var s = dadToday(), pill = $("dadPill");
  var a = s.today ? SHIFTS[s.today] : null, b = s.tomorrow ? SHIFTS[s.tomorrow] : null;
  pill.className = "dadpill " + (s.today || "");
  pill.innerHTML = a
    ? (a.e + " 아빠 오늘 " + a.n + " <small>· 내일 " + (b ? b.e + " " + b.n : "미정") + "</small>")
    : ("👮 아빠 근무 미정 <small>· 내일 " + (b ? b.e + " " + b.n : "미정") + "</small>");
}

/* ---------------- 사진 액자 ---------------- */
function photos(){ return S.doc.photos; }
function imgOf(p){ return S.imgs[p.id] || ""; }
function capOf(p){

  if(p.cap) bits.push(p.cap);
  if(p.by) bits.push("👤 " + p.by);
  if(p.at) bits.push(fmtMD(p.at));
  return bits.join(" · ");
}
function syncFi(){
  var n = photos().length;
  if(!n){ S.fi = [0,1,2]; return; }
  var used = {}, out = [];
  for(var f=0; f<3; f++){
    if(n < 3 && f >= n){ out.push(-1); continue; }
    var v = ((S.fi[f] % n) + n) % n;
    var g = 0;
    while(used[v] && g++ < n) v = (v + 1) % n;
    used[v] = 1;
    out.push(v);
  }
  S.fi = out;
}
function renderFrames(){
  var list = photos(), n = list.length;

    if(!el) continue;
    var im = el.querySelector("img"), ph = el.querySelector(".ph"), cap = el.querySelector(".cap-line");

function advance(f, dir){
  var list = photos(), n = list.length;
  if(!n || S.fi[f] < 0) return;
  dir = dir || 1;
  var next = ((S.fi[f] + dir) % n + n) % n;
  if(n >= 3){
    var guard = 0;
    while(guard++ < n && S.fi.some(function(v, idx){ return idx !== f && v >= 0 && (v % n) === next; })) next = ((next + dir) % n + n) % n;
  }
  S.fi[f] = next;
  renderFrames(); renderThumbs();
}
function stopTimers(){
  S.timers.forEach(function(t){ if(t) clearTimeout(t); });
  S.timers = [0,0,0];
}
function scheduleFrame(f, delay){
  S.timers[f] = setTimeout(function(){
    if(!S.playing || document.hidden) { scheduleFrame(f, S.ivl); return; }
    advance(f, 1);
    scheduleFrame(f, S.ivl);
  }, delay);
}
function playTimers(){
  stopTimers();
  if(!S.playing) return;
  for(var f=0; f<3; f++){
    /* 액자마다 시차를 두어 서로 다른 사진이 자연스럽게 바뀌게 한다 */
    scheduleFrame(f, S.ivl * (f===0 ? 1 : (f===1 ? 1.45 : 1.85)));
  }
  $("pPlay").textContent = "⏸";
  $("pPlay").setAttribute("aria-label","일시정지");
}
function pauseTimers(){

  $("pPlay").textContent = "▶";
  $("pPlay").setAttribute("aria-label","재생");
}

/* ---------------- 사진 줄이기 · 올리기 ---------------- */
function fitCanvas(img){
  /* 긴 변 900 → 600px 까지, 화질은 0.62 → 0.38 까지 낮춰 가며 64KB 항목 제한 안에 맞춘다 */
  var ladder = [[900,0.62],[900,0.54],[860,0.52],[820,0.5],[780,0.48],[740,0.46],[700,0.44],[660,0.42],[620,0.4],[560,0.4]];
  var cvs = document.createElement("canvas");
  var ctx = cvs.getContext("2d");
  for(var i=0; i<ladder.length; i++){
    var edge = ladder[i][0], q = ladder[i][1];
    var sc = Math.min(1, edge / Math.max(img.naturalWidth, img.naturalHeight));
    var w = Math.max(1, Math.round(img.naturalWidth * sc));
    var h = Math.max(1, Math.round(img.naturalHeight * sc));
    cvs.width = w; cvs.height = h;
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,w,h);
    ctx.drawImage(img, 0, 0, w, h);
    var data = cvs.toDataURL("image/jpeg", q);
    if(data.length <= MAXB64){
      return { data:data, w:w, h:h, bytes:Math.round(data.length*0.75) };
    }
  }
  return null;
}
function shrinkFile(file){
  return new Promise(function(res){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var out = null;
      try{ out = fitCanvas(img); }catch(e){ out = null; }
      URL.revokeObjectURL(url);
      res(out);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}
function whoNow(){
  var v = ($("fromIn").value || "").trim();
  return v || lsStr(KWHO, "") || "가족";
}
function addPhotos(files){
  if(!S.code){ openCodeSheet("먼저 가족 코드를 연결해 주세요"); return; }
  var list = Array.prototype.slice.call(files || []);
  if(!list.length) return;
  var room = MAXP - photos().length;
  if(room <= 0){ toast("액자 사진은 최대 " + MAXP + "장까지예요 · 하나 지우고 올려 주세요"); return; }
  if(list.length > room){ toast("사진은 " + room + "장만 올릴게요 (최대 " + MAXP + "장)"); list = list.slice(0, room); }
  var cap = ($("capIn") ? $("capIn").value : "").trim().slice(0,40);
  var by = whoNow();
  var done = 0, fail = 0;
  toast("사진 " + list.length + "장을 줄여서 올리는 중…");

  function step(i){
    if(i >= list.length){
      $("capIn").value = "";
      renderAll(); playTimers();
      toast(fail ? ("사진 " + done + "장 올렸어요 · " + fail + "장은 실패") : ("📸 사진 " + done + "장을 올렸어요"));
      return;
    }
    shrinkFile(list[i]).then(function(out){
      if(!out){ fail++; step(i+1); return; }
      var id = uid().slice(0,10);
      apiPut("ph/" + id, {v:1, id:id, im:out.data, at:Date.now()}).then(function(){
        putImgCache(id, out.data);
        return commit(function(d){
          d.photos.push({ id:id, cap:cap, by:by, at:Date.now(), w:out.w, h:out.h, kb:Math.round(out.bytes/1024) });
        });
      }).then(function(ok){
        if(ok) done++; else fail++;
        renderFrames(); renderThumbs();
        step(i+1);
      }).catch(function(){ fail++; step(i+1); });
    });
  }
  step(0);
}
function deletePhoto(id){

  });
}

  });
  document.querySelectorAll('.frame').forEach(function(el){
    el.addEventListener("click", function(){
      var f = Number(el.getAttribute("data-f"));
      if(isNaN(f) || f === 0) return;
      var t = S.fi[f];
      S.fi[f] = S.fi[0];
      S.fi[0] = t;
      renderFrames(); renderThumbs();
    });
  });
  $("thumbs").addEventListener("click", function(e){
    var del = e.target.closest("[data-del]");
    if(del){ e.stopPropagation(); deletePhoto(del.getAttribute("data-del")); return; }
    var th = e.target.closest(".thumb");
    if(th){
      var i = Number(th.getAttribute("data-i")) || 0;
      S.fi[0] = i;
      if(photos().length >= 3){ S.fi[1] = (i+1) % photos().length; S.fi[2] = (i+2) % photos().length; }
      renderFrames(); renderThumbs();
    }
  });
  $("fromChips").addEventListener("click", function(e){
    var b = e.target.closest("[data-from]");
    if(!b) return;
    $("fromIn").value = b.getAttribute("data-from");
    lsStrSet(KWHO, b.getAttribute("data-from"));
    paintFromChips();
    renderMsgs();
  });
  $("fromIn").addEventListener("input", function(){
    lsStrSet(KWHO, this.value.trim());
    paintFromChips();
    renderMsgs();
  });
  $("toChips").addEventListener("click", function(e){
    var b = e.target.closest("[data-to]");
    if(!b) return;
    S.toSel = b.getAttribute("data-to");
    $("toIn").value = "";
    lsStrSet(KTO, S.toSel);
    paintToChips();
  });
  $("toIn").addEventListener("input", function(){ if(this.value.trim()) paintToChips(); });
  $("colorChips").addEventListener("click", function(e){
    var b = e.target.closest("[data-c]");
    if(!b) return;
    S.color = b.getAttribute("data-c");
    lsStrSet(KCOLOR, S.color);
    document.querySelectorAll("#colorChips .sw").forEach(function(x){ x.classList.toggle("on", x === b); });
  });
  $("btnSend").addEventListener("click", sendMsg);
  $("msgIn").addEventListener("keydown", function(e){
    if((e.ctrlKey || e.metaKey) && e.key === "Enter") sendMsg();
  });
  $("msgList").addEventListener("click", function(e){
    var l = e.target.closest("[data-like]");
    if(l){ toggleLike(l.getAttribute("data-like")); return; }
    var p = e.target.closest("[data-pin]");
    if(p){ togglePin(p.getAttribute("data-pin")); return; }
    var d = e.target.closest("[data-delmsg]");
    if(d){ deleteMsg(d.getAttribute("data-delmsg")); return; }
  });
  document.querySelectorAll(".filters button").forEach(function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll(".filters button").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      S.filter = b.getAttribute("data-filter");
      renderMsgs();
    });
  });
  $("gateGo").addEventListener("click", function(){ join($("gateCode").value); });
  $("gateCode").addEventListener("keydown", function(e){ if(e.key === "Enter") join($("gateCode").value); });
  $("modal").addEventListener("click", function(e){ if(e.target === $("modal")) closeModal(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if(!$("modal").hidden) closeModal();
      else if(document.body.classList.contains("zoomed")) toggleZoom();
    }
    if(e.key === "ArrowRight" && !e.target.matches("input,textarea")) { S.playing = false; pauseTimers(); advanceAll(1); }
    if(e.key === "ArrowLeft" && !e.target.matches("input,textarea")) { S.playing = false; pauseTimers(); advanceAll(-1); }
  });
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) pull(false);
  });
  window.addEventListener("online", function(){ pull(false); });
  window.addEventListener("focus", function(){ if(Date.now() - S.last > 8000) pull(false); });
  window.addEventListener("resize", function(){ renderFrames(); });
}
function advanceAll(dir){
  var n = photos().length;
  if(!n) return;
  S.fi = S.fi.map(function(v){ return v < 0 ? v : ((v + dir) % n + n) % n; });
  renderFrames(); renderThumbs();
}
function paintFromChips(){
  var v = ($("fromIn").value || "").trim();
  document.querySelectorAll("#fromChips .chip").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-from") === v);
  });
  var hint = $("fromHint");
  if(hint) hint.textContent = v ? ("→ " + v) : "누구세요?";
}
function paintToChips(){
  var custom = ($("toIn").value || "").trim();
  document.querySelectorAll("#toChips .chip").forEach(function(b){
    b.classList.toggle("on", !custom && b.getAttribute("data-to") === (S.toSel || "모두에게"));
  });
}

/* ---------------- 시작 ---------------- */
function boot(){
  /* ?code=XXXX 가족 링크로 열면 바로 연결 */
  var q = null;
  try{ q = new URLSearchParams(location.search); }catch(e){}
  var qc = q && q.get("code");
  if(qc && normCode(qc).length >= 4){
    saveCode(qc);
    if(q.get("code") !== normCode(qc)){ /* 값은 그대로 두고 저장만 */ }
  }
  S.code = readCode();

  /* 이 기기에 남아 있던 보내는 사람·색·받는 사람 */
  var w = lsStr(KWHO, "");
  if(w) $("fromIn").value = w;
  var c = lsStr(KCOLOR, "yellow");
  if(NOTE_COLORS.indexOf(c) < 0) c = "yellow";
  S.color = c;
  document.querySelectorAll("#colorChips .sw").forEach(function(x){
    x.classList.toggle("on", x.getAttribute("data-c") === c);
  });
  S.toSel = lsStr(KTO, "모두에게");
  paintFromChips(); paintToChips();

  bind();
  tick();
  setInterval(tick, 15000);

  if(!S.code){
    $("gate").hidden = false;
    $("gateCode").focus();
    paintStatus();
    renderAll();
    return;
  }
  applyImageCache();
  renderAll();
  pull(false).then(function(){
    playTimers();
  });
  setInterval(function(){ if(!document.hidden) pull(false); }, POLL);
}

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
</script>
</body>
</html>
