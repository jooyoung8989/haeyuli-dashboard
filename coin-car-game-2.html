  var hudStageText = '';
  function medalOf(rank){ return ['🥇', '🥈', '🥉', '4️⃣'][clamp(rank, 1, 4) - 1]; }

  function computeRank(){
    if (G.state === 'start') return 1;
    if (save.raceMode === 'solo' || G.solo || !G.rivals.length) return 1;
    var rank = 1;
    for (var i = 0; i < G.rivals.length; i++){
      var r = G.rivals[i];
      if (r.finished){ rank++; continue; }
      if (r.x > G.car.x + 2) rank++;
    }
    return clamp(rank, 1, 4);
  }

  function updateRankHUD(){
    if (G.solo || save.raceMode === 'solo'){
      var soloTxt = '🚗 혼자 달리기';
      if (rankTextEl.textContent !== soloTxt) rankTextEl.textContent = soloTxt;
      rankTextEl.classList.remove('lead');
      return;
    }
    if (G.state === 'start'){
      if (rankTextEl.textContent !== '🏁 출발 준비'){
        rankTextEl.textContent = '🏁 출발 준비';
        rankTextEl.classList.remove('lead');
      }
      return;
    }
    var rank = computeRank();
    var txt = medalOf(rank) + ' ' + rank + '등 / 4';
    if (rankTextEl.textContent !== txt){
      rankTextEl.textContent = txt;
      rankTextEl.classList.remove('pop');
      void rankTextEl.offsetWidth;
      rankTextEl.classList.add('pop');
    }
    rankTextEl.classList.toggle('lead', rank === 1);
    if (rank < G.rank){ A.pass(); addBubble(G.car.x, G.car.y - 96, '따라잡았다! 🎉', '#e6ffef'); }
    G.rank = rank;
  }

  function fmtM(m){
    m = Math.max(0, Math.round(m / 10) * 10);
    return commaNum(m) + 'm';
  }
  function commaNum(n){
    var s = String(Math.round(n)), out = '';
    for (var i = 0; i < s.length; i++){
      if (i > 0 && (s.length - i) % 3 === 0) out += ',';
      out += s.charAt(i);
    }
    return out;
  }

  function updateHUD(){
    if (coinNumEl.textContent !== String(save.coins)) coinNumEl.textContent = save.coins;
    var v = villageBy(G.village);
    var label = (G.mode === 'free' ? '🎈 ' : '🧮 ') + v.icon + ' ' + v.name + ' · ' + G.stageNo + '탄';
    if (label !== hudStageText){ hudStageText = label; stageNameEl.textContent = label; }
    var prog = clamp(G.car.x / G.stageLen, 0, 1) * 100;
    barFillEl.style.width = prog.toFixed(1) + '%';
    updateRankHUD();
    updateFuelHUD();
    for (var i = 0; i < barDotsEl.children.length && i < G.rivals.length; i++){
      var r = G.rivals[i];
      barDotsEl.children[i].style.left = (clamp(r.x / G.stageLen, 0, 1) * 100).toFixed(1) + '%';
    }
  }

  function updateFuelHUD(){
    var pct = clamp(G.fuel / Math.max(1, G.fuelMax), 0, 1);
    var px = clamp(G.car.x / Math.max(1, G.stageLen), 0, 1) * G.stageMeters;
    var txt = '🏁 ' + fmtM(px) + ' / ' + fmtM(G.stageMeters);
    if (distTextEl.textContent !== txt) distTextEl.textContent = txt;
    var w = (pct * 100).toFixed(1) + '%';
    if (fuelFillEl.style.width !== w) fuelFillEl.style.width = w;
    var fnum = String(Math.max(0, Math.ceil(G.fuel)));
    if (fuelNumEl.textContent !== fnum) fuelNumEl.textContent = fnum;
    var cls = pct <= 0.001 ? 'empty' : (pct < 0.25 ? 'low' : '');
    fuelFillEl.classList.remove('low', 'empty');
    fuelWrapEl.classList.remove('low', 'empty');
    if (cls){ fuelFillEl.classList.add(cls); fuelWrapEl.classList.add(cls); }
    if (x2PillEl) x2PillEl.classList.toggle('on', G.doubleCoinT > 0 && G.state === 'playing');
  }

  function hitMud(m){
    var car = G.car;
    var trait = CAR_TRAIT[save.car] || {};
    var grip = trait.mudGrip == null ? 1 : trait.mudGrip;
    G.slipT = 0.9 * grip;
    car.mudCool = 1.0;
    G.hitCount++;
    A.mud();
    mudSplat(car.x, groundRef(car.x));

      G.deco === 'snow' ? '미끌~! ❄️' : '미끌~! 🟫',
      G.deco === 'snow' ? '#e8fbff' : '#ffe9c9');
    slowDown(0.8 * grip, null);
  }

  /* ---------- 🚧 장애물에 걸리면: 게임오버가 아니라 잠깐 느려져요 ---------- */
  function slowDown(sec, msg, color){
    G.slowT = Math.max(G.slowT, sec);
    G.shake = Math.max(G.shake, 0.45);
    var car = G.car;
    car.vx = Math.min(car.vx, TOP_SPEED[save.upgrades.engine] * 0.26);
    if (msg) addBubble(car.x, car.y - 98, msg, color || '#ffe9c9');
  }

  function hitCone(c){
    if (G.shieldT > 0){
      // 쉴드 방어: 감속 없이 라바콘을 팅! 날려 버려요
      c.hit = true;
      c.flung = true; c.fvx = 210 + Math.random() * 180; c.fvy = -380 - Math.random() * 160;
      c.fx = 0; c.fy = 0;
      c.rot = (Math.random() < 0.5 ? -1 : 1) * 0.5;
      shieldBlock(c.x);
      return;
    }
    var car = G.car;
    c.hit = true;
    c.rot = (Math.random() < 0.5 ? -1 : 1) * (0.45 + Math.random() * 0.3);
    G.hitCount++;
    slowDown(1.5, '라바콘! 휘청~ 🚧', '#ffe0b8');
    A.clank();
    G.shake = 0.6;
    addText(car.x, car.y - 128, '느려졌어요!', '#e05a00');
    for (var i = 0; i < 10; i++){
      addPart({
        x: c.x, y: groundRef(c.x) - 20,
        vx: (Math.random() - 0.5) * 240, vy: -90 - Math.random() * 150,
        life: 0.45 + Math.random() * 0.35, max: 0.8,
        size: 2.5 + Math.random() * 3.5,
        color: i % 2 ? '#ff9a3d' : '#fff8ee',
        grav: 900, front: true, shape: 'circle'
      });
    }
  }

  var TRAP_MSG = {
    puddle: ['물첨벙! 💧', '#d8f6ff'],
    rock: ['쿵! 바위 🪨', '#e8eef4'],
    stump: ['쿵! 그루터기 🪵', '#ffe9c9'],

  function hitTrap(t){
    if (G.shieldT > 0){
      t.hit = true;
      shieldBlock(t.x);

  /* =====================================================================
     14. 연산 퀴즈 — 7살도 바로 풀 수 있는 아주 쉬운 3지선다
     ===================================================================== */
  // 🧮 연산 난이도 (1=쉬움, 2=보통, 3=도전)
  function quizLevel(){ return clamp(save.mathLevel | 0, 1, 3); }
  function ri(n){ return Math.floor(Math.random() * n); }

  function makeQuiz(){
    var lv = quizLevel();
    var a, b, op, ans;
    if (lv <= 1){
      // 1단계 · 쉬움: 합 10 이내 한 자리 덧셈 / 쉬운 한 자리 빨셈
      if (Math.random() < 0.55){
        a = 1 + ri(5);
        b = 1 + ri(10 - a);
        op = '+'; ans = a + b;
      } else {
        a = 3 + ri(7);
        b = 1 + ri(a - 1);
        op = '-'; ans = a - b;
      }
    } else if (lv === 2){
      // 2단계 · 보통: 한 자리 덧셈(합 18 이내) / 두 자리 - 한 자리
      if (Math.random() < 0.5){
        a = 2 + ri(8);
        b = 1 + ri(9);
        op = '+'; ans = a + b;
      } else {
        a = 11 + ri(8);
        b = 2 + ri(7);
        op = '-'; ans = a - b;
      }
    } else {
      // 3단계 · 도전: 두 자리 ± 한 자리, 간단한 곱셈
      var r = Math.random();
      if (r < 0.42){
        a = 13 + ri(76);
        b = 2 + ri(8);
        op = '+'; ans = a + b;
      } else if (r < 0.74){
        a = 23 + ri(64);
        b = 2 + ri(8);
        op = '-'; ans = a - b;
      } else {
        a = 2 + ri(8);
        b = 2 + ri(8);
        op = '×'; ans = a * b;
      }
    }
    var wrongs = [];
    var offs = ans > 20 ? [1, -1, 2, -2, 10, -10, 3, -3] : [1, -1, 2, -2, 3, -3];
    for (var i = 0; i < offs.length; i++){
      var v = ans + offs[i];
      if (v >= 0 && v !== ans && wrongs.indexOf(v) === -1 && (op !== '×' || (v !== a && v !== b))) wrongs.push(v);
      if (wrongs.length === 2) break;
    }
    if (wrongs.length < 2){
      var extra = ans + 4;
      while (wrongs.length < 2){ if (extra !== ans && wrongs.indexOf(extra) === -1) wrongs.push(extra); extra++; }
    }
    var opts = [ans, wrongs[0], wrongs[1]];
    for (var j = opts.length - 1; j > 0; j--){
      var k = Math.floor(Math.random() * (j + 1));
      var tmp = opts[j]; opts[j] = opts[k]; opts[k] = tmp;
    }
    return { a: a, b: b, op: op, ans: ans, options: opts, lv: lv };
  }

  function makeQuizObstacle(){
    var kinds = ['rock', 'box', 'log'];
    var ox = Math.min(G.stageLen - 260, G.car.x + 220);
    G.quizObstacle = {
      x: ox, kind: kinds[(G.quizGate) % 3], state: 'idle',
      y: groundRef(ox), vy: 0, vx: 0, rot: 0, spin: 0, life: 0, ph: Math.random() * 6
    };
  }

  function openQuiz(idx){
    if (G.state !== 'playing') return;
    G.state = 'quiz';
    G.paused = true;
    G.prevState = 'playing';
    G.quizGate = idx + 1;
    G.quiz = makeQuiz();
    G.quiz.idx = idx;
    G.quiz.tries = 0;
    G.quiz.missed = [];
    G.quiz.msg = '';
    G.quiz.reveal = false;
    G.quiz.correct = false;

    G.car.vx = 0;
    A.ensure();

  function renderQuiz(){
    var q = G.quiz;
    if (!q) return;
    var opts = '';
    for (var i = 0; i < q.options.length; i++){
      var v = q.options[i];
      var miss = q.missed.indexOf(v) !== -1;
      opts += '<button class="qBtn' + (miss ? ' miss' : '') + '" data-act="quizAns" data-v="' + v + '">' + v + '</button>';
    }
    showSheet(
      '<div class="quizWrap">' +
        '<div class="qTitle">🧮 연산 퀴즈 ' + (q.idx + 1) + '/' + G.quizAt.length + '</div>' +
        '<div class="qEq">' + q.a + ' ' + q.op + ' ' + q.b + ' = ?</div>' +
        '<div class="qHint">정답이면 🎁 2배 코인 또는 ⛽ 연료통!</div>' +
        '<div class="qOpts">' + opts + '</div>' +
        (q.msg ? '<div class="qMsg' + (q.msgBad ? ' bad' : '') + '">' + q.msg + '</div>' : '') +
        (q.reveal ? '<button class="bigBtn" data-act="quizNext">계속 달리기 🚗</button>' : '') +
      '</div>'
    );
    modal.classList.add('quiz');
  }

    showSheet(
      '<div class="quizWrap">' +
        '<div class="qTitle">🎉 정답!</div>' +
        '<div class="qEq" style="font-size:clamp(24px,6.6vw,32px)">보물을 골라요</div>' +
        '<div class="rewardRow">' +

        '</div>' +

    );
    modal.classList.add('quiz');
  }

  function answerQuiz(v){
    var q = G.quiz;
    if (!q || q.reveal || q.correct) return;
    if (v === q.ans){
      A.note(880, 0.1, 'triangle', 0.14, 0);
      A.note(1174, 0.16, 'triangle', 0.14, 0.09);
      q.correct = true;
      G.quizCorrect++;
      if (G.quizObstacle){
        var obs = G.quizObstacle;
        obs.state = 'fly'; obs.vx = 520; obs.vy = -760; obs.spin = -9;
        rainbowBeam(G.car.x + 40, G.car.y - 40, obs.x, groundRef(obs.x) - 40);
        A.noise(0.3, 0.14, 2000, 0);
      }
      rainbowBurst(G.car.x + 20, G.car.y - 34);
      addBubble(G.car.x, G.car.y - 120, '정답! 🎁', '#e6ffe6');
      renderReward();
    } else {
      q.missed.push(v);
      q.tries++;
      A.fail();
      if (q.tries === 1){
        q.msg = '조금 아쉽네! 다시 골라 볼까요? 😊';
        q.msgBad = true;
        renderQuiz();
      } else {
        q.msg = '정답은 ' + q.ans + '이에요! 다음에 또 도전해요 💛';
        q.msgBad = true;
        q.reveal = true;
        if (G.quizObstacle){
          G.quizObstacle.state = 'hop';
          G.quizObstacle.vx = 110;
          G.quizObstacle.vy = -420;
          G.quizObstacle.spin = 2.5;
        }
        renderQuiz();
      }
    }
  }

  function takeReward(kind){

    if (kind === 'fuel'){

    }

  /* =====================================================================
     15. 스테이지 진행

  function initRivals(){
    if (G.solo){
      G.rivals = [];
      G.rank = 1;
      return;
    }
    var base = rivalSpeedFor(G.village, G.stageNo);

        base: base + d.speed, finished: false, time: 0, place: 0, spinT: 0, ph: i * 2.1,
        lane: [0, -9, -18][i], dscale: [1, 0.91, 0.83][i]
      };
    });
    for (var i = 0; i < G.rivals.length; i++) G.rivals[i].y = surfaceY(G.rivals[i].x);

  function startRun(vid, no){

    car.y = groundRef(0);
    car.vx = 0; car.vy = 0; car.air = false; car.rot = 0; car.spin = 0;

    G.texts.length = 0;
    G.bubbles.length = 0;
    G.fireworks.length = 0;
    G.peels.length = 0;

    G.raceTime = 0;
    G.finishedCount = 0;

    G.quizAt = save.mode === 'free' ? [] : (no >= 6 ? [0.26, 0.52, 0.78] : [0.35, 0.72]);
    G.hintT = (vid === 1 && no === 1) ? 8 : 0;

      return '<i style="background:' + d.color + '"></i>';

    G.state = 'playing';

    hudStageText = '';
    updateHUD();

  function stepDemo(dt){
    var car = G.car;
    car.x += 105 * dt;
    if (car.x > G.stageLen - 600){ car.x = 0; G.scrollX = 0; }
    car.y = surfaceY(car.x);
    car.spin += dt * 4;
    car.rot = Math.atan2(groundRef(car.x + 20) - groundRef(car.x - 20), 40) * 0.7;
  }

  function stepPlaying(dt){
    var car = G.car;
    var lv = save.upgrades;
    var trait = CAR_TRAIT[save.car] || {};
    var boostOn = G.boostT > 0;
    G.raceTime += dt;

    var segHere = waterSegAt(car.x);
    var inW = (segHere && !segHere.bridge) ? segHere : null;
    var slope = (groundRef(car.x + 16) - groundRef(car.x - 16)) / 32;
    var muddy = mudAt(car.x);

    var target = 0;
    if (G.keys.run || boostOn){
      target = TOP_SPEED[lv.engine] * (trait.speedMul || 1);
      if (slope < 0) target *= (1 - clamp(-slope, 0, 1) * 0.20);
      else target *= (1 + clamp(slope, 0, 1) * 0.12);
      if (boostOn){
        target *= 1.85;
      } else {
        if (inW) target *= WATER_SPEED[lv.booster] * (trait.waterMul || 1);
        if (muddy && !car.air) target *= 0.90;
        if (G.slipT > 0) target *= 0.90;
      }
    }
    var accel = boostOn ? 2200 : (G.keys.run ? 900 : 700);
    if (G.slowT > 0) target *= 0.34;   // 함정에 걸리면 확 느려져요
    if (car.vx < target) car.vx = Math.min(target, car.vx + accel * dt);
    else car.vx = Math.max(target, car.vx - (boostOn ? 300 : (G.keys.run ? 620 : 780)) * dt);

    var prevX = car.x;
    car.x += car.vx * dt;
    car.spin += (car.vx * dt) / 14;

    // ⛽ 연료는 달린 거리만큼 줄어요 (부스터를 쓰면 더 빨리)
    var moved = Math.abs(car.vx * dt);
    if (moved > 0){
      var eff = save.fuelEff ? 0.82 : 1;
      var burn = moved / PX_PER_M * G.fuelPerM * eff * (boostOn ? 1.5 : 1);
      G.fuel = Math.max(0, G.fuel - burn);
      G.fuelUsed += burn;
    }

    if (G.boostT > 0) G.boostT -= dt;
    if (G.rainbowT > 0) G.rainbowT -= dt;
    if (G.slipT > 0) G.slipT -= dt;
    if (G.slowT > 0) G.slowT -= dt;
    if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);
    if (G.doubleCoinT > 0) G.doubleCoinT -= dt;
    if (car.pondCool > 0) car.pondCool -= dt;
    if (car.mudCool > 0) car.mudCool -= dt;

    if (G.jumpBuffer > 0){
      G.jumpBuffer -= dt;
      if (!car.air){ doJump(); G.jumpBuffer = 0; }
    }

    var sy = surfaceY(car.x);

    if (car.air){
      car.vy += G.grav * dt;
      car.y += car.vy * dt;
      if (car.y >= sy && car.vy > 0){
        car.y = sy;
        car.vy = 0;
        car.air = false;
        for (var d = 0; d < 5; d++) dust(car.x, car.y);
      }
      car.rot = lerp(car.rot, clamp(car.vy * 0.00045, -0.32, 0.32), 1 - Math.exp(-dt * 8));
    } else {
      car.y = lerp(car.y, sy, 1 - Math.exp(-dt * 18));
      var targetRot = inW ? 0 : Math.atan2(groundRef(car.x + 18) - groundRef(car.x - 18), 36) * 0.85;
      car.rot = lerp(car.rot, targetRot, 1 - Math.exp(-dt * 12));
    }

    // 물 웅덩이 (점프로 넘어요 / 부스터면 그냥 돌파)
    var pond = pondAt(car.x);
    if (pond && !car.air && G.boostT <= 0 && car.pondCool <= 0){
      fallInPond(pond);
    }
    // 진흙 / 빙판
    var mud = mudAt(car.x);
    if (mud && !car.air && G.boostT <= 0 && car.mudCool <= 0 && G.slipT <= 0){
      hitMud(mud);
    }

    // 🛡️ 쉴드 지속 시간 / 팅겨난 라바콘 움직임
    var shWasOn = G.shieldT > 0;
    if (G.shieldT > 0) G.shieldT = Math.max(0, G.shieldT - dt);
    if (G.shieldFlash > 0) G.shieldFlash = Math.max(0, G.shieldFlash - dt);
    if (shWasOn && G.shieldT <= 0) updateBoostHUD();
    for (var cfI = 0; cfI < G.cones.length; cfI++){
      var cf = G.cones[cfI];
      if (!cf.flung) continue;
      cf.fvy += 1500 * dt;
      cf.fx += cf.fvx * dt;
      cf.fy += cf.fvy * dt;
      cf.rot += 5 * dt;
      if (cf.fy >= 0 && cf.fvy > 0){ cf.fy = 0; cf.fvy = 0; cf.fvx *= 0.25; }
    }

    // 🚧 라바콘과 함정: 점프로 넘어가면 쌩~ 지나가요
    var spanA = Math.min(prevX, car.x) - 24;
    var spanB = Math.max(prevX, car.x) + 24;
    for (var conI = 0; conI < G.cones.length; conI++){
      var cone = G.cones[conI];
      if (cone.hit) continue;
      if (spanB < cone.x - 20 || spanA > cone.x + 20) continue;
      var cgy = groundRef(cone.x);
      if (car.air && car.y < cgy - 34) continue;   // 폴짝! 넘었어요
      hitCone(cone);
    }
    for (var trI = 0; trI < G.traps.length; trI++){
      var trp = G.traps[trI];
      if (trp.hit) continue;
      var half = trp.w * 0.5 + 6;
      if (spanB < trp.x - half || spanA > trp.x + half) continue;
      var tgy = groundRef(trp.x);
      if (car.air && car.y < tgy - (trapH(trp) + 16)) continue;
      hitTrap(trp);
    }

    var wNow = waterSegAt(car.x);
    if (wNow && wNow.bridge) wNow = null;

    if (G.keys.run && !inW && !car.air && Math.random() < 0.35){
      dust(car.x - 30, car.y);
    }

    // 코인 먹기
    var cx = car.x;
    var cy = car.y - 34;
    var rad = 46 + (lv.booster - 1) * 5;
    for (var i = 0; i < G.coins.length; i++){
      var c = G.coins[i];
      if (c.got) continue;
      var dx = c.x - cx;
      if (dx < -90 || dx > 280) continue;
      var cy2 = coinY(c);
      var dist = Math.sqrt(dx * dx + (cy2 - cy) * (cy2 - cy));
      if (dist < rad) collectCoin(c);
    }
    // ⛽ 연료통 먹기
    for (var ki = 0; ki < G.cans.length; ki++){
      var can = G.cans[ki];
      if (can.got) continue;
      var kdx = can.x - cx;
      if (kdx < -80 || kdx > 220) continue;
      var kcy = canY(can);
      var kdist = Math.sqrt(kdx * kdx + (kcy - cy) * (kcy - cy));
      if (kdist < rad + 10) collectCan(can);
    }
    // 바나나 줍기
    for (var j = 0; j < G.pickups.length; j++){
      var q2 = G.pickups[j];
      if (q2.got) continue;
      var qdx = q2.x - cx;
      if (qdx > -60 && qdx < 60 && Math.abs(car.y - groundRef(q2.x)) < 130) collectPickup(q2);
    }

    // 🧮 연산 퀴즈
    if (G.quizGate < G.quizAt.length && car.x >= G.stageLen * G.quizAt[G.quizGate]){
      openQuiz(G.quizGate);
      return;
    }

    if (car.x >= G.stageLen){
      finishStage();
      return;
    }

    if (G.fuel <= G.fuelMax * 0.25 && !G.lowWarned){
      G.lowWarned = true;
      addBubble(car.x, car.y - 110, '연료가 얼마 없어요! ⛽', '#fff0c9');
      A.note(660, 0.12, 'square', 0.07, 0);
      A.note(520, 0.14, 'square', 0.07, 0.1);
    } else if (G.fuel > G.fuelMax * 0.4){
      G.lowWarned = false;
    }

    if (G.fuel <= 0.05){
      fuelOut();
      return;
    }

    updateHUD();
  }

  function stepRivals(dt){
    var lv = save.upgrades;
    var top = TOP_SPEED[lv.engine];
    var car = G.car;
    for (var i = 0; i < G.rivals.length; i++){
      var r = G.rivals[i];
      if (r.finished) continue;

      var gap = car.x - r.x;
      var rb = clamp(gap / 1700, -0.09, 0.08);
      var target = top * Math.min(0.97, r.base + rb);
      var slope = (groundRef(r.x + 16) - groundRef(r.x - 16)) / 32;
      target *= (1 - clamp(-slope, 0, 1) * 0.15 + clamp(slope, 0, 1) * 0.08);
      if (r.spinT > 0){
        r.spinT -= dt;
        target *= 0.28;
      }
      if (mudAt(r.x) && !r.air) target *= 0.96;

      // 웅덩이는 살짝 통통 뛰어 넘어요
      if (!r.air && pondAt(r.x) && r.vx > 60){
        r.air = true; r.vy = -460;
      }
      r.vx += (target - r.vx) * (1 - Math.exp(-dt * 2.2));

      r.x += r.vx * dt;
      r.spin += r.vx * dt / 14;

      // 앞에 라바콘이 보이면 라이벌도 폴짝 뛰어요
      if (!r.air){
        for (var qc = 0; qc < G.cones.length; qc++){
          var dq = G.cones[qc].x - r.x;
          if (dq > 10 && dq < 74){ r.air = true; r.vy = -540; break; }
        }
      }

      var sy = surfaceY(r.x);
      if (r.air){
        r.vy += G.grav * dt;
        r.y += r.vy * dt;
        if (r.y >= sy && r.vy > 0){ r.y = sy; r.vy = 0; r.air = false; }
      } else {
        r.y = lerp(r.y, sy, 1 - Math.exp(-dt * 16));
      }
      r.rot = r.spinT > 0 ? Math.sin(G.t * 24) * 0.42 : (inWater(r.x) ? 0 : Math.atan2(groundRef(r.x + 18) - groundRef(r.x - 18), 36) * 0.8);

      // 바나나 껍질을 밟으면 미끌~
      for (var k = 0; k < G.peels.length; k++){
        var p = G.peels[k];
        if (p.got) continue;
        if (r.x >= p.x - 16 && r.x <= p.x + 56){
          p.got = true;
          r.spinT = 1.5;
          r.vx *= 0.4;
          A.slip();
          addBubble(r.x, r.y - 104, '미끌! 🍌', '#fff3a8');
          addText(r.x, r.y - 70, '빙글~', '#c98a00');
          for (var s = 0; s < 8; s++){
            addPart({
              x: p.x, y: groundRef(p.x) - 8,
              vx: (Math.random() - 0.5) * 220, vy: -80 - Math.random() * 140,
              life: 0.5 + Math.random() * 0.4, max: 0.9,
              size: 2.5 + Math.random() * 3,
              color: s % 2 ? '#ffd93d' : '#fff6c1',
              grav: 600, front: true, shape: 'star'
            });
          }
        }
      }

      if (r.x >= G.stageLen && !r.finished){
        r.finished = true;
        r.time = G.raceTime;
        r.place = ++G.finishedCount;
      }
    }
    // 뒤로 멀어진 껍질 정리
    for (var m = G.peels.length - 1; m >= 0; m--){
      if (G.peels[m].got || G.peels[m].x < car.x - 2200) G.peels.splice(m, 1);
    }
  }

  function finishStage(){
    if (G.state !== 'playing') return;
    var solo = G.solo || save.raceMode === 'solo';
    var finished = G.rivals.filter(function(r){ return r.finished; })
      .sort(function(a, b){ return a.place - b.place; });
    var myPlace = solo ? 0 : finished.length + 1;
    var rest = G.rivals.filter(function(r){ return !r.finished; })
      .sort(function(a, b){ return b.x - a.x; });

    var rows = [];
    if (solo){
      rows.push({ place: 0, name: playerLabel(), emoji: '🚗', time: G.raceTime, me: true });
    } else {
      finished.forEach(function(r){
        rows.push({ place: r.place, name: r.name, emoji: r.emoji, time: r.time, me: false });
      });
      rows.push({ place: myPlace, name: playerLabel(), emoji: '🚗', time: G.raceTime, me: true });
      var pp = myPlace + 1;
      rest.forEach(function(r){
        var est = G.raceTime + (G.stageLen - Math.max(r.x, 0)) / Math.max(150, r.vx);
        rows.push({ place: pp++, name: r.name, emoji: r.emoji, time: est, me: false, est: true });
      });
      rows.sort(function(a, b){ return a.place - b.place; });
    }

    var rankBonus = solo ? 30 : raceCoinBonus(myPlace);
    var stageBonus = 20 + G.stageNo * 3 + (G.village - 1) * 5;
    var baseTotal = G.stageCoins + rankBonus + stageBonus;
    var perfect = G.quizAt.length > 0 && G.quizCorrect >= G.quizAt.length;
    var total = perfect ? baseTotal * 2 : baseTotal;

    save.coins += total;
    save.totalCoins += total;

    var key = stageKey(G.village, G.stageNo);
    var prevC = save.cleared[key];
    if (!solo && (!prevC || myPlace < prevC.rank)){
      save.cleared[key] = { rank: myPlace, time: Math.round(G.raceTime * 10) / 10 };
    } else if (solo && !prevC){
      save.cleared[key] = { rank: 0, time: Math.round(G.raceTime * 10) / 10 };
    }
    if (G.stageNo > (save.villageProgress[G.village] | 0)) save.villageProgress[G.village] = G.stageNo;

    save.raceCount++;
    if (!solo && myPlace === 1) save.raceWins++;
    if (!solo && (!save.raceBestRank || myPlace < save.raceBestRank)) save.raceBestRank = myPlace;
    if (!save.raceBestTime || G.raceTime < save.raceBestTime) save.raceBestTime = Math.round(G.raceTime * 10) / 10;
    save.raceHistory.unshift({
      rank: myPlace, time: Math.round(G.raceTime * 10) / 10,
      v: G.village, n: G.stageNo, date: new Date().toISOString().slice(0, 10)
    });
    if (save.raceHistory.length > 8) save.raceHistory.length = 8;
    var nextV = G.stageNo < 10 ? G.village : (G.village < 6 ? G.village + 1 : 6);
    var nextN = G.stageNo < 10 ? G.stageNo + 1 : (G.village < 6 ? 1 : 10);
    save.bestStage = clearedCount() + 1;
    save.lastVillage = nextV;
    save.lastStage = nextN;
    saveGame();

    G.state = 'clear';
    G.results = {
      rows: rows, myPlace: myPlace, rankBonus: rankBonus, stageBonus: stageBonus, solo: solo,
      stageCoins: G.stageCoins, total: total, perfect: perfect,
      fuelLeft: Math.round(G.fuel), hits: G.hitCount, meters: G.stageMeters,
      nextV: nextV,
      nextN: nextN
    };
    G.fwTimer = 0;
    updateHUD();
    updateBoostHUD();
    A.clear();
    renderClear();
    for (var i = 0; i < 5; i++){
      burst(G.W * (0.2 + Math.random() * 0.6), G.H * (0.15 + Math.random() * 0.3));
    }
    // 🎡 마을 마지막 10탄이면 완주 보상 룰렛을 열어 줍니다
    if (G.stageNo === 10){
      setTimeout(function(){
        if (G.state === 'clear') openRoulette({ village: G.village });
      }, 950);
    }
  }

  function drawQuizObstacle(){    var o = G.quizObstacle;
    if (!o) return;
    var sx = o.x - G.scrollX;
    if (sx < -120 || sx > G.W + 120) return;
    var bob = o.state === 'idle' ? Math.sin(G.t * 6 + o.ph) * 2 : 0;
    ctx.save();
    ctx.translate(sx, o.y + bob);
    ctx.rotate(o.rot);
    ctx.fillStyle = 'rgba(20,40,40,.18)';
    ctx.beginPath(); ctx.ellipse(0, 2, 34, 7, 0, 0, TAU); ctx.fill();

    if (o.kind === 'rock'){
      ctx.fillStyle = '#a9b4bf';
      ctx.beginPath();
      ctx.moveTo(-32, 0); ctx.lineTo(-26, -30); ctx.lineTo(-8, -44);
      ctx.lineTo(16, -40); ctx.lineTo(30, -18); ctx.lineTo(26, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#c6d0d9';
      ctx.beginPath(); ctx.moveTo(-20, -32); ctx.lineTo(-6, -40); ctx.lineTo(6, -34); ctx.closePath(); ctx.fill();
    } else if (o.kind === 'box'){
      ctx.fillStyle = '#d9a05f';
      rr(ctx, -28, -40, 56, 40, 6); ctx.fill();
      ctx.strokeStyle = '#b57a40'; ctx.lineWidth = 4;
      rr(ctx, -28, -40, 56, 40, 6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-28, -20); ctx.lineTo(28, -20); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -40); ctx.lineTo(0, 0); ctx.stroke();
    } else {
      ctx.fillStyle = '#b07a45';
      rr(ctx, -34, -26, 68, 26, 12); ctx.fill();
      ctx.fillStyle = '#c98f57';
      ctx.beginPath(); ctx.arc(-34, -13, 13, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(34, -13, 13, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#8a5a33'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(-34, -13, 6, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(34, -13, 6, 0, TAU); ctx.stroke();
    }
    face(ctx, 0, -21, 0.8);
    ctx.restore();

    if (o.state === 'fly' || o.state === 'hop'){
      for (var i = 0; i < 2; i++){
        addPart({
          x: o.x + (Math.random() - 0.5) * 40, y: o.y - 20 - Math.random() * 30,
          vx: -30 - Math.random() * 60, vy: -20,
          life: 0.35, max: 0.35, size: 2 + Math.random() * 3,
          color: 'hsl(' + Math.floor(Math.random() * 360) + ',95%,70%)',
          grav: 120, front: true, shape: 'star'
        });
      }
    }
  }

  function drawWeather(){
    if (G.deco === 'snow'){
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      for (var i = 0; i < 38; i++){
        var sx = (hash(i * 2.7) * G.W + G.t * (12 + hash(i) * 26)) % (G.W + 20) - 10;
        var sy = (hash(i * 5.1) * G.H + G.t * (26 + hash(i * 3) * 30)) % (G.H + 20) - 10;
        var r = 1.6 + hash(i * 7.7) * 2.2;
        ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
      }
    } else if (G.deco === 'space'){
      if (Math.sin(G.t * 0.7) > 0.996){
        ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
        var mx = (G.t * 260) % (G.W + 200) - 100;
        ctx.beginPath(); ctx.moveTo(mx, G.H * 0.18); ctx.lineTo(mx + 60, G.H * 0.18 + 24); ctx.stroke();
      }
    } else if (G.deco === 'volcano'){
      for (var j = 0; j < 18; j++){
        var ex = (hash(j * 9.1) * G.W + Math.sin(G.t + j) * 12) % G.W;
        var ey = G.H - ((G.t * (20 + hash(j) * 40) + hash(j * 3) * G.H) % (G.H * 0.8));
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = j % 2 ? '#ffb703' : '#ff6b1a';
        ctx.beginPath(); ctx.arc(ex, ey, 1.6 + hash(j * 2) * 1.8, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawIntro(){
    if (!G.introT || G.introT <= 0 || G.state !== 'playing') return;
    var total = 2.6;
    var el = total - G.introT;
    var a = clamp(el * 4, 0, 1) * clamp(G.introT / 0.7, 0, 1);
    if (a <= 0) return;
    var pop = 1 + Math.sin(Math.min(el, 0.6) * 6) * 0.03;
    var w = Math.min(G.W * 0.86, 370);
    var h = Math.min(G.H < 460 ? 116 : 150, G.H * 0.30);

    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(G.W / 2, G.H * 0.32);
    ctx.scale(pop, pop);
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    rr(ctx, -w / 2, -h / 2, w, h, 26); ctx.fill();
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 5;
    rr(ctx, -w / 2, -h / 2, w, h, 26); ctx.stroke();

    var v = villageBy(G.village);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e08b00';
    ctx.font = '900 16px ' + FONT;
    ctx.fillText(v.icon + ' ' + v.name + ' · ' + G.stageNo + '탄 · ' + fmtM(G.stageMeters), 0, -h * 0.26);
    ctx.fillStyle = '#2b3f4d';
    ctx.font = '900 ' + Math.round(Math.min(28, w * 0.08)) + 'px ' + FONT;
    ctx.fillText('🧮 연산 레이스!', 0, h * 0.06);
    ctx.fillStyle = '#8b96a2';
    ctx.font = '800 13px ' + FONT;
    ctx.fillText('⛽ 연료를 모으며 결승선까지!', 0, h * 0.31);
    ctx.restore();
  }

  function drawHint(){
    if (G.hintT <= 0 || G.state !== 'playing') return;
    var a = clamp(G.hintT / 1.2, 0, 1);
    var txt = G.car.x < 500 ? '👉 앞으로! 버튼을 꾹 눌러요' : '⬆️ 점프! 버튼도 눌러 봐요';
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = '900 16px ' + FONT;
    var w = ctx.measureText(txt).width + 34;
    var x = G.W / 2 - w / 2;
    var y = G.H - clamp(190, G.H * 0.26, 240);
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    rr(ctx, x, y, w, 42, 21); ctx.fill();
    ctx.fillStyle = '#3a4f5f';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, G.W / 2, y + 22);
    ctx.restore();
  }

  /* ---------- 🎡 마을 완주 보상 룰렛 데이터 ---------- */
  function cleanReward(s){
    s = String(s == null ? '' : s).replace(/[\u0000-\u001f<>]/g, '');
    s = s.replace(/\s+/g, ' ').trim();
    return s.slice(0, REWARD_MAX);
  }
  function rouletteRewards(){
    var out = [];
    var cur = Array.isArray(save.rewards) ? save.rewards : [];
    for (var i = 0; i < 5; i++){
      var v = typeof cur[i] === 'string' ? cleanReward(cur[i]) : '';
      out.push(v || REWARD_DEFAULTS[i]);
    }
    return out;
  }

  var roul = {
    canvas: null, ctx: null, w: 0, h: 0,
    angle: -Math.PI / 2, spinning: false, spinT: 0, spinDur: 3.6,

  function sizeRoulette(){
    var cv = document.getElementById('roulWheel');
    roul.canvas = cv || null;
    roul.ctx = null;
    if (!cv) return false;
    var w = cv.clientWidth || 260;
    var h = cv.clientHeight || w;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    roul.w = w; roul.h = h;
    roul.ctx = cv.getContext('2d');
    roul.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return true;
  }

  function drawRoulette(){
    var c = roul.ctx;
    if (!c) return;
    var w = roul.w, h = roul.h, cx = w / 2, cy = h / 2;
    var R = Math.min(w, h) / 2 - 7;
    c.clearRect(0, 0, w, h);

    // 밖 동그라미
    c.beginPath(); c.arc(cx, cy, R, 0, TAU);
    c.fillStyle = '#fff3cf'; c.fill();
    c.lineWidth = Math.max(6, R * 0.07); c.strokeStyle = '#ffb703'; c.stroke();

    var seg = TAU / 5;
    for (var i = 0; i < 5; i++){
      var a0 = i * seg + roul.angle, a1 = a0 + seg;
      c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, R - 6, a0, a1); c.closePath();
      c.fillStyle = ROUL_COLORS[i]; c.fill();
      c.lineWidth = 2.5; c.strokeStyle = '#ffffff'; c.stroke();

      var am = a0 + seg / 2;
      var tx = cx + Math.cos(am) * R * 0.62, ty = cy + Math.sin(am) * R * 0.62;
      c.save();
      c.translate(tx, ty); c.rotate(am + Math.PI / 2);
      c.fillStyle = '#6b4a2a';
      c.font = '900 ' + Math.round(R * 0.17) + 'px ' + FONT;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(String(i + 1), 0, 0);
      c.restore();
    }

    // 가운데 꼭지
    c.beginPath(); c.arc(cx, cy, R * 0.17, 0, TAU);
    c.fillStyle = '#ffffff'; c.fill();
    c.lineWidth = Math.max(4, R * 0.045); c.strokeStyle = '#ffb703'; c.stroke();
    c.fillStyle = '#ff5d5d';
    c.font = '900 ' + Math.round(R * 0.16) + 'px ' + FONT;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('★', cx, cy + 1);
  }

  function roulStep(ts){
    if (!roul.spinning) return;
    if (!roul.canvas || !document.body.contains(roul.canvas)){ roul.spinning = false; return; }
    if (!roul.last) roul.last = ts;
    var dt = Math.min((ts - roul.last) / 1000, 0.05);
    roul.last = ts;
    roul.spinT += dt;
    var t = clamp(roul.spinT / roul.spinDur, 0, 1);
    var e = t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2;
    roul.angle = roul.from + (roul.to - roul.from) * e;
    drawRoulette();
    if (t >= 1){
      roul.spinning = false;
      roul.angle = roul.to;
      drawRoulette();
      showRoulResult(roul.result);
      return;
    }
    requestAnimationFrame(roulStep);
  }

  function spinRoulette(){
    if (roul.spinning || !roul.canvas) return;
    var idx = ri(5);
    var seg = TAU / 5;
    var jitter = (Math.random() - 0.5) * seg * 0.55;
    var need = -Math.PI / 2 - (idx * seg + seg / 2 + jitter);
    var d = ((need - roul.angle) % TAU + TAU) % TAU;
    roul.result = idx;
    roul.from = roul.angle;
    roul.to = roul.angle + TAU * (5 + ri(2)) + d;
    roul.spinT = 0;
    roul.spinDur = 3.6;
    roul.last = 0;
    roul.spinning = true;
    var btn = sheet.querySelector('[data-act="roulSpin"]');
    if (btn){ btn.disabled = true; btn.textContent = '돌아가는 중… 🎡'; }
    A.click();
    requestAnimationFrame(roulStep);
  }

  /* ---------- 길(SVG) 그리기 ---------- */
  function roadSVG(pts, onArr){
    var segs = [];
    for (var i = 0; i < pts.length - 1; i++){
      var a = pts[i], b = pts[i + 1];
      var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      var dx = b.x - a.x, dy = b.y - a.y;
      var L = Math.sqrt(dx * dx + dy * dy) || 1;
      var amp = (i % 2 ? -1 : 1) * (Math.abs(dy) > Math.abs(dx) ? 5 : 8);
      var cx = mx + (-dy / L) * amp, cy = my + (dx / L) * amp;
      segs.push('M ' + a.x + ' ' + a.y + ' Q ' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + b.x + ' ' + b.y);
    }
    var out = '<svg class="wRoad" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">';
    for (var j = 0; j < segs.length; j++) out += '<path class="wBase" d="' + segs[j] + '"/>';
    for (var s = 0; s < segs.length; s++){
      out += '<path class="' + (onArr[s] ? 'wOn' : 'wOff') + ' wSeg" d="' + segs[s] + '"/>';
    }
    return out + '</svg>';
  }

  function paintPreviews(){
    var list = sheet.querySelectorAll('canvas.prev');
    for (var i = 0; i < list.length; i++){
      var cv = list[i];
      var w = cv.clientWidth || 120;
      var h = cv.clientHeight || 70;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
      var c = cv.getContext('2d');
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.clearRect(0, 0, w, h);
      if (cv.dataset.wheel){
        drawWheel(c, w / 2, h / 2, Math.min(w, h) * 0.33, 0.7, cv.dataset.wheel);
      } else if (cv.dataset.avatar){
        drawDriver(c, w / 2, h * 0.76, Math.min(w, h) / 76, cv.dataset.avatar, save.clothes, save.bag);
      } else if (cv.dataset.cloth){
        drawDriver(c, w / 2, h * 0.76, Math.min(w, h) / 76, save.avatar, cv.dataset.cloth, save.bag);
      } else if (cv.dataset.bag){
        drawDriver(c, w / 2, h * 0.76, Math.min(w, h) / 76, save.avatar, save.clothes, cv.dataset.bag);
      } else {
        var sc = Math.min(w / 120, h / 112);
        drawCarAt(c, w * 0.5, h * 0.96, 0, cv.dataset.type, cv.dataset.color, {
          scale: sc, spin: 0.5, t: 1, shadow: true, fast: true
        });
      }
    }
  }

    hideModal();
    var prev = G.prevState || 'start';
    if (prev === 'playing'){
      G.state = 'playing';
      G.paused = false;
      G.resetT = true;

      if (G.results) renderClear();
    } else {
      G.state = 'start';
      G.paused = false;
      G.prevState = 'start';
      renderStart();
    }
  }

  var pointers = {};

  function bindHold(el, tag, onDown, onUp){
    el.addEventListener('pointerdown', function(e){
      e.preventDefault();
      el.classList.add('active');
      pointers[e.pointerId] = tag;
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      A.ensure();
      onDown();
    });
    function release(e){
      if (pointers[e.pointerId] !== tag) return;
      delete pointers[e.pointerId];
      el.classList.remove('active');
      onUp();
    }
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  }
  function windowRelease(e){
    var tag = pointers[e.pointerId];
    if (!tag) return;
    delete pointers[e.pointerId];
    if (tag === 'run'){
      G.keys.run = false;
      document.getElementById('runBtn').classList.remove('active');
    } else if (tag === 'jump'){
      document.getElementById('jumpBtn').classList.remove('active');
    }
  }
  window.addEventListener('pointerup', windowRelease);
  window.addEventListener('pointercancel', windowRelease);

  bindHold(document.getElementById('runBtn'), 'run',
    function(){ G.keys.run = true; },
    function(){ G.keys.run = false; });

  bindHold(document.getElementById('jumpBtn'), 'jump',
    function(){ if (G.state === 'playing') G.jumpBuffer = 0.16; },
    function(){});

  function tapAction(el, fn){
    el.addEventListener('pointerdown', function(e){
      e.preventDefault();
      el.classList.add('active');
      A.ensure();
      fn();
      setTimeout(function(){ el.classList.remove('active'); }, 130);
    });
    el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  }
  tapAction(boostBtnEl, function(){ useBooster(); });
  tapAction(bananaBtnEl, function(){ dropBanana(); });
  if (shieldBtnEl) tapAction(shieldBtnEl, function(){ useShield(); });

  });

  function buyOrEquip(kind, id){
    var pool, ownKey, curKey, list, price = 0, name = '';
    if (kind === 'Car'){ list = CARS; ownKey = 'ownedCars'; curKey = 'car'; }
    else if (kind === 'Wheel'){ list = WHEELS; ownKey = 'ownedWheels'; curKey = 'wheel'; }
    else if (kind === 'Avatar'){ list = AVATARS; ownKey = 'ownedAvatars'; curKey = 'avatar'; }
    else if (kind === 'Cloth'){ list = CLOTHES; ownKey = 'ownedClothes'; curKey = 'clothes'; }
    else { list = BAGS; ownKey = 'ownedBags'; curKey = 'bag'; }
    for (var i = 0; i < list.length; i++) if (list[i].id === id){ price = list[i].price; name = list[i].name; }
    var owned = save[ownKey].indexOf(id) !== -1;
    if (!owned){
      if (save.coins < price){ A.fail(); return; }
      save.coins -= price;
      save[ownKey].push(id);
      A.buy();
    } else {
      A.click();
    }
    save[curKey] = id;
    saveGame();
    updateHUD();
    updateBoostHUD();
    renderShop();
  }

  sheet.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    A.ensure();

    if (act === 'start'){ A.click(); startRun(save.lastVillage, save.lastStage); return; }
    if (act === 'villages'){ A.click(); renderWorldMap(); return; }
    if (act === 'pickVillage'){
      var pv = parseInt(el.getAttribute('data-v'), 10) || 1;
      if (!villageOpen(pv)){
        A.fail();
        toast('앞 마을의 10탄을 먼저 성공하면 열려요! 🔒');
        return;
      }
      A.click();
      renderStagePick(pv);
      return;
    }
    if (act === 'lockedStage'){
      A.fail();
      toast('앞 단계를 먼저 성공하면 열려요! 🔒');
      return;
    }
    if (act === 'stage'){
      A.click();
      startRun(parseInt(el.getAttribute('data-v'), 10) || 1, parseInt(el.getAttribute('data-n'), 10) || 1);
      return;
    }
    if (act === 'records'){ A.click(); renderRecords(); return; }
    if (act === 'shop'){
      A.click();
      openShop(el.getAttribute('data-tab') || 'car');
      return;
    }
    if (act === 'rescue'){
      if (save.coins < 12){ A.fail(); toast('코인이 조금 모자라요! 🪙'); return; }
      save.coins -= 12;
      G.fuel = clamp(G.fuel + 40, 0, G.fuelMax);
      G.lowWarned = false;
      G.state = 'playing';
      G.paused = false;
      G.prevState = 'playing';
      G.resetT = true;
      G.car.vx = 80;
      hideModal();
      A.fuel();
      saveSoon();
      addBubble(G.car.x, G.car.y - 110, '연료 든든! ⛽', '#d8f6ff');
      updateHUD();
      return;
    }
    if (act === 'buyFuelUp'){
      var fuv = clamp(save.fuelUp | 0, 0, 3);
      if (fuv >= 3) return;
      var fprice = FUEL_UP_PRICES[fuv + 1];
      if (save.coins < fprice){ A.fail(); return; }
      save.coins -= fprice;
      save.fuelUp = fuv + 1;
      A.buy();
      saveGame();
      updateHUD();
      renderShop();
      return;
    }
    if (act === 'buyFuelEff'){
      if (save.fuelEff) return;
      if (save.coins < FUEL_EFF_PRICES[1]){ A.fail(); return; }
      save.coins -= FUEL_EFF_PRICES[1];
      save.fuelEff = 1;
      A.buy();
      saveGame();
      updateHUD();
      renderShop();
      return;
    }
    if (act === 'closeShop'){ A.click(); closeShop(); return; }
    if (act === 'next'){
      A.click();
      startRun(parseInt(el.getAttribute('data-v'), 10) || 1, parseInt(el.getAttribute('data-n'), 10) || 1);
      return;
    }
    if (act === 'retry'){ A.click(); startRun(G.village, G.stageNo); return; }

    if (act === 'tab'){ G.shopTab = el.getAttribute('data-tab'); A.click(); renderShop(); return; }
    if (act === 'styleTab'){ G.styleTab = el.getAttribute('data-tab'); A.click(); renderShop(); return; }
    if (act === 'saveName'){ saveNameFromInput(); return; }
    if (act === 'raceMode'){
      save.raceMode = (el.getAttribute('data-rm') === 'solo' ? 'solo' : 'race');
      saveGame(); A.click();
      toast(save.raceMode === 'solo' ? '🚗 혼자 즐기기 모드로 바꿨어요' : '🏆 경재 모드로 바꿨어요');
      if (G.panel === 'map') renderWorldMap(); else renderStart();
      return;
    }
    if (act === 'runMode'){
      save.mode = (el.getAttribute('data-m') === 'free' ? 'free' : 'math');
      saveGame(); A.click();
      toast(save.mode === 'free' ? '🎈 일반 모드 · 문제 없이 달려요' : '🧮 연산 모드 · 문제를 맞히면 보물!');
      if (G.panel === 'map') renderWorldMap(); else renderStart();
      return;
    }
    if (act === 'settings'){ A.click(); openSettings(); return; }
    if (act === 'saveRewards'){
      readSettingsInputs();
      saveGame();
      A.click();
      toast('보상 5칸을 저장했어요 🎁');
      renderSettings();
      return;
    }
    if (act === 'mathLevel'){
      readSettingsInputs();
      save.mathLevel = clamp(parseInt(el.getAttribute('data-lv'), 10) || 1, 1, 3);
      saveGame();
      A.click();
      toast('연산 난이도 · ' + LEVEL_INFO[save.mathLevel - 1].t + ' ' + LEVEL_INFO[save.mathLevel - 1].s + ' 🧮');
      renderSettings();
      return;
    }
    if (act === 'previewRoul'){
      readSettingsInputs();
      saveGame();
      A.click();
      openRoulette({ preview: true });
      return;
    }
    if (act === 'roulOpen'){ A.click(); openRoulette({ village: G.village || save.lastVillage }); return; }
    if (act === 'roulSpin'){ spinRoulette(); return; }
    if (act === 'roulDone' || act === 'roulClose'){
      A.click();
      if (G.roulPreview){ G.roulPreview = false; renderSettings(); }
      else closeShop();
      return;
    }

    if (act === 'buyCar' || act === 'equipCar'){ buyOrEquip('Car', el.getAttribute('data-id')); return; }
    if (act === 'buyWheel' || act === 'equipWheel'){ buyOrEquip('Wheel', el.getAttribute('data-id')); return; }
    if (act === 'buyAvatar' || act === 'equipAvatar'){ buyOrEquip('Avatar', el.getAttribute('data-id')); return; }
    if (act === 'buyCloth' || act === 'equipCloth'){ buyOrEquip('Cloth', el.getAttribute('data-id')); return; }
    if (act === 'buyBag' || act === 'equipBag'){ buyOrEquip('Bag', el.getAttribute('data-id')); return; }

    if (act === 'buyBoost' || act === 'buyBanana' || act === 'buyShield'){
      var cnt = parseInt(el.getAttribute('data-n'), 10) || 1;
      var packs = act === 'buyBoost' ? BOOST_PACKS : (act === 'buyBanana' ? BANANA_PACKS : SHIELD_PACKS);
      var pk = null;
      for (var i = 0; i < packs.length; i++) if (packs[i].n === cnt) pk = packs[i];
      if (!pk) return;
      if (save.coins < pk.price){ A.fail(); return; }
      save.coins -= pk.price;
      if (act === 'buyBoost') save.boosters += pk.n;
      else if (act === 'buyBanana') save.bananas += pk.n;
      else save.shields += pk.n;
      A.buy();
      saveGame();
      updateHUD();
      updateBoostHUD();
      renderShop();
      return;
    }

    if (act === 'quizAns'){ answerQuiz(parseInt(el.getAttribute('data-v'), 10)); return; }
    if (act === 'quizReward'){ takeReward(el.getAttribute('data-r')); return; }
    if (act === 'quizNext'){ A.click(); resumeFromQuiz(); return; }
  });

  // 이름/보상 입력창에서 Enter → 저장 (게임이 시작되지 않도록 여기서 먼저 막습니다)
  sheet.addEventListener('keydown', function(e){
    var t = e.target;
    if (!t || !t.classList) return;
    if (e.key === 'Enter' || e.keyCode === 13){
      if (t.classList.contains('nameInput')){
        e.preventDefault(); e.stopPropagation();
        saveNameFromInput();
      } else if (t.classList.contains('rwInput')){
        e.preventDefault(); e.stopPropagation();
        readSettingsInputs(); saveGame(); A.click();
        toast('보상 5칸을 저장했어요 🎁');
        renderSettings();
      }
    }
  });

  // 키보드
  window.addEventListener('keydown', function(e){
    var tgt = e.target;
    if (tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.isContentEditable)) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'd' || k === 'D'){
      G.keys.run = true;
      e.preventDefault();
    } else if (k === ' ' || k === 'Spacebar' || k === 'ArrowUp' || k === 'w' || k === 'W'){
      if (!e.repeat && G.state === 'playing') G.jumpBuffer = 0.16;
      e.preventDefault();
    } else if (k === 'x' || k === 'X' || k === 'b' || k === 'B'){
      if (!e.repeat) useBooster();
      e.preventDefault();
    } else if (k === 'n' || k === 'N'){
      if (!e.repeat) dropBanana();
      e.preventDefault();
    } else if (k === 'Escape'){
      if (G.state === 'shop') closeShop();
    } else if (k === 'Enter'){
      if (G.state === 'start') startRun(save.lastVillage, save.lastStage);
    }
    A.ensure();
  });
  window.addEventListener('keyup', function(e){
    var tgt = e.target;
    if (tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.isContentEditable)) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') G.keys.run = false;
    if (k === ' ') e.preventDefault();
  });
  window.addEventListener('blur', function(){ G.keys.run = false; });
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ G.paused = true; }
    else { G.resetT = true; if (G.state === 'playing') G.paused = false; }
  });
  document.addEventListener('contextmenu', function(e){
    if (e.target === canvas) e.preventDefault();
  });

  /* =====================================================================
     19. 메인 루프
     ===================================================================== */
  var lastT = 0;
  function updateObstacle(dt){
    var o = G.quizObstacle;
    if (!o) return;
    if (o.state === 'fly' || o.state === 'hop'){
      o.life += dt;
      o.x += o.vx * dt;
      o.vy += 1500 * dt;
      o.y += o.vy * dt;
      o.rot += o.spin * dt;
      if (o.life > 1.8) G.quizObstacle = null;
    }
  }

  function loop(ts){
    if (!lastT) lastT = ts;
    if (G.resetT){ lastT = ts; G.resetT = false; }
    var dt = (ts - lastT) / 1000;
    lastT = ts;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;

    G.t += dt;

    if (G.state === 'playing' && !G.paused){
      stepPlaying(dt);
      if (G.state === 'playing') stepRivals(dt);
      if (G.hintT > 0) G.hintT -= dt;
      if (G.introT > 0) G.introT -= dt;
    } else if (G.state === 'start'){
      stepDemo(dt);
    } else if (G.state === 'clear'){
      G.fwTimer = (G.fwTimer || 0) - dt;
      if (G.fwTimer <= 0){
        G.fwTimer = 0.55;
        burst(G.W * (0.15 + Math.random() * 0.7), G.H * (0.12 + Math.random() * 0.35));
      }
    }

    updateParts(dt);
    updateTexts(dt);
    updateBubbles(dt);
    updateFireworks(dt);
    updateObstacle(dt);
    if (G.flash){ G.flash.life -= dt; if (G.flash.life <= 0) G.flash = null; }

    var camTarget = G.car.x - G.W * 0.30;
    G.scrollX += (camTarget - G.scrollX) * (1 - Math.exp(-dt * 11));

    if (G.state === 'playing'){
      boostBtnEl.classList.toggle('hot', G.boostT > 0);
      if (G.boostT > 0 && Math.random() < 0.6){
        addPart({
          x: G.car.x - 50 - Math.random() * 30, y: G.car.y - 18 - Math.random() * 40,
          vx: -80 - Math.random() * 80, vy: (Math.random() - 0.5) * 60,
          life: 0.4 + Math.random() * 0.3, max: 0.7,
          size: 3 + Math.random() * 3,
          color: G.rainbowT > 0
            ? 'hsl(' + Math.floor(Math.random() * 360) + ',95%,66%)'
            : (Math.random() < 0.5 ? '#ffd166' : '#ff6b1a'),
          grav: 0, front: true, shape: 'star'
        });
      }
    }

    if (A.engGain && A.ctx){
      var on = (G.state === 'playing' && !G.paused && !A.muted);
      var vol = on ? (0.012 + clamp(G.car.vx / 480, 0, 1) * 0.026) : 0;
      A.engGain.gain.setTargetAtTime(vol, A.ctx.currentTime, 0.12);
      if (on) A.engOsc.frequency.setTargetAtTime(52 + clamp(G.car.vx / 480, 0, 1) * 62 + (G.boostT > 0 ? 26 : 0), A.ctx.currentTime, 0.12);
    }

    render();
    requestAnimationFrame(loop);
  }

  /* =====================================================================
     20. 시작
     ===================================================================== */
  function init(){
    loadGame();
    normalizeUnlocks();
    resize();
    A.setMuted(save.muted);
    buildStage(save.lastVillage, save.lastStage);
    G.mode = save.mode;
    G.solo = save.raceMode === 'solo';
    G.fuel = FUEL_START[clamp(save.fuelUp | 0, 0, 3)];
    G.fuelPerM = fuelRateFor(save.lastVillage, save.lastStage);
    G.lowWarned = false;
    G.car.y = groundRef(0);
    G.scrollX = -G.W * 0.30;
    G.state = 'start';
    G.paused = false;

    barDotsEl.innerHTML = G.solo ? '' : RIVAL_DEFS.map(function(d){
      return '<i style="background:' + d.color + '"></i>';
    }).join('');

    updateHUD();
    updateBoostHUD();
    renderStart();

    // 테스트/디버그용 (게임에는 영향 없음)
    window.__game = {
      G: G, save: save, saveGame: saveGame, startRun: startRun, buildStage: buildStage,
      villages: VILLAGES, cars: CARS, wheels: WHEELS, avatars: AVATARS, clothes: CLOTHES, bags: BAGS,
      rank: computeRank, openQuiz: openQuiz, answerQuiz: answerQuiz, resumeFromQuiz: resumeFromQuiz,
      stageOpen: stageOpen, stageCleared: stageCleared, clearedCount: clearedCount,
      villageOpen: villageOpen, villageDone: villageDone, nextChallenge: nextChallenge,
      renderWorldMap: renderWorldMap, toast: toast, normalizeUnlocks: normalizeUnlocks,
      openShop: openShop, openVillages: openVillages, renderStagePick: renderStagePick,
      renderVillages: renderVillages, useBooster: useBooster, dropBanana: dropBanana, useShield: useShield,
      takeReward: takeReward, hitCone: hitCone, hitTrap: hitTrap, collectCan: collectCan, collectCoin: collectCoin,
      fuelOut: fuelOut, canY: canY, coinY: coinY, fmtM: fmtM, trapH: trapH,
      renderFuelOut: renderFuelOut, render: render, makeQuiz: makeQuiz,
      renderRecords: renderRecords, renderShop: renderShop, renderStart: renderStart, renderClear: renderClear,
      playerLabel: playerLabel, setName: function(v){ save.playerName = cleanName(v); saveGame(); updateHUD(); return playerLabel(); },
      setFuel: function(v){ G.fuel = clamp(v, 0, G.fuelMax); updateHUD(); return G.fuel; },
      autoQuiz: function(kind){
        if (!G.quiz) return null;
        var q = G.quiz;
        var info = { eq: q.a + ' ' + q.op + ' ' + q.b, ans: q.ans, options: q.options.slice() };
        answerQuiz(q.ans);
        if (G.quiz && G.quiz.correct) takeReward(kind || 'fuel');
        return info;
      },
      teleport: function(x){
        var car = G.car;
        car.x = x;
        car.y = surfaceY(x);
        car.vx = 0; car.vy = 0; car.air = false; car.rot = 0;
        car.pondCool = 0; car.mudCool = 0;
        G.slipT = 0; G.quizObstacle = null;
        G.scrollX = Math.max(0, x - G.W * 0.3);
        for (var i = 0; i < G.rivals.length; i++){
          G.rivals[i].x = x - 1600 - i * 120;
          G.rivals[i].finished = false;
          G.rivals[i].y = surfaceY(G.rivals[i].x);
        }
        updateHUD();
        return { x: x, y: car.y };
      },
      sim: function(sec, hold){
        G.keys.run = hold !== false;
        var steps = Math.max(1, Math.round(sec * 60)), dt = 1 / 60;
        for (var i = 0; i < steps && G.state === 'playing'; i++){
          stepPlaying(dt);
          if (G.state === 'playing') stepRivals(dt);
          updateParts(dt); updateTexts(dt); updateBubbles(dt);
        }
        G.keys.run = false;
        return { x: Math.round(G.car.x), len: G.stageLen, rank: computeRank(), time: Math.round(G.raceTime * 10) / 10, state: G.state };
      }
    };

    requestAnimationFrame(loop);
  }

  init();
})();
</script>
</body>
</html>
