<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8ee3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>코인 자동차 🚗</title>
<style>
  :root{
    --font: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:#8ee3ff;
    font-family: var(--font);
    user-select:none; -webkit-user-select:none;
    overscroll-behavior:none; touch-action:none;
    -webkit-text-size-adjust:100%;
  }
  #app{ position:fixed; inset:0; overflow:hidden; }
  canvas#game{ display:block; width:100%; height:100%; touch-action:none; }

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; left:0; right:0; top:0;
    display:flex; align-items:flex-start; gap:8px;
    padding: calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));
    pointer-events:none; z-index:5;
  }
  .coinPill{
    display:flex; align-items:center; gap:7px;
    background:#fff; border-radius:999px; padding:4px 14px 4px 5px;
    box-shadow: 0 4px 0 #e3cfa4, 0 7px 14px rgba(30,50,70,.16);
    flex:0 0 auto;
  }
  .coinIcon{
    width:34px; height:34px; border-radius:50%;
    background: radial-gradient(circle at 34% 28%, #fff6b8, #ffd93d 52%, #e2a100);
    display:grid; place-items:center;
    color:#a86a00; font-size:19px; font-weight:900; line-height:1;
    box-shadow: inset 0 -2px 0 rgba(150,90,0,.28), inset 0 2px 0 rgba(255,255,255,.6);
  }
  #coinNum{
    font-weight:900; font-size:21px; color:#8a5a00; min-width:32px; text-align:center;
    transition: transform .12s ease-out;
  }
  #coinNum.pop{ transform: scale(1.4) rotate(-4deg); }

  /* ---------- 거리 / 연료 ---------- */
  .meterRow{ display:flex; align-items:center; gap:8px; margin-top:5px; }
  #distText{
    font-size:12.5px; font-weight:900; color:#fff; letter-spacing:-.2px;
    text-shadow: 0 2px 4px rgba(20,50,70,.85), 0 0 7px rgba(20,50,70,.6);
    white-space:nowrap;
  }
  #distText b{ color:#fff6c1; }
  .fuelWrap{ margin-left:auto; display:flex; align-items:center; gap:4px; flex:0 0 auto; }
  .fuelIco{ font-size:12px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .fuelBar{
    width:64px; height:11px; border-radius:99px; background:rgba(255,255,255,.62);
    box-shadow: inset 0 2px 4px rgba(30,60,80,.18), 0 1px 0 rgba(255,255,255,.4); overflow:hidden;
  }
  .fuelFill{
    height:100%; width:33%; border-radius:99px;
    background: linear-gradient(90deg,#9bf6b6,#2dbd6e);
    transition: width .15s linear, background .3s;
  }
  .fuelFill.low{ background: linear-gradient(90deg,#ffe066,#ff9f1c); }
  .fuelFill.empty{ background:#ff5d5d; }
  #fuelNum{
    font-size:11.5px; font-weight:900; color:#fff; min-width:24px; text-align:right;
    text-shadow: 0 2px 4px rgba(20,50,70,.85);
  }
  #fuelWrap.low #fuelNum{ color:#fff0a8; }
  #fuelWrap.empty #fuelNum{ color:#ffb3b3; animation: fuelBlink .7s ease-in-out infinite alternate; }
  @keyframes fuelBlink{ from{opacity:.45} to{opacity:1} }

  .x2pill{
    background:linear-gradient(#fff6c1,#ffd93d); color:#8a4b00;
    font-size:11px; font-weight:900; border-radius:999px; padding:2px 8px;
    box-shadow:0 2px 0 #e0ad00; pointer-events:none; display:none;
    letter-spacing:-.3px; white-space:nowrap; flex:0 0 auto;
  }
  .x2pill.on{ display:inline-block; animation: rankPop .4s ease-out; }

  .stageBox{ flex:1 1 auto; min-width:40px; padding-top:1px; }
  .stageLabel{
    display:flex; align-items:center; justify-content:space-between;
    font-size:13px; font-weight:900; color:#fff;
    text-shadow: 0 2px 4px rgba(20,50,70,.8), 0 0 7px rgba(20,50,70,.6), 0 1px 2px rgba(0,0,0,.5);
    margin-bottom:4px; letter-spacing:-.2px;
  }
  #stageName{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rankPill{
    display:inline-flex; align-items:center; gap:4px; flex:0 0 auto;
    background:rgba(255,255,255,.95); color:#33475a;
    border-radius:999px; padding:2px 9px; font-size:12.5px; font-weight:900;
    box-shadow:0 2px 0 rgba(110,135,155,.35);
    white-space:nowrap; text-shadow:none; letter-spacing:-.4px; margin-left:6px;
  }
  .rankPill.pop{ animation: rankPop .5s ease-out; }
  @keyframes rankPop{ 0%{transform:scale(1)} 35%{transform:scale(1.22) rotate(-3deg)} 100%{transform:scale(1)} }
  .rankPill.lead{ background:linear-gradient(#fff6c1,#ffd93d); color:#7a4d00; }
  .bar{
    height:13px; border-radius:99px; background:rgba(255,255,255,.62);
    box-shadow: inset 0 2px 4px rgba(30,60,80,.18), 0 1px 0 rgba(255,255,255,.5);
    overflow:hidden; position:relative;
  }
  .barFill{
    height:100%; width:0%; border-radius:99px;
    background: linear-gradient(90deg,#ffe066,#ffb703);
    transition: width .18s linear;
  }
  .barDots{ position:absolute; inset:0; pointer-events:none; }
  .barDots i{
    position:absolute; top:50%; width:9px; height:9px; margin:-4.5px 0 0 -4.5px;
    border-radius:50%; background:#fff; box-shadow:0 0 0 2px rgba(45,80,105,.55);
    transition: left .16s linear;
  }
  .topBtns{ display:flex; gap:6px; pointer-events:auto; flex:0 0 auto; }
  .iconBtn{
    width:46px; height:46px; border-radius:16px; border:none;
    background:#fff; font-size:22px; line-height:1;
    display:grid; place-items:center; cursor:pointer;
    box-shadow: 0 4px 0 #cfd8dc, 0 6px 12px rgba(30,50,70,.14);
    transition: transform .06s;
  }
  .iconBtn:active{ transform: translateY(3px); box-shadow: 0 1px 0 #cfd8dc; }

  /* ---------- controls ---------- */
  #controls{
    position:absolute; left:0; right:0; bottom:0; z-index:6;
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:10px; pointer-events:none;
    padding: 0 calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  }
  /* 왼쪽: 아이템(바나나·부스터) 위 → 점프! 아래 / 오른쪽: 앞으로! */
  .leftPads{ display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  .leftPads>.pad{ pointer-events:auto; }
  .itemPads{ display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  .itemPads>.pad{ pointer-events:auto; }
  .rightPads{ display:flex; flex-direction:column; align-items:flex-end; justify-content:flex-end; gap:8px; pointer-events:none; }
  .rightPads>.pad{ pointer-events:auto; }
  .pad{
    pointer-events:auto; border:none; cursor:pointer; color:#fff;
    display:grid; place-items:center; line-height:1.05; font-family:var(--font);
    transition: transform .06s, box-shadow .06s, filter .06s;
    position:relative;
  }
  .pad small{ display:block; font-size:.62em; font-weight:800; opacity:.95; margin-top:2px; letter-spacing:-.3px; }
  #boostBtn{
    width: clamp(70px, 18vw, 98px); height: clamp(70px, 18vw, 98px);
    border-radius:50%; color:#fff;
    background: radial-gradient(circle at 36% 26%, #ffc19d, #ff5d2e 58%, #d8320e);
    font-weight:900; font-size: clamp(12px, 3vw, 15px);
    box-shadow: 0 7px 0 #a32407, 0 11px 18px rgba(60,10,0,.28), inset 0 3px 0 rgba(255,255,255,.4);
    text-shadow: 0 2px 0 rgba(0,0,0,.2);
  }
  #boostBtn .boostIco{ font-size:1.6em; line-height:1; display:block; filter: drop-shadow(0 2px 2px rgba(90,20,0,.35)); }
  #boostBtn small{ margin-top:1px; font-size:.66em; }
  #boostBtn .cntNum{ color:#fff2a8; }
  #boostBtn.active{ transform:translateY(5px); box-shadow: 0 2px 0 #a32407, 0 4px 8px rgba(60,10,0,.25), inset 0 3px 0 rgba(255,255,255,.4); }
  #boostBtn.empty{
    background: radial-gradient(circle at 36% 26%, #d7dee4, #9aa6b1 58%, #77838f);
    box-shadow: 0 7px 0 #5f6a75, 0 11px 18px rgba(20,30,40,.22), inset 0 3px 0 rgba(255,255,255,.4);
  }
  #boostBtn.empty .boostIco{ filter:grayscale(.75); opacity:.8; }
  #boostBtn.hot{ animation: boostGlow .5s ease-in-out infinite alternate; }
  @keyframes boostGlow{ from{ filter: brightness(1) } to{ filter: brightness(1.22) saturate(1.2) } }

  #bananaBtn{
    width: clamp(62px, 16vw, 86px); height: clamp(62px, 16vw, 86px);
    border-radius:50%; color:#6b5200;
    background: radial-gradient(circle at 36% 26%, #fff6b0, #ffe066 56%, #e6b800);
    font-weight:900; font-size: clamp(11px, 2.8vw, 14px);
    box-shadow: 0 6px 0 #b38f00, 0 9px 16px rgba(60,45,0,.24), inset 0 3px 0 rgba(255,255,255,.5);
    text-shadow: 0 1px 0 rgba(255,255,255,.45);
  }
  #bananaBtn .bnIco{ font-size:1.7em; line-height:1; display:block; filter: drop-shadow(0 2px 2px rgba(120,90,0,.3)); }
  #bananaBtn small{ font-size:.68em; margin-top:0; }
  #bananaBtn .cntNum{ color:#7a4d00; }
  #bananaBtn.active{ transform:translateY(4px); box-shadow: 0 2px 0 #b38f00, 0 3px 7px rgba(60,45,0,.2), inset 0 3px 0 rgba(255,255,255,.5); }
  #bananaBtn.empty{ filter: grayscale(.55); opacity:.78; }

  #shieldBtn{
    width: clamp(58px, 15vw, 82px); height: clamp(58px, 15vw, 82px);
    border-radius:50%; color:#0e3f6b;
    background: radial-gradient(circle at 36% 26%, #dff2ff, #7cc2ff 56%, #2f86d6);
    font-weight:900; font-size: clamp(10px, 2.5vw, 13px);
    box-shadow: 0 6px 0 #1f5f9c, 0 9px 16px rgba(0,35,70,.24), inset 0 3px 0 rgba(255,255,255,.5);
    text-shadow: 0 1px 0 rgba(255,255,255,.45);
  }
  #shieldBtn small{ margin-top:0; font-size:.68em; }
  #shieldBtn .cntNum{ color:#0a3155; }
  #shieldBtn.active{ transform:translateY(4px); box-shadow: 0 2px 0 #1f5f9c, 0 3px 7px rgba(0,35,70,.2), inset 0 3px 0 rgba(255,255,255,.5); }
  #shieldBtn.empty{ filter: grayscale(.55); opacity:.78; }
  #shieldBtn.on{ animation: shieldGlow .8s ease-in-out infinite alternate; }
  @keyframes shieldGlow{ from{ filter:brightness(1) } to{ filter:brightness(1.22) drop-shadow(0 0 8px #9fd4ff) } }

  #jumpBtn{
    width: clamp(82px, 22vw, 112px); height: clamp(82px, 22vw, 112px);
    border-radius:50%;
    background: radial-gradient(circle at 38% 26%, #ffd166, #ffb703 62%, #ef8c00);
    color:#5b3600; font-weight:900; font-size: clamp(16px, 4.2vw, 21px);
    box-shadow: 0 8px 0 #c27400, 0 12px 20px rgba(40,30,0,.25), inset 0 3px 0 rgba(255,255,255,.45);
    text-shadow: 0 1px 0 rgba(255,255,255,.4);
  }
  #runBtn{
    width: clamp(128px, 34vw, 220px); height: clamp(84px, 21vw, 110px);
    border-radius: 999px;
    background: radial-gradient(circle at 38% 22%, #86f0a7, #2dbd6e 60%, #1a9a54);
    font-weight:900; font-size: clamp(19px, 4.8vw, 26px);
    box-shadow: 0 8px 0 #14743f, 0 12px 22px rgba(0,40,20,.28), inset 0 3px 0 rgba(255,255,255,.35);
    text-shadow: 0 2px 0 rgba(0,0,0,.16);
  }
  .pad.active{ transform: translateY(6px); filter: brightness(1.07); }
  #jumpBtn.active{ box-shadow: 0 2px 0 #c27400, 0 4px 10px rgba(40,30,0,.25), inset 0 3px 0 rgba(255,255,255,.45); }
  #runBtn.active{ box-shadow: 0 2px 0 #14743f, 0 4px 10px rgba(0,40,20,.28), inset 0 3px 0 rgba(255,255,255,.35); }

  /* ---------- modal ---------- */
  #modal{
    position:absolute; inset:0; z-index:20; display:none;
    background: rgba(18,40,60,.42);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    padding: 10px;
    place-items:center;
  }
  #modal.show{ display:grid; }
  #modal.quiz{ place-items:center; padding: calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom)); }
  #modal.quiz .sheet{ width:min(440px, 100%); }
  @media (max-height: 520px){
    #modal.quiz{ place-items:center; padding: 8px; }
    #modal.quiz .sheet{ width:min(380px, 74%); max-height:86vh; padding:10px 12px 11px; }
    #modal.quiz .qTitle{ font-size:14px; }
    #modal.quiz .qEq{ font-size:clamp(24px, 7.4vh, 38px); margin:6px 0 2px; }
    #modal.quiz .qHint{ font-size:11px; margin-bottom:8px; }
    #modal.quiz .qBtn{ padding:12px 6px; font-size:clamp(22px, 6vh, 32px); }
    #modal.quiz .qMsg{ font-size:12px; }
  }
  .sheet{
    width: min(560px, 100%);
    max-height: min(92vh, 820px);
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    touch-action: pan-y; overscroll-behavior: contain;
    background: linear-gradient(#fffdf6, #fff5df);
    border-radius: 26px;
    padding: 14px 14px 16px;
    box-shadow: 0 10px 0 rgba(120,90,40,.18), 0 22px 44px rgba(10,30,50,.35);
    animation: popIn .18s ease-out;
  }
  @keyframes popIn{ from{ transform: scale(.94); opacity:.4 } to{ transform: scale(1); opacity:1 } }

  .sheetHead{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .sheetHead h2{ margin:0; font-size:21px; color:#2b3f4d; letter-spacing:-.5px; }
  .wallet{
    margin-left:auto; display:flex; align-items:center; gap:6px;
    background:#fff3cf; border-radius:999px; padding:4px 12px 4px 5px;
    box-shadow: inset 0 0 0 2px #ffe2a1;
  }
  .wallet .coinIcon{ width:26px; height:26px; font-size:15px; }
  .wallet b{ font-size:18px; color:#8a5a00; }
  .xbtn{
    width:40px; height:40px; border-radius:14px; border:none; background:#f0e7d6;
    font-size:19px; color:#6b5a45; cursor:pointer;
    box-shadow: 0 3px 0 #ddd0ba;
  }

  .tabs{ display:flex; gap:5px; margin-bottom:12px; }
  .tab{
    flex:1; border:none; border-radius:13px; padding:9px 2px;
    background:#f1e8d8; color:#7b6a55; font-weight:900; font-size:13px;
    cursor:pointer; font-family:var(--font); box-shadow:0 3px 0 #e0d3bf;
    letter-spacing:-.5px; white-space:nowrap;
  }
  .tabs.wide .tab{ font-size:12px; padding:9px 1px; letter-spacing:-.7px; }
  @media (max-width: 430px){
    .tabs.wide{ flex-wrap:wrap; }
    .tabs.wide .tab{ flex:1 1 28%; }
  }
  .tab.on{ background:#ffb703; color:#5b3600; box-shadow:0 3px 0 #c27400; }

  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(128px,1fr)); gap:9px; }
  .card{
    background:#fff; border-radius:18px; padding:8px 8px 9px;
    border:3px solid #ffe6a8;
    box-shadow: 0 4px 0 #f1e0bb;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    text-align:center;
  }
  .card.on{ border-color:#2dbd6e; background:#f3fff8; box-shadow:0 4px 0 #bfe8cf; }
  .card canvas.prev{ width:100%; height:82px; display:block; }
  .cardName{ font-weight:900; font-size:14px; color:#33475a; letter-spacing:-.4px; }
  .cardDesc{ font-size:10.5px; color:#8b96a2; line-height:1.25; min-height:26px; }
  .buy{
    width:100%; margin-top:2px; border:none; border-radius:12px; padding:9px 4px;
    font-weight:900; font-size:13.5px; font-family:var(--font);
    background:#ffb703; color:#5b3600; cursor:pointer;
    box-shadow:0 3px 0 #c27400;
  }
  .buy:active{ transform:translateY(2px); box-shadow:0 1px 0 #c27400; }
  .buy.owned{ background:#2dbd6e; color:#fff; box-shadow:0 3px 0 #14743f; }
  .buy:disabled{ background:#e8e8e8; color:#a2adb6; box-shadow:0 3px 0 #d5d5d5; cursor:default; transform:none; }

  .swatch{
    width:60px; height:60px; border-radius:50%;
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), inset 0 4px 0 rgba(255,255,255,.45), 0 3px 6px rgba(0,0,0,.12);
    margin:4px 0 2px;
  }

  .upRow{
    display:flex; align-items:center; gap:10px;
    background:#fff; border-radius:18px; padding:10px;
    border:3px solid #ffe6a8; box-shadow:0 4px 0 #f1e0bb; margin-bottom:9px;
  }
  .upIcon{ font-size:26px; width:38px; text-align:center; }
  .upInfo{ flex:1; min-width:0; text-align:left; }
  .upName{ font-weight:900; color:#33475a; font-size:15px; }
  .upDesc{ font-size:11.5px; color:#8b96a2; margin-top:1px; line-height:1.3; }
  .pips{ display:flex; gap:4px; margin-top:5px; }
  .pip{ width:22px; height:8px; border-radius:99px; background:#e8e2d5; }
  .pip.on{ background:#2dbd6e; }
  .upBuy{ width:96px; flex:0 0 auto; margin:0; }

  .bigBtn{
    width:100%; border:none; border-radius:20px; padding:16px;
    font-size:22px; font-weight:900; color:#fff; font-family:var(--font);
    background: radial-gradient(circle at 40% 20%, #86f0a7, #2dbd6e 65%, #1a9a54);
    box-shadow: 0 6px 0 #14743f, 0 10px 18px rgba(0,40,20,.22);
    cursor:pointer; margin-top:6px;
  }
  .bigBtn:active{ transform:translateY(4px); box-shadow:0 2px 0 #14743f; }
  .bigBtn:disabled{ filter:grayscale(.45); opacity:.9; transform:none; }
  .softBtn{
    width:100%; border:none; border-radius:18px; padding:13px;
    font-size:16px; font-weight:900; color:#7b5a1e; font-family:var(--font);
    background:#fff0c9; box-shadow: 0 4px 0 #ecd9a6; cursor:pointer; margin-top:9px;
  }
  .softBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #ecd9a6; }

  .logo{ text-align:center; margin:6px 0 2px; }
  .logoMain{
    display:inline-flex; align-items:center; gap:8px;
    font-size: clamp(26px, 7.6vw, 36px); font-weight:900; color:#2b3f4d;
    letter-spacing:-1.4px;
  }
  .logoCoin{
    width:38px; height:38px; border-radius:50%;
    background: radial-gradient(circle at 34% 28%, #fff6b8, #ffd93d 52%, #e2a100);
    display:grid; place-items:center; color:#a86a00; font-size:21px;
    box-shadow: inset 0 -3px 0 rgba(150,90,0,.25), 0 2px 5px rgba(150,100,0,.3);
  }
  .sub{ text-align:center; color:#7d8b96; font-size:14px; font-weight:700; margin:6px 0 14px; letter-spacing:-.3px; }
  .howto{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .hi{
    display:flex; align-items:center; gap:10px; background:#fff;
    border-radius:16px; padding:9px 12px; box-shadow:0 3px 0 #f1e6cf;
  }
  .hi span.ico{ font-size:22px; }
  .hi b{ font-size:14.5px; color:#33475a; display:block; }
  .hi small{ font-size:11.5px; color:#98a4ae; }

  .rewardRow{ display:flex; gap:9px; margin-top:12px; }
  .rewardBtn{
    flex:1; border:none; border-radius:18px; padding:14px 8px; cursor:pointer;
    font-family:var(--font); display:flex; flex-direction:column; gap:4px; align-items:center;
    color:#3a4a56;
  }
  .rewardBtn b{ font-size:17px; color:#33475a; letter-spacing:-.5px; }
  .rewardBtn small{ font-size:11px; font-weight:800; color:#7d8b96; line-height:1.3; }
  .rewardBtn.coin{ background:linear-gradient(#fff6c1,#ffe066); box-shadow:0 5px 0 #e0ad00; }
  .rewardBtn.fuel{ background:linear-gradient(#dcf8ff,#9be4ff); box-shadow:0 5px 0 #58b6d8; }
  .rewardBtn:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.18); }
  .fuelBig{ font-size:52px; text-align:center; line-height:1; margin-top:4px; animation: bounce .8s ease-in-out infinite alternate; }

  .clearBig{ font-size:50px; text-align:center; line-height:1; margin-top:4px; animation: bounce .8s ease-in-out infinite alternate; }
  @keyframes bounce{ from{ transform: translateY(0) } to{ transform: translateY(-8px) } }
  .clearTitle{ text-align:center; font-size:24px; font-weight:900; color:#2b3f4d; margin:8px 0 2px; letter-spacing:-.8px; }
  .clearSub{ text-align:center; color:#7d8b96; font-size:13.5px; font-weight:700; margin-bottom:12px; }
  .statRow{ display:flex; gap:8px; margin-bottom:12px; }
  .stat{
    flex:1; background:#fff; border-radius:16px; padding:9px 6px; text-align:center;
    box-shadow:0 3px 0 #f1e6cf;
  }
  .stat b{ display:block; font-size:19px; color:#e08b00; letter-spacing:-.5px; }
  .stat small{ font-size:10.5px; color:#98a4ae; font-weight:800; }
  .rowBtns{ display:flex; flex-direction:column; gap:8px; }

  .spWrap{ margin: 0 0 12px; }

  /* ---------- 🗺️ 전체 월드맵 (6개 마을 길) ---------- */
  .wMap{

  }

  svg.wRoad{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  svg.wRoad path{ fill:none; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
  svg.wRoad .wBase{ stroke:#ffffff; stroke-width:14; opacity:.9; }
  svg.wRoad .wOn{ stroke:#5fd39a; stroke-width:8; }
  svg.wRoad .wOff{ stroke:#c6d4dd; stroke-width:8; stroke-dasharray:1 10; }
  .wNode{
    position:absolute; transform:translate(-50%,-50%);

  .wNode .wIcon{ font-size:var(--wnode); line-height:1.1; }
  .wNode .wName{ font-weight:900; font-size:11.5px; letter-spacing:-.5px; white-space:nowrap; }
  .wNode .wBar{ display:flex; gap:1.5px; width:90%; height:auto; background:transparent; overflow:visible; margin-top:3px; justify-content:center; }
  .wNode .wBar i{ display:block; flex:1 1 0; max-width:5px; height:5px; border-radius:50%; background:#e3eaef; }
  .wNode .wBar i.on{ background:#2dbd6e; }
  .wNode .wBar i.cur{ background:#ffb703; box-shadow:0 0 0 1.5px #ffe6a8; }
  .wNode.locked .wBar i{ background:#e9edf0; }
  .wMap.compact .wNode .wBar i{ height:4px; max-width:4px; }
  .wNode .wProg{ font-weight:900; font-size:10px; color:#8b98a3; letter-spacing:-.2px; }
  .wNode.open{ border-color:#ffe6a8; box-shadow:0 5px 0 #f1e0bb, 0 8px 14px rgba(20,50,70,.12); }
  .wNode.done{ border-color:#8fe0b4; background:#f4fff9; }
  .wNode.cur{ border-color:#ffb703; background:#fffaf0;
    box-shadow:0 5px 0 #efc468, 0 10px 18px rgba(190,120,0,.24); }
  .wNode.cur .wBadge{ animation:curBob 1.4s ease-in-out infinite; }
  @keyframes curBob{ 0%,100%{ transform:translateY(0) scale(1) } 50%{ transform:translateY(-4px) scale(1.08) } }
  .wNode.locked{ background:#f3f5f7; border-color:#e4eaee; color:#a9b4bd; box-shadow:0 5px 0 #e7ecef; }
  .wNode.locked .wIcon{ filter:grayscale(1); opacity:.5; }
  .wNode.locked .wProg{ color:#b3bcc4; }
  .wNode:active{ transform:translate(-50%,calc(-50% + 2px)); }
  .wMap.compact .wNode{ border-radius:15px; padding:4px 2px 3px; }
  .wMap.compact .wName{ font-size:9px; }
  .wMap.compact .wBar{ height:4px; }
  .wMap.compact .wProg{ font-size:8.5px; }  .wMap.compact .wBadge{ font-size:13px; top:-9px; right:-6px; }

    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();

  /* ---------- 🔒 순차 해금 ----------
     처음엔 초원 마을 1탄만 열려 있고,
     한 탄을 성공해야 다음 탄이, 10탄을 성공해야 다음 마을 1탄이 열립니다. */
  function progressOf(v){ return clamp(save.villageProgress[v] | 0, 0, 10); }
  // 이 마을에서 이미 지나온 탄 수 (클리어 기록 + 예전 저장의 진행도)
  function passedCount(v){
    var leg = progressOf(v), c = 0;
    for (var n = 1; n <= 10; n++){
      if (stageCleared(v, n) || leg >= n) c = n; else break;
    }
    return c;
  }
  function villageOpen(v){
    v = clamp(v | 0, 1, 6);
    if (v <= 1) return true;
    return passedCount(v - 1) >= 10;
  }
  function villageDone(v){ return villageOpen(v) ? passedCount(v) : 0; }
  function stageOpen(v, n){
    if (!villageOpen(v)) return false;
    if (n <= 1) return true;
    return passedCount(v) >= n - 1;
  }
  // 지금 도전할 탄 (다음에 깨야 할 탄)
  function nextChallenge(v){
    var d = villageDone(v);
    return clamp(d + 1, 1, 10);
  }
  function clearedCount(){
    var p = 0;
    for (var v = 1; v <= 6; v++) p += villageDone(v);
    return p;
  }
  // 저장된 진행도를 순차 해금 규칙에 맞게 보정합니다 (예전 저장 호환)
  function normalizeUnlocks(){
    for (var v = 1; v <= 6; v++) save.villageProgress[v] = villageDone(v);
    var last = clamp(save.lastVillage | 0, 1, 6), best = 1;
    for (var v2 = 2; v2 <= 6; v2++) if (villageOpen(v2)) best = v2;
    if (!villageOpen(last)) last = best;
    save.lastVillage = last;
    var n = clamp(save.lastStage | 0, 1, 10);
    if (!stageOpen(last, n)) n = nextChallenge(last);
    save.lastStage = n;
  }

  /* ---------- 지형 ---------- */
  function hillOffset(wx){
    var p = wx + (G.hillPhase || 0);
    return -(Math.sin(p * 0.00200) * 0.62
           + Math.sin(p * 0.00091 + 1.9) * 0.95
           + Math.sin(p * 0.00470 + 0.7) * 0.18) * 62;
  }
  function groundRef(wx){
    return G.baseY + hillOffset(wx) * G.amp * (G.hillMul || 1);
  }
  function waterSegAt(wx){
    for (var i = 0; i < G.waters.length; i++){
      var w = G.waters[i];
      if (wx >= w.x0 && wx <= w.x1) return w;
    }
    return null;
  }
  function waterSurfaceY(w, wx){
    var t = clamp((wx - w.x0) / (w.x1 - w.x0), 0, 1);
    return w.top + Math.sin(wx * 0.012 + G.t * 1.6) * 1.5 * t * (1 - t) * 4;
  }
  function pondAt(wx){
    for (var i = 0; i < G.ponds.length; i++){
      var p = G.ponds[i];
      if (wx >= p.x0 + 14 && wx <= p.x1 - 14) return p;
    }
    return null;
  }
  function mudAt(wx){
    for (var i = 0; i < G.muds.length; i++){
      var m = G.muds[i];
      if (wx >= m.x0 + 8 && wx <= m.x1 - 8) return m;
    }
    return null;
  }
  function surfaceY(wx){
    var w = waterSegAt(wx);
    if (w) return w.bridge ? (w.top - 16) : (w.top + 5);
    return groundRef(wx);
  }
  function inWater(wx){
    var w = waterSegAt(wx);
    return !!(w && !w.bridge);
  }

  function buildStage(vid, no){
    var v = villageBy(vid);
    var n = clamp(no | 0, 1, 10);
    var rnd = mulberry32(1337 + v.id * 911 + n * 77);
    var len = Math.round(v.len + (n - 1) * v.step);
    var pal = v.pals[Math.min(v.pals.length - 1, Math.floor((n - 1) / 5))];

    G.village = v.id;
    G.stageNo = n;
    G.stageLen = len;
    G.stageMeters = Math.round(len / PX_PER_M / 10) * 10;
    G.fuelPerM = fuelRateFor(v.id, n);
    G.deco = v.deco;
    G.pal = pal;
    G.grav = v.grav;
    G.hillMul = v.hill * (0.88 + ((n - 1) % 5) * 0.075);
    G.hillPhase = (v.id * 137 + n * 29) % 900;

    function freeSpot(x, w, gap){
      if (x < 760 || x + w > len - 620) return false;
      for (var i = 0; i < G.waters.length; i++){
        if (x < G.waters[i].x1 + gap && x + w > G.waters[i].x0 - gap) return false;
      }
      for (var j = 0; j < G.ponds.length; j++){
        if (x < G.ponds[j].x1 + 120 && x + w > G.ponds[j].x0 - 120) return false;
      }
      for (var k = 0; k < G.muds.length; k++){
        if (x < G.muds[k].x1 + 120 && x + w > G.muds[k].x0 - 120) return false;
      }
      return true;
    }

    // 큰 강 / 호수
    var waters = [];
    var wantN = Math.round(v.water + Math.floor(n / 4));
    var x = 2100 + rnd() * 500;
    for (var wi = 0; wi < wantN && x < len - 1200; wi++){
      var wid = 260 + rnd() * 170;
      if (v.deco === 'sea' && wi === 0) wid = 640 + rnd() * 260;
      waters.push({ x0: x, x1: x + wid, top: 0, bridge: (v.deco === 'sea' && wi === 0) });
      x += wid + 1500 + rnd() * 1100;
    }
    G.waters = waters;

    // 물 웅덩이 (점프로 넘어요)
    G.ponds = [];
    var pondN = v.pond + Math.floor(n / 3);
    var px = 1150 + rnd() * 350;
    var guard = 0;
    while (G.ponds.length < pondN && guard++ < 60){
      var pw = 120 + rnd() * 60;
      if (freeSpot(px, pw, 220)) G.ponds.push({ x0: px, x1: px + pw, ph: rnd() * 6.28 });
      px += 720 + rnd() * 620;
      if (px > len - 800) break;
    }
    // 진흙 / 빙판
    G.muds = [];
    var mudN = v.mud + Math.floor(n / 4);
    var mx = 1400 + rnd() * 400;
    guard = 0;
    while (G.muds.length < mudN && guard++ < 60){
      var mw = 150 + rnd() * 100;
      if (freeSpot(mx, mw, 200)) G.muds.push({ x0: mx, x1: mx + mw, ph: rnd() * 6.28 });
      mx += 820 + rnd() * 700;
      if (mx > len - 800) break;
    }

    function inWaterZone(cx){
      for (var i = 0; i < waters.length; i++){
        if (cx >= waters[i].x0 - 30 && cx <= waters[i].x1 + 30) return true;
      }
      return false;
    }

    // 코인: 낮은 줄 / 점프 아치 / 높이 뜬 코인 (점프해서 먹어요)
    var coins = [];
    function addCoin(cx, dy, kind){
      coins.push({ x: cx, dy: dy, got: false, ph: rnd() * 6.28, live: true, kind: kind || 'low' });
    }
    var jumpH = 640 * 640 / (2 * v.grav);       // 기본 점프 높이
    var highDy = clamp(jumpH * 0.92, 112, 150); // 꼭 점프해야 닿는 높이
    var cx = 280;
    guard = 0;
    var groupNo = 0;
    while (cx < len - 400 && guard++ < 420){
      if (inWaterZone(cx)){ cx += 140; continue; }
      var gap = 60;
      var style = groupNo++ % 3;   // 낮은 줄 → 아치 → 공중 순서로 골고루
      if (style === 0){
        var cnt = 4;
        for (var i = 0; i < cnt; i++){
          var ccx = cx + i * gap;
          if (!inWaterZone(ccx)) addCoin(ccx, 34, 'low');
        }
        cx += cnt * gap + 190 + rnd() * 150;
      } else if (style === 1){
        var cnt2 = 5;
        var peak = 84 + rnd() * 26;
        for (var j = 0; j < cnt2; j++){
          var jc = cx + j * gap;
          if (!inWaterZone(jc)) addCoin(jc, 36 + Math.sin(j / (cnt2 - 1) * Math.PI) * peak, 'arc');
        }
        cx += cnt2 * gap + 170 + rnd() * 150;
      } else {
        for (var k = 0; k < 3; k++){
          var kc = cx + k * gap;
          if (!inWaterZone(kc)) addCoin(kc, highDy + (k === 1 ? 12 : 0) + rnd() * 8, 'high');
        }
        cx += 3 * gap + 200 + rnd() * 170;
      }
    }
    waters.forEach(function(w){
      var span = w.x1 - w.x0;
      for (var i = 0; i < 5; i++){
        var t = (i + 0.5) / 5;
        addCoin(w.x0 + t * span, 56 + Math.sin(t * Math.PI) * 58);
      }
    });
    coins.sort(function(a, b){ return a.x - b.x; });
    G.coins = coins;

    // 바나나 껍질 줍기 (트랙 위)
    G.pickups = [];
    var picks = 2 + (n >= 5 ? 1 : 0);
    var bx = 1600 + rnd() * 600;
    guard = 0;
    while (G.pickups.length < picks && guard++ < 40){
      if (freeSpot(bx, 40, 160)) G.pickups.push({ x: bx, got: false, ph: rnd() * 6.28 });
      bx += 1400 + rnd() * 1000;
      if (bx > len - 700) break;
    }

    // 코스에 고르게 놓기 (자리가 막혀 있으면 옆으로 비켜서 놓아요)
    function placeSlots(count, from, to, w, gap, fn){
      var span = (to - from) / count;
      for (var s = 0; s < count; s++){
        var target = from + span * (s + 0.5);
        for (var off = 0; off <= 640; off += 40){
          var list = off ? [target - off, target + off] : [target];
          var done = false;
          for (var q = 0; q < list.length && !done; q++){
            var xx = list[q];
            if (xx < from * 0.65 || xx > to + 220) continue;
            if (!freeSpot(xx, w, gap)) continue;
            done = fn(xx) !== false;
          }
          if (done) break;
        }
      }
    }

    // ⛽ 연료통 (코스 중간중간, 가끔은 점프해서)
    G.cans = [];
    var canN = clamp(3 + Math.floor((n - 1) / 3) + Math.floor((v.id - 1) / 2), 3, 9);
    placeSlots(canN, 900, len - 950, 60, 80, function(xx){
      for (var i = 0; i < G.cans.length; i++) if (Math.abs(G.cans[i].x - xx) < 200) return false;
      var hiCan = G.cans.length % 5 === 4;
      G.cans.push({ x: xx, dy: hiCan ? 88 + rnd() * 14 : 42, got: false, ph: rnd() * 6.28, high: hiCan });
      return true;
    });

    // 🚧 라바콘 (점프로 넘어요) — 뒤 스테이지·뒤 마을일수록 촘촘해요
    G.cones = [];
    var coneN = clamp(2 + Math.round(n * 0.7) + (v.id - 1), 2, 16);
    placeSlots(coneN, 1050, len - 900, 40, 110, function(xx){
      for (var i = 0; i < G.cones.length; i++) if (Math.abs(G.cones[i].x - xx) < 170) return false;
      for (var j = 0; j < G.cans.length; j++) if (Math.abs(G.cans[j].x - xx) < 130) return false;
      G.cones.push({ x: xx, hit: false, rot: 0, ph: rnd() * 6.28 });
      return true;
    });

    // 🪨 마을마다 다른 함정 — 걸리면 확 느려져요
    var TRAP_KINDS = {
      grass:   ['puddle', 'rock', 'stump'],
      sea:     ['puddle', 'rock', 'shell'],
      desert:  ['cactus', 'rock', 'puddle'],
      snow:    ['ice', 'rock', 'snowpile'],
      volcano: ['lava', 'rock', 'stump'],
      space:   ['meteor', 'rock', 'puddle']
    };
    var trapKinds = TRAP_KINDS[v.deco] || TRAP_KINDS.grass;
    G.traps = [];
    var trapN = clamp(1 + Math.round(n * 0.55) + Math.floor((v.id - 1) * 0.8), 1, 12);
    placeSlots(trapN, 1300, len - 950, 90, 110, function(xx){
      for (var i = 0; i < G.traps.length; i++) if (Math.abs(G.traps[i].x - xx) < 190) return false;
      for (var j = 0; j < G.cones.length; j++) if (Math.abs(G.cones[j].x - xx) < 150) return false;
      for (var k2 = 0; k2 < G.cans.length; k2++) if (Math.abs(G.cans[k2].x - xx) < 120) return false;
      G.traps.push({
        x: xx, kind: trapKinds[Math.floor(rnd() * trapKinds.length)],
        hit: false, rot: 0, ph: rnd() * 6.28, w: 72 + rnd() * 46
      });
      return true;
    });

    G.peels = [];
    G.waters.forEach(function(w){ w.top = (groundRef(w.x0) + groundRef(w.x1)) / 2 + 1; });
  }

  function refreshWaterTops(){
    G.waters.forEach(function(w){
      w.top = (groundRef(w.x0) + groundRef(w.x1)) / 2 + 1;
    });
  }

  /* =====================================================================
     5. 캔버스 크기
     ===================================================================== */
  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    G.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    G.W = w; G.H = h;
    canvas.width = Math.round(w * G.dpr);
    canvas.height = Math.round(h * G.dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    // 화면이 낮으면(가로모드) 길을 조금 위로 올려 버튼과 겹치지 않게
    var k = h >= 700 ? 0.665 : (h >= 520 ? 0.60 : 0.62);
    G.baseY = h * k;
    G.amp = clamp(h / 760, 0.5, 1.2);
    refreshWaterTops();
    // 룰렛을 보고 있는 중에 화면을 돌리면 원판도 다시 맞춰 그려요
    if (G.state === 'shop' && G.panel === 'roul' && roul && roul.canvas){
      if (sizeRoulette()) drawRoulette();
    }
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });
  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', function(){ setTimeout(resize, 60); });
  }

  /* =====================================================================
     5b. 순한맛 밸런스 값
     ===================================================================== */
  function rivalSpeedFor(vid, n){
    return 0.70 + (vid - 1) * 0.030 + (n - 1) * 0.006;
  }
  // 뒤 스테이지·뒤 마을일수록 연료가 조금 더 빨리 줄어요
  function fuelRateFor(vid, n){
    return 0.070 + (vid - 1) * 0.004 + (n - 1) * 0.0012;
  }
  function raceCoinBonus(rank){
    return rank === 1 ? 40 : (rank === 2 ? 30 : (rank === 3 ? 22 : 16));
  }
  /* =====================================================================
     6. 그리기 - 하늘 / 배경
     ===================================================================== */
  function drawSky(){
    var p = G.pal;
    var g = ctx.createLinearGradient(0, 0, 0, G.H);
    g.addColorStop(0, p.sky0);
    g.addColorStop(0.55, p.sky1);
    g.addColorStop(1, p.sky2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, G.W, G.H);

    if (G.deco === 'space'){
      drawStars();
      // 큰 행성
      var px = G.W * 0.78, py = G.H * 0.17, pr = Math.min(G.W, G.H) * 0.085;
      var pg = ctx.createRadialGradient(px - pr * .3, py - pr * .35, pr * .2, px, py, pr);
      pg.addColorStop(0, '#ffd9f2'); pg.addColorStop(0.6, '#c98ae8'); pg.addColorStop(1, '#7a4fb0');
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill();
      ctx.save();
      ctx.translate(px, py); ctx.rotate(-0.35);
      ctx.strokeStyle = 'rgba(255,230,255,.6)'; ctx.lineWidth = Math.max(3, pr * 0.16);
      ctx.beginPath(); ctx.ellipse(0, 0, pr * 1.6, pr * 0.42, 0, 0, TAU); ctx.stroke();
      ctx.restore();
      // 작은 달
      ctx.fillStyle = '#eef6ff';
      ctx.beginPath(); ctx.arc(G.W * 0.16, G.H * 0.13, Math.min(26, G.H * 0.035), 0, TAU); ctx.fill();
      return;
    }

    var sx = G.W * 0.82, sy = G.H * (G.deco === 'volcano' ? 0.24 : 0.14);
    var sr = Math.min(G.W, G.H) * (G.deco === 'desert' || G.deco === 'volcano' ? 0.095 : 0.075);
    var rg = ctx.createRadialGradient(sx, sy, sr * 0.4, sx, sy, sr * 3);
    rg.addColorStop(0, p.sunGlow);
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(sx, sy, sr * 3, 0, TAU); ctx.fill();
    ctx.fillStyle = p.sun;
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill();
  }

  function drawStars(){
    for (var i = 0; i < 70; i++){
      var sx = hash(i * 3.1) * G.W;
      var sy = hash(i * 7.7 + 2) * G.H * 0.72;
      var tw = 0.35 + 0.65 * Math.abs(Math.sin(G.t * (0.7 + hash(i) * 1.6) + i));
      ctx.globalAlpha = tw;
      ctx.fillStyle = i % 7 === 0 ? '#ffe9a8' : '#ffffff';
      var r = 1 + hash(i * 5.3) * 1.8;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
      if (i % 9 === 0){
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(sx - r * 3, sy); ctx.lineTo(sx + r * 3, sy);
        ctx.moveTo(sx, sy - r * 3); ctx.lineTo(sx, sy + r * 3); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawCloud(x, y, s, color){
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = color || 'rgba(255,255,255,.92)';
    ctx.beginPath();
    ctx.arc(-30, 0, 22, 0, TAU);
    ctx.arc(0, -12, 28, 0, TAU);
    ctx.arc(30, 2, 20, 0, TAU);
    ctx.arc(4, 10, 22, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  function drawClouds(){
    if (G.deco === 'space') return;
    var span = G.W + 260;
    var color = G.deco === 'volcano' ? 'rgba(90,60,60,.45)' : (G.deco === 'snow' ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.92)');
    for (var i = 0; i < 6; i++){
      var drift = G.t * (5 + i * 2.2) + i * 220;
      var raw = (i * 173 + drift - G.scrollX * 0.055) % span;
      if (raw < 0) raw += span;
      var cx = raw - 130;
      var cy = G.H * 0.12 + (i % 3) * G.H * 0.055 + Math.sin(i * 2.2) * 8;
      drawCloud(cx, cy, 0.55 + (i % 3) * 0.22, color);
    }
  }

  function mountainPath(par, base, amp){
    ctx.beginPath();
    ctx.moveTo(-20, G.H + 20);
    for (var px = -20; px <= G.W + 20; px += 14){
      var wx = (G.scrollX * par + px) * 0.0017;
      var y = base - (Math.sin(wx) * 0.55 + Math.sin(wx * 0.43 + 2.1) * 0.34 + Math.sin(wx * 1.7 + 0.9) * 0.12 + 1.05) * amp;
      ctx.lineTo(px, y);
    }
    ctx.lineTo(G.W + 20, G.H + 20);
    ctx.closePath();
  }
  function drawMountains(par, base, amp, color){
    mountainPath(par, base, amp);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function drawBackdrop(){
    var p = G.pal;
    var mMount = G.deco === 'snow' ? 1.25 : 1;

    if (G.deco === 'sea'){
      // horizon sea
      var seaTop = G.baseY - G.H * 0.055;
      var sg = ctx.createLinearGradient(0, seaTop, 0, G.baseY + 40);
      sg.addColorStop(0, p.far);
      sg.addColorStop(0.55, p.mid);
      sg.addColorStop(1, p.w1);
      ctx.fillStyle = sg;
      ctx.fillRect(0, seaTop, G.W, G.baseY + 40 - seaTop);
      for (var i = 0; i < 16; i++){
        var wy = seaTop + 8 + (i % 7) * ((G.baseY - seaTop) / 8);
        var wx = ((i * 97 + G.t * 12) % (G.W + 120)) - 60;
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#ffffff';
        rr(ctx, wx, wy, 22 + (i % 3) * 8, 2.5, 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      // 섬
      ctx.fillStyle = p.mid;
      ctx.beginPath();
      ctx.ellipse(G.W * 0.25, seaTop + 3, 70, 14, 0, Math.PI, 0);
      ctx.fill();
      drawPalm(G.W * 0.25 - 10, seaTop + 2, 0.55);
      drawPalm(G.W * 0.25 + 22, seaTop + 4, 0.42);
      return;
    }

    if (G.deco === 'volcano'){
      drawMountains(0.10, G.baseY - 20, 150, p.far);
      // 화산
      var vx = G.W * 0.32 - (G.scrollX * 0.05 % (G.W + 600));
      if (vx < -300) vx += G.W + 600;
      var vb = G.baseY + 6, vh = G.H * 0.34, vw = G.W * 0.26;
      ctx.fillStyle = p.mid;
      ctx.beginPath();
      ctx.moveTo(vx - vw, vb);
      ctx.lineTo(vx - vw * 0.26, vb - vh);
      ctx.lineTo(vx + vw * 0.26, vb - vh);
      ctx.lineTo(vx + vw, vb);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff7a1a';
      ctx.beginPath();
      ctx.moveTo(vx - vw * 0.22, vb - vh * 0.92);
      ctx.lineTo(vx, vb - vh * 1.06);
      ctx.lineTo(vx + vw * 0.2, vb - vh * 0.9);
      ctx.closePath(); ctx.fill();
      // 연기
      for (var k = 0; k < 4; k++){
        var t2 = (G.t * 0.25 + k * 0.25) % 1;
        ctx.globalAlpha = (1 - t2) * 0.4;
        ctx.fillStyle = '#5a4a4a';
        ctx.beginPath(); ctx.arc(vx + Math.sin(t2 * 5 + k) * 18, vb - vh - 8 - t2 * 90, 16 + t2 * 22, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
      drawMountains(0.24, G.baseY + 10, 96, shade(p.mid, -0.12));
      return;
    }

    if (G.deco === 'space'){
      drawMountains(0.10, G.baseY - 20, 130, p.far);
      drawMountains(0.24, G.baseY + 10, 92, p.mid);
      // 떠 있는 바위
      for (var j = 0; j < 3; j++){
        var fx = ((j * 430 - G.scrollX * 0.12) % (G.W + 500) + G.W + 500) % (G.W + 500) - 150;
        var fy = G.H * (0.30 + j * 0.09) + Math.sin(G.t * 0.9 + j) * 6;
        ctx.fillStyle = shade(p.far, -0.15);
        ctx.beginPath(); ctx.ellipse(fx, fy, 26, 13, 0.2, 0, TAU); ctx.fill();
        ctx.fillStyle = shade(p.mid, 0.1);
        ctx.beginPath(); ctx.ellipse(fx + 3, fy - 4, 17, 7, 0.2, 0, TAU); ctx.fill();
      }
      return;
    }

    drawMountains(0.10, G.baseY - 30, 148 * mMount, p.far);
    drawMountains(0.24, G.baseY + 10, 104 * mMount, p.mid);

    if (G.deco === 'snow'){
      // 눈 덮인 봉우리
      ctx.save();
      ctx.translate(0, 26);
      drawMountains(0.10, G.baseY - 30, 148 * mMount, '#ffffff');
      drawMountains(0.24, G.baseY + 10, 104 * mMount, p.far);
      ctx.restore();
    }
  }

  /* =====================================================================
     7. 땅 / 물 / 웅덩이 / 진흙
     ===================================================================== */
  function drawGround(){
    var p = G.pal;
    var edgeStep = 10;

    ctx.beginPath();
    ctx.moveTo(-20, G.H + 30);
    for (var px = -20; px <= G.W + 20; px += edgeStep){
      ctx.lineTo(px, groundRef(G.scrollX + px));
    }
    ctx.lineTo(G.W + 20, G.H + 30);
    ctx.closePath();
    var dg = ctx.createLinearGradient(0, G.baseY - 80, 0, G.H);
    dg.addColorStop(0, p.dirt);
    dg.addColorStop(1, p.dirt2);
    ctx.fillStyle = dg;
    ctx.fill();

    ctx.beginPath();
    for (var px2 = -20; px2 <= G.W + 20; px2 += edgeStep){
      var y = groundRef(G.scrollX + px2);
      if (px2 === -20) ctx.moveTo(px2, y); else ctx.lineTo(px2, y);
    }
    for (var px3 = G.W + 20; px3 >= -20; px3 -= edgeStep){
      ctx.lineTo(px3, groundRef(G.scrollX + px3) + 26);
    }
    ctx.closePath();
    var gg = ctx.createLinearGradient(0, G.baseY - 140, 0, G.baseY + 120);
    gg.addColorStop(0, p.top);
    gg.addColorStop(1, p.bot);
    ctx.fillStyle = gg;
    ctx.fill();

    ctx.beginPath();
    for (var px4 = -20; px4 <= G.W + 20; px4 += edgeStep){
      var y2 = groundRef(G.scrollX + px4);
      if (px4 === -20) ctx.moveTo(px4, y2); else ctx.lineTo(px4, y2);
    }
    ctx.strokeStyle = p.edge;
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.stroke();

    drawGroundDetail(p);

    // 우주 마을은 땅에 크레이터
    if (G.deco === 'space'){
      for (var cx = Math.floor(G.scrollX / 300) * 300; cx < G.scrollX + G.W + 300; cx += 300){
        var h = hash(cx);
        if (h < 0.45){
          var sx = cx - G.scrollX, gy = groundRef(cx);
          ctx.globalAlpha = 0.35;
          ctx.fillStyle = shade(p.bot, -0.18);
          ctx.beginPath(); ctx.ellipse(sx, gy + 34, 30 * (0.6 + h), 9, 0, 0, TAU); ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  function drawGroundDetail(p){
    var startX = Math.floor((G.scrollX - 40) / 62) * 62;
    for (var wx = startX; wx < G.scrollX + G.W + 62; wx += 62){
      if (waterSegAt(wx) || pondAt(wx) || mudAt(wx)) continue;
      var h = hash(wx * 1.7), sx = wx - G.scrollX, gy = groundRef(wx);
      if (h < 0.38) continue;
      if (G.deco === 'grass'){
        ctx.strokeStyle = p.edge;
        ctx.lineWidth = 2; ctx.lineCap = 'round';
        for (var i = 0; i < 3; i++){
          var bx = sx + (i - 1) * 4;
          ctx.beginPath(); ctx.moveTo(bx, gy + 6); ctx.lineTo(bx + (i - 1) * 3, gy - 2 - (i % 2) * 3); ctx.stroke();
        }
        if (h > 0.78){
          ctx.fillStyle = h > 0.9 ? '#ffe066' : '#ff9fc4';
          ctx.beginPath(); ctx.arc(sx, gy - 4, 2.6, 0, TAU); ctx.fill();
        }
      } else if (G.deco === 'sea'){
        ctx.fillStyle = 'rgba(255,255,255,.65)';
        ctx.beginPath(); ctx.arc(sx, gy + 4, 2 + h * 2, 0, TAU); ctx.fill();
        if (h > 0.86) drawShell(sx, gy + 5, 0.55);
      } else if (G.deco === 'desert'){
        ctx.fillStyle = 'rgba(180,140,90,.35)';
        ctx.beginPath(); ctx.ellipse(sx, gy + 5, 4 + h * 3, 2, 0, 0, TAU); ctx.fill();
      } else if (G.deco === 'snow'){
        ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        var r = 3 + h * 3;
        ctx.beginPath(); ctx.moveTo(sx - r, gy + 3); ctx.lineTo(sx + r, gy + 3);
        ctx.moveTo(sx, gy + 3 - r); ctx.lineTo(sx, gy + 3 + r); ctx.stroke();
      } else if (G.deco === 'volcano'){
        ctx.strokeStyle = 'rgba(40,20,15,.45)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx - 5, gy + 7); ctx.lineTo(sx, gy + 2); ctx.lineTo(sx + 6, gy + 6); ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(200,180,255,.4)';
        ctx.beginPath(); ctx.arc(sx, gy + 6, 2 + h * 3, 0, TAU); ctx.fill();
      }
    }
  }

  function drawWater(){
    var p = G.pal;
    for (var i = 0; i < G.waters.length; i++){
      var w = G.waters[i];
      var sx0 = w.x0 - G.scrollX, sx1 = w.x1 - G.scrollX;
      if (sx1 < -60 || sx0 > G.W + 60) continue;
      var a = clamp(sx0, -60, G.W + 60);
      var b = clamp(sx1, -60, G.W + 60);

      ctx.beginPath();
      var first = true;
      for (var px = a; px <= b; px += 6){
        var wx = px + G.scrollX;
        var y = waterSurfaceY(w, wx) + Math.sin(wx * 0.045 + G.t * 2.6) * 2.2;
        if (first){ ctx.moveTo(px, y); first = false; } else ctx.lineTo(px, y);
      }
      ctx.lineTo(b, G.H + 20);
      ctx.lineTo(a, G.H + 20);
      ctx.closePath();
      var wg = ctx.createLinearGradient(0, w.top - 20, 0, w.top + 150);
      wg.addColorStop(0, p.w0);
      wg.addColorStop(0.45, p.w1);
      wg.addColorStop(1, p.wDeep);
      ctx.fillStyle = wg;
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      var f2 = true;
      for (var px5 = a; px5 <= b; px5 += 6){
        var wx5 = px5 + G.scrollX;
        var y5 = waterSurfaceY(w, wx5) + Math.sin(wx5 * 0.045 + G.t * 2.6) * 2.2;
        if (f2){ ctx.moveTo(px5, y5); f2 = false; } else ctx.lineTo(px5, y5);
      }
      ctx.lineTo(b, G.H + 20);
      ctx.lineTo(a, G.H + 20);
      ctx.closePath();
      ctx.clip();
      for (var k = 0; k < 7; k++){
        var sp = (G.t * 22 + k * 61) % Math.max(1, (b - a));
        var sx = a + sp;
        var swx = sx + G.scrollX;
        var sy = waterSurfaceY(w, swx) + 18 + (k % 4) * 16;
        ctx.globalAlpha = Math.max(0.06, 0.28 + Math.sin(G.t * 3 + k) * 0.16);
        ctx.fillStyle = '#ffffff';
        rr(ctx, sx, sy, 16 + (k % 3) * 6, 3, 2); ctx.fill();
      }
      ctx.restore();

      ctx.beginPath();
      var f3 = true;
      for (var px6 = a; px6 <= b; px6 += 6){
        var wx6 = px6 + G.scrollX;
        var y6 = waterSurfaceY(w, wx6) + Math.sin(wx6 * 0.045 + G.t * 2.6) * 2.2;
        if (f3){ ctx.moveTo(px6, y6); f3 = false; } else ctx.lineTo(px6, y6);
      }
      ctx.strokeStyle = 'rgba(255,255,255,.8)';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.stroke();

      if (!w.bridge){
        ctx.fillStyle = 'rgba(255,255,255,.8)';
        [a, b].forEach(function(ex, idx){
          for (var q = 0; q < 3; q++){
            ctx.beginPath();
            ctx.arc(ex + (idx === 0 ? q * 6 : -q * 6), w.top + 4 + q * 2, 4 - q, 0, TAU);
            ctx.fill();
          }
        });
      } else {
        drawBridge(w, a, b);
      }
    }
  }

  function drawBridge(w, a, b){
    var deckY = w.top - 16;
    ctx.fillStyle = '#a9743f';
    for (var px = a + 30; px < b; px += 92){
      ctx.fillRect(px - 5, deckY + 10, 10, G.H - deckY);
    }
    ctx.fillStyle = '#d0965a';
    rr(ctx, a - 34, deckY, (b - a) + 68, 16, 5); ctx.fill();
    ctx.fillStyle = '#b57a40';
    for (var px2 = a - 28; px2 < b + 30; px2 += 24) ctx.fillRect(px2, deckY, 3, 16);
    ctx.strokeStyle = '#8a5a33';
    ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a - 34, deckY - 28); ctx.lineTo(b + 34, deckY - 28); ctx.stroke();
    for (var px3 = a - 30; px3 <= b + 30; px3 += 58){
      ctx.beginPath(); ctx.moveTo(px3, deckY - 28); ctx.lineTo(px3, deckY - 2); ctx.stroke();
    }
  }

  function lensPath(q, depthMax){
    var a = q.x0, b = q.x1;
    var steps = Math.max(8, Math.round((b - a) / 10));
    ctx.beginPath();
    for (var i = 0; i <= steps; i++){
      var t = i / steps, wx = a + (b - a) * t;
      var y = groundRef(wx) + 2 + Math.sin(wx * 0.05 + G.t * 2.2) * 1.6 * Math.sin(Math.PI * t);
      if (i === 0) ctx.moveTo(wx - G.scrollX, y); else ctx.lineTo(wx - G.scrollX, y);
    }
    for (var j = steps; j >= 0; j--){
      var t2 = j / steps, wx2 = a + (b - a) * t2;
      var dep = depthMax * Math.pow(Math.sin(Math.PI * t2), 0.55);
      ctx.lineTo(wx2 - G.scrollX, groundRef(wx2) + 2 + dep);
    }
    ctx.closePath();
  }

  function drawPonds(){
    var p = G.pal;
    for (var i = 0; i < G.ponds.length; i++){
      var q = G.ponds[i];
      var a = q.x0 - G.scrollX, b = q.x1 - G.scrollX;
      if (b < -60 || a > G.W + 60) continue;

      lensPath(q, 24);
      var g = ctx.createLinearGradient(0, groundRef(q.x0) - 6, 0, groundRef(q.x0) + 30);
      g.addColorStop(0, p.w0);
      g.addColorStop(0.6, p.w1);
      g.addColorStop(1, p.wDeep);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2; ctx.stroke();

      // 물결 반짝
      for (var k = 0; k < 3; k++){
        var wx2 = q.x0 + ((G.t * 20 + k * 47) % Math.max(1, q.x1 - q.x0));
        var sx = wx2 - G.scrollX;
        if (sx < a || sx > b) continue;
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = '#fff';
        rr(ctx, sx, groundRef(wx2) + 8, 14, 2.6, 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
      // 수련잎
      var lx = (a + b) / 2;
      var lwx = q.x0 + (q.x1 - q.x0) * 0.32;
      ctx.fillStyle = '#5cc76b';
      ctx.beginPath(); ctx.ellipse(lx - 8, groundRef(lwx) + 9, 11, 4.5, -0.2, 0, TAU); ctx.fill();
      if (i % 2 === 0){
        ctx.fillStyle = '#ff9fc4';
        ctx.beginPath(); ctx.arc(lx - 8, groundRef(lwx) + 4, 4, 0, TAU); ctx.fill();
      }
    }
  }

  function drawMuds(){
    var p = G.pal;
    for (var i = 0; i < G.muds.length; i++){
      var q = G.muds[i];
      var a = q.x0 - G.scrollX, b = q.x1 - G.scrollX;
      if (b < -60 || a > G.W + 60) continue;

      lensPath(q, 17);
      var g = ctx.createLinearGradient(0, groundRef(q.x0) - 4, 0, groundRef(q.x0) + 26);
      g.addColorStop(0, p.mud0);
      g.addColorStop(0.6, p.mud1);
      g.addColorStop(1, p.mudEdge);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = G.deco === 'snow' ? 'rgba(255,255,255,.85)' : 'rgba(255,240,210,.35)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 진흙/빙판 반짝임
      if (G.deco === 'snow'){
        ctx.strokeStyle = 'rgba(255,255,255,.85)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (var px3 = a; px3 <= b; px3 += 12){
          var wx3 = px3 + G.scrollX;
          var y3 = groundRef(wx3) + 6 + Math.sin(wx3 * 0.09) * 1.5;
          if (px3 === a) ctx.moveTo(px3, y3); else ctx.lineTo(px3, y3);
        }
        ctx.stroke();
      } else {
        for (var k = 0; k < 4; k++){
          var bx = a + 14 + ((i * 53 + k * 41 + G.t * 6) % Math.max(1, b - a - 28));
          var by = groundRef(bx + G.scrollX) + 7;
          var r = 3 + Math.abs(Math.sin(G.t * 1.6 + k + i)) * 2.5;
          ctx.strokeStyle = 'rgba(255,255,255,.35)';
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.stroke();
        }
      }
    }
  }

  /* =====================================================================
     8. 꾸미기 - 마을별 나무·장식
     ===================================================================== */
  function drawTree(x, y, s, kind){
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = '#8a5a33';
    rr(ctx, -4, -30, 8, 30, 3); ctx.fill();
    if (kind === 'pine'){
      ctx.fillStyle = '#2f9e5a';
      ctx.beginPath(); ctx.moveTo(0, -86); ctx.lineTo(20, -46); ctx.lineTo(-20, -46); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#37b167';
      ctx.beginPath(); ctx.moveTo(0, -70); ctx.lineTo(26, -28); ctx.lineTo(-26, -28); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = '#48c06e';
      ctx.beginPath(); ctx.arc(0, -52, 22, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(-16, -38, 16, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(16, -38, 16, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.22)';
      ctx.beginPath(); ctx.arc(-6, -58, 9, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
  function drawBush(x, y, s){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = '#54c96f';
    ctx.beginPath(); ctx.arc(-10, -12, 12, 0, TAU); ctx.arc(6, -14, 14, 0, TAU); ctx.arc(18, -10, 10, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.2)';
    ctx.beginPath(); ctx.arc(2, -20, 6, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function drawFlower(x, y, s, hue){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.strokeStyle = '#3f9c2c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -14); ctx.stroke();
    ctx.fillStyle = hue;
    for (var i = 0; i < 5; i++){
      var a = i / 5 * TAU;
      ctx.beginPath(); ctx.arc(Math.cos(a) * 5, -14 + Math.sin(a) * 5, 4, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#fff2a8';
    ctx.beginPath(); ctx.arc(0, -14, 3, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function drawSign(x, y, s){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = '#8a5a33'; rr(ctx, -3, -34, 6, 34, 2); ctx.fill();
    ctx.fillStyle = '#fff0c9'; rr(ctx, -26, -60, 52, 28, 7); ctx.fill();
    ctx.strokeStyle = '#e0b96a'; ctx.lineWidth = 3; rr(ctx, -26, -60, 52, 28, 7); ctx.stroke();
    ctx.fillStyle = '#e08b00'; starPath(ctx, 0, -46, 8, 3.4, 5); ctx.fill();
    ctx.restore();
  }
  function drawPalm(x, y, s){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.strokeStyle = '#b98a55'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(6, -40, -4, -74); ctx.stroke();
    var sway = Math.sin(G.t * 1.4 + x) * 0.08;
    ctx.fillStyle = '#3fb56b';
    for (var i = 0; i < 5; i++){
      var a = -Math.PI / 2 + (i - 2) * 0.62 + sway;
      ctx.save();
      ctx.translate(-4, -74); ctx.rotate(a);
      ctx.beginPath(); ctx.ellipse(18, 0, 22, 7, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#8a5a33';
    ctx.beginPath(); ctx.arc(-12, -68, 4, 0, TAU); ctx.arc(-2, -64, 4, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function drawUmbrella(x, y, s){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.strokeStyle = '#e8e2d5'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -50); ctx.stroke();
    var cols = ['#ff6b6b', '#fff3a8', '#4da6ff', '#fff3a8'];
    for (var i = 0; i < 4; i++){
      ctx.fillStyle = cols[i];
      ctx.beginPath();
      ctx.moveTo(0, -50);
      ctx.arc(0, -50, 34, Math.PI + i * Math.PI / 4, Math.PI + (i + 1) * Math.PI / 4);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#ffd93d';
    ctx.beginPath(); ctx.arc(0, -52, 3, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function drawLighthouse(x, y, s){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(-13, 0); ctx.lineTo(-8, -70); ctx.lineTo(8, -70); ctx.lineTo(13, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff6b6b';
    ctx.fillRect(-11, -22, 22, 9);
    ctx.fillRect(-10, -44, 20, 9);
    ctx.fillStyle = '#3a4a56';
    rr(ctx, -11, -80, 22, 12, 3); ctx.fill();
    ctx.fillStyle = '#fff3a8';
    ctx.fillRect(-7, -78, 14, 8);
    ctx.strokeStyle = 'rgba(255,240,160,.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(10, -74); ctx.lineTo(34, -82); ctx.moveTo(10, -74); ctx.lineTo(34, -66); ctx.stroke();
    ctx.restore();
  }
  function drawShell(x, y, s){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = '#ffd9e8';
    ctx.beginPath(); ctx.arc(0, -2, 9, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#f7a8c8'; ctx.lineWidth = 1.5;
    for (var i = -2; i <= 2; i++){ ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(i * 4, -9); ctx.stroke(); }
    ctx.restore();
  }
  function drawCactus(x, y, s){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = '#4fae5f';
    rr(ctx, -6, -58, 12, 58, 6); ctx.fill();
    rr(ctx, -22, -44, 16, 9, 4); ctx.fill();
    rr(ctx, -22, -44, 9, 24, 4); ctx.fill();
    rr(ctx, 6, -50, 16, 9, 4); ctx.fill();
    rr(ctx, 14, -50, 9, 18, 4); ctx.fill();
    ctx.fillStyle = '#7fd18c';
    ctx.fillRect(-2, -54, 3, 44);
    ctx.fillStyle = '#ff9fc4';
    ctx.beginPath(); ctx.arc(0, -60, 4, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function drawRock(x, y, s, col){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = col || '#b9a07a';
    ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(-10, -20); ctx.lineTo(8, -24); ctx.lineTo(20, -8); ctx.lineTo(16, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    ctx.beginPath(); ctx.moveTo(-8, -18); ctx.lineTo(6, -21); ctx.lineTo(10, -12); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function drawSnowPine(x, y, s){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = '#8a5a33'; ctx.fillRect(-3, -20, 6, 20);
    for (var i = 0; i < 3; i++){
      var w = 26 - i * 6, top = -34 - i * 22;
      ctx.fillStyle = '#2f9e5a';
      ctx.beginPath(); ctx.moveTo(0, top - 18); ctx.lineTo(w, top); ctx.lineTo(-w, top); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.moveTo(0, top - 18); ctx.lineTo(w * 0.62, top - 4); ctx.lineTo(-w * 0.62, top - 4); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  function drawSnowman(x, y, s){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, -14, 17, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -38, 13, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2b3f4d';
    ctx.beginPath(); ctx.arc(-4, -41, 2, 0, TAU); ctx.arc(4, -41, 2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff9f45';
    ctx.beginPath(); ctx.moveTo(0, -38); ctx.lineTo(12, -35); ctx.lineTo(0, -33); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff6b6b';
    rr(ctx, -13, -54, 26, 6, 3); ctx.fill();
    ctx.fillStyle = '#e63946';
    ctx.beginPath(); ctx.moveTo(-8, -14); ctx.lineTo(8, -14); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#8a5a33'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-13, -40); ctx.lineTo(-24, -46); ctx.moveTo(13, -40); ctx.lineTo(24, -46); ctx.stroke();
    ctx.restore();
  }
  function drawDinoDeco(x, y, s){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = '#6fbf73';
    ctx.beginPath(); ctx.ellipse(0, -22, 22, 14, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(18, -38, 10, 9, -0.3, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#6fbf73'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-20, -22); ctx.quadraticCurveTo(-38, -26, -42, -40); ctx.stroke();
    ctx.fillStyle = '#4f9e58';
    for (var i = 0; i < 3; i++){ ctx.beginPath(); ctx.arc(-8 + i * 10, -34, 3, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#2b3f4d';
    ctx.beginPath(); ctx.arc(22, -40, 2, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function drawFern(x, y, s){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.strokeStyle = '#4f9e58'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (var i = 0; i < 5; i++){
      var a = -Math.PI / 2 + (i - 2) * 0.42;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(Math.cos(a) * 18, -20, Math.cos(a) * 30, -34 + Math.sin(a) * 6);
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawCrystal(x, y, s){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    var g = ctx.createLinearGradient(0, -40, 0, 0);
    g.addColorStop(0, '#d9f6ff'); g.addColorStop(1, '#6fc3f0');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0, -42); ctx.lineTo(10, -16); ctx.lineTo(4, 0); ctx.lineTo(-8, 0); ctx.lineTo(-12, -18); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.moveTo(-2, -36); ctx.lineTo(3, -18); ctx.lineTo(-3, -6); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function drawCrater(x, y, s){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = 'rgba(40,30,70,.35)';
    ctx.beginPath(); ctx.ellipse(0, -2, 22, 7, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(200,180,255,.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, -2, 22, 7, 0, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  function drawDecos(){
    var start = Math.floor((G.scrollX - 260) / 200) * 200;
    for (var wx = start; wx < G.scrollX + G.W + 260; wx += 200){
      if (waterSegAt(wx) || waterSegAt(wx + 40)) continue;
      var h1 = hash(wx), h2 = hash(wx + 7.3);
      var gy = groundRef(wx);
      var sx = Math.round(wx - G.scrollX);
      if (G.deco === 'sea'){
        if (h1 < 0.30) drawPalm(sx, gy + 4, 0.72 + h2 * 0.5);
        else if (h1 < 0.48) drawUmbrella(sx, gy + 2, 0.8 + h2 * 0.3);
        else if (h1 < 0.62) drawLighthouse(sx, gy + 2, 0.85);
        else if (h1 < 0.82) drawShell(sx, gy + 2, 0.9 + h2 * 0.5);
        else drawRock(sx, gy + 2, 0.7, '#e8d6b0');
      } else if (G.deco === 'desert'){
        if (h1 < 0.34) drawCactus(sx, gy + 2, 0.8 + h2 * 0.5);
        else if (h1 < 0.56) drawRock(sx, gy + 2, 0.9 + h2 * 0.4, '#d9b57e');
        else if (h1 < 0.74) drawPalm(sx, gy + 2, 0.6 + h2 * 0.3);
        else if (h1 < 0.9) drawBush(sx, gy + 2, 0.6);
        else drawSign(sx, gy + 2, 0.85);
      } else if (G.deco === 'snow'){
        if (h1 < 0.34) drawSnowPine(sx, gy + 3, 0.8 + h2 * 0.45);
        else if (h1 < 0.50) drawSnowman(sx, gy + 2, 0.8 + h2 * 0.3);
        else if (h1 < 0.68) drawCrystal(sx, gy + 2, 0.9 + h2 * 0.4);
        else if (h1 < 0.84) drawBush(sx, gy + 2, 0.7);
        else drawSign(sx, gy + 2, 0.85);
      } else if (G.deco === 'volcano'){
        if (h1 < 0.30) drawDinoDeco(sx, gy + 2, 0.9 + h2 * 0.4);
        else if (h1 < 0.52) drawFern(sx, gy + 2, 0.9 + h2 * 0.5);
        else if (h1 < 0.72) drawRock(sx, gy + 2, 0.9, '#7a5a4a');
        else if (h1 < 0.86) drawPalm(sx, gy + 2, 0.6);
        else drawSign(sx, gy + 2, 0.85);
      } else if (G.deco === 'space'){
        if (h1 < 0.30) drawCrystal(sx, gy + 2, 0.9 + h2 * 0.5);
        else if (h1 < 0.52) drawCrater(sx, gy + 6, 0.9 + h2 * 0.5);
        else if (h1 < 0.70) drawRock(sx, gy + 2, 0.8, '#6a5f8f');
        else if (h1 < 0.86) drawCactus(sx, gy + 2, 0.6);
        else drawSign(sx, gy + 2, 0.85);
      } else {

  function coinY(c){
    var w = waterSegAt(c.x);
    var base = w ? (w.bridge ? (w.top - 16) : (w.top + 5)) : groundRef(c.x);
    return base - c.dy;
  }
  function drawCoinShape(x, y, scale, ph){
    var bob = Math.sin(G.t * 3 + ph) * 3;
    var sq = 0.35 + 0.65 * Math.abs(Math.cos(G.t * 2.1 + ph));
    ctx.save();
    ctx.translate(x, y + bob);
    var gl = ctx.createRadialGradient(0, 0, 4, 0, 0, 30 * scale);
    gl.addColorStop(0, 'rgba(255,240,150,.55)');
    gl.addColorStop(1, 'rgba(255,240,150,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(0, 0, 30 * scale, 0, TAU); ctx.fill();
    ctx.scale(sq * scale, scale);
    var g = ctx.createRadialGradient(-5, -6, 2, 0, 0, 18);
    g.addColorStop(0, '#fff6c4');
    g.addColorStop(0.5, '#ffd93d');
    g.addColorStop(1, '#e8a800');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 17, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#c98a00'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 17, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#c98a00'; starPath(ctx, 0, 1, 8.5, 3.6, 5); ctx.fill();
    ctx.fillStyle = '#fff8cd'; starPath(ctx, -1, -0.5, 4, 1.7, 5); ctx.fill();
    ctx.restore();
    var tw = Math.sin(G.t * 5 + ph * 2);
    if (tw > 0.55){
      ctx.save();
      ctx.globalAlpha = (tw - 0.55) / 0.45 * 0.9;
      ctx.strokeStyle = '#fffbe0'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      var sx = x + 13 * scale, sy = y + bob - 14 * scale, r = 6 * scale;
      ctx.beginPath(); ctx.moveTo(sx - r, sy); ctx.lineTo(sx + r, sy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx, sy - r); ctx.lineTo(sx, sy + r); ctx.stroke();
      ctx.restore();
    }
  }

    for (var i = 0; i < G.coins.length; i++){

  function drawTrapShape(x, gy, o){

    ctx.fillStyle = 'rgba(20,40,40,.14)';

      ctx.fillStyle = '#4fb6e8';

      ctx.fillStyle = 'rgba(255,255,255,.55)';

    } else if (k === 'ice'){
      ctx.fillStyle = 'rgba(190,240,255,.92)';
      ctx.beginPath(); ctx.ellipse(0, -2, o.w * 0.55, 7, 0, 0, TAU); ctx.fill();

    } else if (k === 'lava'){
      var lg = ctx.createLinearGradient(0, -10, 0, 6);
      lg.addColorStop(0, '#ffd166'); lg.addColorStop(1, '#ff3d00');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.ellipse(0, -2, o.w * 0.5, 7, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,220,120,.9)';
      ctx.beginPath(); ctx.arc(-6 + Math.sin(G.t * 3) * 3, -5, 2.4, 0, TAU); ctx.fill();
    } else if (k === 'rock'){
      ctx.fillStyle = '#9aa6b2';
      ctx.beginPath();
      ctx.moveTo(-20, 0); ctx.lineTo(-15, -26); ctx.lineTo(-2, -37);
      ctx.lineTo(13, -30); ctx.lineTo(19, -8); ctx.lineTo(16, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#c3ccd4';
      ctx.beginPath(); ctx.moveTo(-12, -27); ctx.lineTo(-1, -34); ctx.lineTo(6, -28); ctx.closePath(); ctx.fill();
    } else if (k === 'stump'){
      ctx.fillStyle = '#a06a3c';
      rr(ctx, -14, -28, 28, 28, 5); ctx.fill();
      ctx.fillStyle = '#c99161';
      ctx.beginPath(); ctx.ellipse(0, -28, 14, 5, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#8a5a30'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.ellipse(0, -28, 8, 2.6, 0, 0, TAU); ctx.stroke();
    } else if (k === 'snowpile'){
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(0, -4, o.w * 0.45, 22, 0, Math.PI, TAU); ctx.fill();
      ctx.fillStyle = '#e6f4ff';
      ctx.beginPath(); ctx.ellipse(0, -2, o.w * 0.45, 7, 0, 0, Math.PI); ctx.fill();
    } else if (k === 'cactus'){
      ctx.fillStyle = '#4caf50';
      rr(ctx, -8, -46, 16, 46, 7); ctx.fill();
      rr(ctx, -18, -34, 11, 9, 4); ctx.fill();
      rr(ctx, -18, -34, 8, 20, 4); ctx.fill();
      rr(ctx, 8, -26, 11, 8, 4); ctx.fill();
      ctx.fillStyle = '#7fd07f';
      ctx.beginPath(); ctx.arc(0, -46, 8, Math.PI, TAU); ctx.fill();
    } else if (k === 'shell'){
      ctx.fillStyle = '#ffc3d6';
      ctx.beginPath(); ctx.ellipse(0, -3, o.w * 0.3, 14, 0, Math.PI, TAU); ctx.fill();
      ctx.strokeStyle = '#e88fae'; ctx.lineWidth = 1.6;
      for (var s = -2; s <= 2; s++){
        ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(s * 6, -14); ctx.stroke();
      }
    } else {
      // meteor
      ctx.fillStyle = '#4a3f57';
      ctx.beginPath();
      ctx.moveTo(-18, 0); ctx.lineTo(-22, -18); ctx.lineTo(-8, -32);
      ctx.lineTo(9, -29); ctx.lineTo(20, -10); ctx.lineTo(14, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#6b5c7d';
      ctx.beginPath(); ctx.arc(-4, -18, 5, 0, TAU); ctx.arc(7, -12, 3.4, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,170,60,.8)';
      ctx.beginPath(); ctx.arc(2, -32 + Math.sin(G.t * 4 + o.ph) * 2, 3, 0, TAU); ctx.fill();

    if (o.hit){

  // 입력한 이름을 다듬습니다 (태그 문자 제거, 공백 정리, 길이 제한)
  function cleanName(s){
    s = String(s == null ? '' : s).replace(/[\u0000-\u001f<>]/g, '');
    s = s.replace(/\s+/g, ' ').trim();
    return s.slice(0, NAME_MAX);
  }
  function playerLabel(){ return cleanName(save.playerName) || DEFAULT_PLAYER_NAME; }
  function escHTML(s){
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function drawShield(){
    if (G.shieldT <= 0) return;
    var car = G.car;
    var sx = car.x - G.scrollX;
    var cy = car.y - 52;
    var r = 64 + Math.sin(G.t * 6) * 2.2;
    var fade = G.shieldT < 0.9 ? clamp(G.shieldT / 0.9, 0, 1) : 1;
    var flash = G.shieldFlash > 0;
    ctx.save();
    ctx.globalAlpha = (flash ? 0.62 : 0.42) * fade;
    var g = ctx.createRadialGradient(sx, cy - 10, r * 0.22, sx, cy, r);
    g.addColorStop(0, 'rgba(255,255,255,.14)');
    g.addColorStop(0.6, 'rgba(130,200,255,.30)');
    g.addColorStop(1, 'rgba(60,140,240,.60)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(sx, cy, r * 0.94, r, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = (flash ? 1 : 0.85) * fade;
    ctx.strokeStyle = flash ? '#ffffff' : '#9fd4ff';
    ctx.lineWidth = flash ? 5 : 3;
    ctx.beginPath(); ctx.ellipse(sx, cy, r * 0.94, r, 0, 0, TAU); ctx.stroke();
    // 반짝이는 점들
    ctx.fillStyle = '#ffffff';
    for (var i = 0; i < 3; i++){
      var a = G.t * 2.1 + i * 2.1;
      var px = sx + Math.cos(a) * r * 0.7;
      var py = cy + Math.sin(a) * r * 0.78;
      ctx.globalAlpha = 0.9 * fade;
      ctx.beginPath(); ctx.arc(px, py, 2.4 + Math.sin(G.t * 8 + i) * 1.2, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawFinish(){

    ctx.fillStyle = '#9a7248';

    ctx.beginPath(); ctx.arc(sx, gy - 194, 8, 0, TAU); ctx.fill();

    ctx.save();
    ctx.translate(sx + 4, gy - 184);
    var fw = 96, fh = 56;

        ctx.fillStyle = ((r + col) % 2) ? '#ffffff' : '#3a4a56';

        ctx.lineTo((col + 1) * (fw / 5), (r + 1) * (fh / 4) + Math.sin(G.t * 5 + (col + 1) * 0.7) * 4);
        ctx.lineTo(col * (fw / 5), (r + 1) * (fh / 4) + wave);
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();

    ctx.save();
    ctx.translate(sx, gy - 236);
    ctx.fillStyle = '#ff5d5d';
    rr(ctx, -58, -26, 116, 46, 14); ctx.fill();

  function wheelDef(id){
    for (var i = 0; i < WHEELS.length; i++) if (WHEELS[i].id === id) return WHEELS[i];
    return WHEELS[0];
  }
  function drawHeart(c, s){
    c.beginPath();
    c.moveTo(0, s * 0.9);
    c.bezierCurveTo(-s * 1.5, -s * 0.1, -s * 0.8, -s * 1.05, 0, -s * 0.45);
    c.bezierCurveTo(s * 0.8, -s * 1.05, s * 1.5, -s * 0.1, 0, s * 0.9);
    c.closePath();
  }

  function drawWheel(c, x, y, r, spin, wheelId){
    var id = wheelId || save.wheel || 'basic';
    var def = wheelDef(id);
    var R = r * (def.scale || 1);
    // 바퀴 아랫면이 땅에 닿도록 크기만큼 위로 올립니다
    c.save();
    c.translate(x, y - (R - r));

    // 타이어
    c.fillStyle = '#3a3f47';
    c.beginPath(); c.arc(0, 0, R, 0, TAU); c.fill();

    if (def.hub === 'chunky' || def.hub === 'spike'){
      c.fillStyle = '#5a626b';
      for (var b = 0; b < 10; b++){
        var ba = spin * 0.5 + b * TAU / 10;
        c.save(); c.rotate(ba);
        rr(c, R * 0.8, -R * 0.15, R * 0.22, R * 0.3, 2); c.fill();
        c.restore();
      }
    }
    if (def.hub === 'spike'){
      c.fillStyle = '#aab5c0';
      for (var sp = 0; sp < 8; sp++){
        var sa0 = spin * 0.4 + sp * TAU / 8;
        c.save(); c.rotate(sa0);
        c.beginPath(); c.moveTo(R * 0.92, -R * 0.13); c.lineTo(R * 1.16, 0); c.lineTo(R * 0.92, R * 0.13); c.closePath(); c.fill();
        c.restore();
      }
    }
    if (def.hub === 'ring'){
      c.save();
      c.shadowColor = def.rim; c.shadowBlur = 12;
      c.strokeStyle = def.rim; c.lineWidth = Math.max(2, R * 0.14);
      c.beginPath(); c.arc(0, 0, R * 0.86, 0, TAU); c.stroke();
      c.restore();
    }

    // 림
    c.fillStyle = def.rim;
    c.beginPath(); c.arc(0, 0, R * 0.58, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(0,0,0,.18)';
    c.lineWidth = Math.max(1.2, R * 0.06);
    c.beginPath(); c.arc(0, 0, R * 0.58, 0, TAU); c.stroke();

    if (def.hub === 'heart'){
      c.fillStyle = '#ffffff';
      c.save(); c.scale(R * 0.032, R * 0.032); drawHeart(c, 10); c.fill(); c.restore();
    } else if (def.hub === 'crown'){
      c.fillStyle = '#c98a00';
      c.beginPath();
      c.moveTo(-R * 0.3, R * 0.14); c.lineTo(-R * 0.3, -R * 0.2); c.lineTo(-R * 0.12, -R * 0.02);
      c.lineTo(0, -R * 0.26); c.lineTo(R * 0.12, -R * 0.02); c.lineTo(R * 0.3, -R * 0.2);
      c.lineTo(R * 0.3, R * 0.14); c.closePath(); c.fill();
      c.fillStyle = '#fff6b8';
      c.beginPath(); c.arc(0, -R * 0.08, R * 0.06, 0, TAU); c.fill();
    } else if (def.hub === 'candy'){
      for (var cd = 0; cd < 6; cd++){
        var ca = spin + cd * TAU / 6;
        c.fillStyle = 'hsl(' + ((cd * 60 + G.t * 90) % 360) + ',90%,62%)';
        c.beginPath(); c.arc(Math.cos(ca) * R * 0.34, Math.sin(ca) * R * 0.34, R * 0.13, 0, TAU); c.fill();
      }
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(0, 0, R * 0.12, 0, TAU); c.fill();
    } else if (def.hub === 'flame'){
      for (var f = 0; f < 5; f++){
        var fa = spin + f * TAU / 5;
        c.fillStyle = f % 2 ? '#ffb703' : '#ff7a1a';
        c.beginPath();
        c.moveTo(Math.cos(fa) * R * 0.18, Math.sin(fa) * R * 0.18);
        c.lineTo(Math.cos(fa + 0.42) * R * 0.5, Math.sin(fa + 0.42) * R * 0.5);
        c.lineTo(Math.cos(fa - 0.42) * R * 0.5, Math.sin(fa - 0.42) * R * 0.5);
        c.closePath(); c.fill();
      }
      c.fillStyle = '#ffe9a8';
      c.beginPath(); c.arc(0, 0, R * 0.15, 0, TAU); c.fill();
    } else if (def.hub === 'chunky'){
      c.strokeStyle = '#9aa4ae'; c.lineWidth = Math.max(2, R * 0.15); c.lineCap = 'round';
      for (var q2 = 0; q2 < 6; q2++){
        var qa2 = spin + q2 * TAU / 6;
        c.beginPath();
        c.moveTo(Math.cos(qa2) * R * 0.16, Math.sin(qa2) * R * 0.16);
        c.lineTo(Math.cos(qa2) * R * 0.46, Math.sin(qa2) * R * 0.46);
        c.stroke();
      }
      c.fillStyle = '#7a848f';
      c.beginPath(); c.arc(0, 0, R * 0.2, 0, TAU); c.fill();
    } else if (def.hub === 'spike'){
      c.fillStyle = '#d9e2ea';
      starPath(c, 0, 0, R * 0.36, R * 0.16, 6); c.fill();
      c.fillStyle = '#7a848f';
      c.beginPath(); c.arc(0, 0, R * 0.14, 0, TAU); c.fill();
    } else {
      c.strokeStyle = id === 'basic' ? '#94a0ac' : def.rim;
      c.lineWidth = Math.max(1.8, R * 0.16);
      c.lineCap = 'round';
      for (var q = 0; q < 5; q++){
        var qa = spin + q * TAU / 5;
        c.beginPath();
        c.moveTo(Math.cos(qa) * R * 0.2, Math.sin(qa) * R * 0.2);
        c.lineTo(Math.cos(qa) * R * 0.48, Math.sin(qa) * R * 0.48);
        c.stroke();
      }
      c.fillStyle = id === 'basic' ? '#8792a0' : def.rim;
      c.beginPath(); c.arc(0, 0, R * 0.18, 0, TAU); c.fill();
      if (id === 'gold'){
        c.fillStyle = '#fff6b8';
        starPath(c, 0, 0, R * 0.14, R * 0.06, 5); c.fill();
      }
    }
    c.restore();
  }

  function face(c, x, y, s){
    s = s || 1;
    c.save(); c.translate(x, y); c.scale(s, s);

  function carRocket(c, color, spin, t, fast){

  function drawCarAt(c, px, py, rot, type, color, o){
    o = o || {};
    var sc = o.scale || 1;
    c.save();
    c.translate(px, py);
    c.rotate(rot || 0);
    c.scale(sc, sc);

    if (o.inWater){
      c.save();
      c.translate(0, 6);
      c.fillStyle = '#ff9f45';
      c.beginPath(); c.ellipse(0, 0, 46, 11, 0, 0, TAU); c.fill();
      c.fillStyle = '#fff4e0';
      for (var i = 0; i < 4; i++){
        var a = i / 4 * TAU + 0.4;
        c.beginPath(); c.arc(Math.cos(a) * 34, Math.sin(a) * 5, 5, 0, TAU); c.fill();
      }
      c.restore();
    }

    if (o.shadow !== false){
      c.save();
      c.globalAlpha = 0.18;
      c.fillStyle = '#123a24';
      c.beginPath(); c.ellipse(0, 3, 48, 8, 0, 0, TAU); c.fill();
      c.restore();
    }

    var spin = o.spin || 0;
    var t = o.t || 0;
    if (type === 'monster') carMonster(c, color, spin, t);
    else if (type === 'police') carPolice(c, color, spin, t);
    else if (type === 'fire') carFire(c, color, spin, t);
    else if (type === 'rocket') carRocket(c, color, spin, t, o.fast);
    else if (type === 'tank') carTank(c, color, spin, t);
    else if (type === 'boat') carBoat(c, color, spin, t);
    else if (type === 'dino') carDino(c, color, spin, t);
    else if (type === 'dozer') carDozer(c, color, spin, t);
    else if (type === 'plane') carPlane(c, color, spin, t);
    else if (type === 'train') carTrain(c, color, spin, t);
    else if (type === 'f1') carF1(c, color, spin, t);
    else if (type === 'ufo') carUfo(c, color, spin, t);
    else if (type === 'dragon') carDragon(c, color, spin, t);
    else if (type === 'ship') carShip(c, color, spin, t);
    else carBasic(c, color, spin, t);

    if (o.driver !== false){
      var seat = SEAT[type] || SEAT.basic;
      drawDriver(c, seat[0], seat[1], o.driverScale || 0.6);
    }

    if (o.inWater){
      c.save();
      c.globalAlpha = 0.55;
      c.fillStyle = '#d8f6ff';
      c.beginPath(); c.ellipse(0, 2, 40, 6, 0, 0, TAU); c.fill();
      c.restore();
    }
    c.restore();
  }

  function drawPlayerCar(){
    var car = G.car;
    var seg = waterSegAt(car.x);
    var inW = !!(seg && !seg.bridge);
    var sx = car.x - G.scrollX;
    var bob = inW ? Math.sin(G.t * 5.2) * 2.5 : 0;
    var wob = (G.slipT > 0) ? Math.sin(G.t * 22) * 0.13 * clamp(G.slipT, 0, 1) : 0;
    if (G.slowT > 0) wob += Math.sin(G.t * 19) * 0.10 * clamp(G.slowT, 0, 1);
    drawCarAt(ctx, sx, car.y + bob, car.rot + wob, save.car, save.color, {
      t: G.t, spin: car.spin, inWater: inW, fast: car.vx > 40
    });
    if (G.boostT > 0){
      // 부스터 별가루
      for (var i = 0; i < 2; i++){
        var bx = sx - 54 - Math.random() * 26;
        var by = car.y - 24 - Math.random() * 34;
        drawPartDot(bx, by, 3 + Math.random() * 3,
          'hsl(' + Math.floor(Math.random() * 360) + ',95%,68%)', 0.85);
      }
    }
  }

  /* ---------- 라이벌 ---------- */
  function drawRivals(){
    for (var i = G.rivals.length - 1; i >= 0; i--){
      var r = G.rivals[i];
      if (r.finished) continue;
      var sx = r.x - G.scrollX;
      if (sx < -140 || sx > G.W + 140) continue;
      ctx.save();
      ctx.globalAlpha = 0.95;
      drawCarAt(ctx, sx, r.y + (r.lane || 0), r.rot, r.car, r.color, {
        t: G.t, spin: r.spin, scale: r.dscale || 0.9, driver: false,
        shadow: true
      });
      ctx.restore();
    }
    for (var j = 0; j < G.rivals.length; j++){
      var q = G.rivals[j];
      if (q.finished) continue;
      var qx = q.x - G.scrollX;
      if (qx < -140 || qx > G.W + 140) continue;
      var tag = q.emoji + ' ' + q.name;
      ctx.save();
      ctx.font = '900 11.5px ' + FONT;
      var tw = ctx.measureText(tag).width;
      var ty = q.y - 104 + (q.lane || 0) - (j % 3) * 16;
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      rr(ctx, qx - tw / 2 - 7, ty - 12, tw + 14, 22, 11); ctx.fill();
      ctx.fillStyle = '#3a4f5f';

  function updateParts(dt){
    for (var i = G.parts.length - 1; i >= 0; i--){
      var p = G.parts[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += (p.grav || 0) * dt;
      p.life -= dt;
      if (p.life <= 0) G.parts.splice(i, 1);
    }
  }
  function drawParts(front){
    for (var i = 0; i < G.parts.length; i++){
      var p = G.parts[i];
      if (!!p.front !== front) continue;
      var sx = p.x - G.scrollX;
      if (sx < -60 || sx > G.W + 60) continue;
      var a = clamp(p.life / p.max, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      if (p.shape === 'ring'){
        ctx.strokeStyle = p.color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sx, p.y, p.size * (1.6 - a * 0.6), 0, TAU); ctx.stroke();
      } else {
        ctx.fillStyle = p.color;
        if (p.shape === 'star'){
          starPath(ctx, sx, p.y, p.size, p.size * 0.4, 5);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(sx, p.y, p.size * (1.15 - a * 0.3), 0, TAU);
          ctx.fill();
        }
      }
      ctx.restore();
    }
  }
